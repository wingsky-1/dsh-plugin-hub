# dsh-plugins-all 聚合 patch：向 web profile 名册插入已迁入插件。
# 安装命令：
#
#   dsh plugin --profile web add @wingsky/dsh-plugins-all
#
# （dsh plugin 在 profile 目录转发 pnpm 安装依赖，自动把声明了 dsh.bundle 的
# 已安装包加入 dsh.profile.bundles 层栈，本文件即作为 bundle 层生效。）
- insert:
    - id: dsh-gzip
      name: '@wingsky/dsh-gzip'
      config:
        enabled: true
