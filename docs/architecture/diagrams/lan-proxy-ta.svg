<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
<title id="title">dsh-lan-proxy 技术架构</title>
<desc id="desc">以功能模块为节点，展示技术架构中的职责与协作关系。实现细节见架构正文。</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#546780"/></marker></defs>
<rect width="1400" height="780" fill="#f5f5f5"/>
<text x="40" y="57" font-size="30" fill="#2d3142" font-family="system-ui,sans-serif">dsh-lan-proxy · TA 技术架构</text>
<rect x="395" y="112" width="975" height="532" rx="14" fill="#eef0f3" stroke="#d5dbe4"/>
<text x="413" y="139" font-size="16" fill="#64748b" font-family="system-ui,sans-serif">宿主机器 · DSH 进程与本地资源</text>

<path d="M340 240H540" fill="none" stroke="#546780" stroke-width="2" marker-end="url(#arrow)"/>
<text x="440" y="225" text-anchor="middle" font-size="16" font-family="system-ui,sans-serif" fill="#546780" style="paint-order:stroke;stroke:#f5f5f5;stroke-width:5px">HTTP(S) / WS(S)</text>
<path d="M690 290V460" fill="none" stroke="#546780" stroke-width="2" marker-end="url(#arrow)"/>
<text x="774" y="383" text-anchor="middle" font-size="16" font-family="system-ui,sans-serif" fill="#546780" style="paint-order:stroke;stroke:#f5f5f5;stroke-width:5px">请求与连接</text>
<path d="M840 510H940V280H1050" fill="none" stroke="#546780" stroke-width="2" marker-end="url(#arrow)"/>
<text x="986" y="368" text-anchor="middle" font-size="16" font-family="system-ui,sans-serif" fill="#546780" style="paint-order:stroke;stroke:#f5f5f5;stroke-width:5px">回环 HTTP / WS</text>
<path d="M190 460V290" fill="none" stroke="#546780" stroke-width="2" marker-end="url(#arrow)"/>
<text x="258" y="383" text-anchor="middle" font-size="16" font-family="system-ui,sans-serif" fill="#546780" style="paint-order:stroke;stroke:#f5f5f5;stroke-width:5px">界面集成</text>
<path d="M1200 460V375H860V270H840" fill="none" stroke="#546780" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1145" y="414" text-anchor="middle" font-size="16" font-family="system-ui,sans-serif" fill="#546780" style="paint-order:stroke;stroke:#f5f5f5;stroke-width:5px">配置与证书材料</text>
<g id="browser">
<rect x="40" y="190" width="300" height="100" rx="9" fill="#edf3fb" stroke="#5777a5" stroke-width="1.5"/>
<text x="60" y="230" font-family="system-ui,sans-serif" font-size="23" font-weight="600" fill="#2d3142">浏览器</text>
<text x="60" y="263" font-family="system-ui,sans-serif" font-size="17" fill="#546780">访问页面并保持会话连接</text>
</g>
<g id="listener">
<rect x="540" y="190" width="300" height="100" rx="9" fill="#ffffff" stroke="#d87a49" stroke-width="1.5"/>
<text x="560" y="230" font-family="system-ui,sans-serif" font-size="23" font-weight="600" fill="#2d3142">网络接入组件</text>
<text x="560" y="263" font-family="system-ui,sans-serif" font-size="17" fill="#546780">提供局域网 HTTP 与 HTTPS 入口</text>
</g>
<g id="upstream">
<rect x="1050" y="190" width="300" height="100" rx="9" fill="#edf3fb" stroke="#5777a5" stroke-width="1.5"/>
<text x="1070" y="230" font-family="system-ui,sans-serif" font-size="23" font-weight="600" fill="#2d3142">DSH Web 服务</text>
<text x="1070" y="263" font-family="system-ui,sans-serif" font-size="17" fill="#546780">提供页面、接口与会话服务</text>
</g>
<g id="settings">
<rect x="40" y="460" width="300" height="100" rx="9" fill="#edf3fb" stroke="#5777a5" stroke-width="1.5"/>
<text x="60" y="500" font-family="system-ui,sans-serif" font-size="23" font-weight="600" fill="#2d3142">浏览器插件组件</text>
<text x="60" y="533" font-family="system-ui,sans-serif" font-size="17" fill="#546780">提供设置界面与兼容提示</text>
</g>
<g id="transfer">
<rect x="540" y="460" width="300" height="100" rx="9" fill="#ffffff" stroke="#d87a49" stroke-width="1.5"/>
<text x="560" y="500" font-family="system-ui,sans-serif" font-size="23" font-weight="600" fill="#2d3142">转发与桥接组件</text>
<text x="560" y="533" font-family="system-ui,sans-serif" font-size="17" fill="#546780">处理 HTTP 转发与 WebSocket 桥接</text>
</g>
<g id="disk">
<rect x="1050" y="460" width="300" height="100" rx="9" fill="#edf3fb" stroke="#5777a5" stroke-width="1.5"/>
<text x="1070" y="500" font-family="system-ui,sans-serif" font-size="23" font-weight="600" fill="#2d3142">配置与证书管理组件</text>
<text x="1070" y="533" font-family="system-ui,sans-serif" font-size="17" fill="#546780">提供访问配置与加密材料</text>
</g>
<text x="40" y="753" font-size="14" fill="#64748b" font-family="system-ui,sans-serif">功能模块视图 · 连线表示模块协作 · 函数、字段及运行机制详见架构正文</text>
</svg>