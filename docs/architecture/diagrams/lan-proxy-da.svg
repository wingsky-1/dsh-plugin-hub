<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1660" role="img" aria-labelledby="da-title da-desc"><title id="da-title">dsh-lan-proxy · DA 数据架构</title><desc id="da-desc">配置谱系、证书缓存、单次认证上下文与实例统计：分别画清读写者及失效条件。</desc><defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
