<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 736" role="img" aria-labelledby="da-title da-desc"><title id="da-title">dsh-lan-proxy DA 数据架构</title><desc id="da-desc">官方 settings 持有配置；证书、认证与实例计数不能混成一个状态库。 迁移：先 rename 为 bak，再净化写 scope；失败尝试还原。bak 不等于永不重放的完成标记。</desc><defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4f5d75"/></marker><style>.card{fill:#fff;stroke:#b7becb;stroke-width:1.2}.heading{font:600 21px 'Geist',sans-serif;fill:#2d3142}.body{font:17px 'Geist',sans-serif;fill:#2d3142}.evidence{font:13px 'Geist Mono',monospace;fill:#4f5d75}.edge{fill:none;stroke:#4f5d75;stroke-width:1.5}.edge-label{font:15px 'Geist',sans-serif;fill:#4f5d75}</style></defs><rect width="1240" height="736" fill="#f5f5f5"/><text x="30" y="44" class="heading">dsh-lan-proxy · DA 数据架构</text><text x="30" y="76" class="body">官方 settings 持有配置；证书、认证与实例计数不能混成一个状态库。</text><path d="M 450 198 H 370" class="edge" marker-end="url(#arrow)"/><text x="410" y="185" class="edge-label" text-anchor="middle">写入 user</text>
<path d="M 790 198 H 870" class="edge" marker-end="url(#arrow)"/><text x="830" y="185" class="edge-label" text-anchor="middle">写后生效</text>
<path d="M 200 420 V 288" class="edge" marker-end="url(#arrow)"/><text x="210" y="354" class="edge-label" text-anchor="start">旧文件迁移</text>
<path d="M 1040 288 V 420" class="edge" marker-end="url(#arrow)"/><text x="1050" y="354" class="edge-label" text-anchor="start">快照</text>
<path d="M 790 510 H 870" class="edge" marker-end="url(#arrow)"/><text x="830" y="497" class="edge-label" text-anchor="middle">分层诊断</text>
<g><rect x="30" y="108" width="340" height="180" rx="6" class="card"/><text x="50" y="143" class="heading">持久配置来源</text><text x="50" y="177" class="body">schema defaults → cordis base</text><text x="50" y="204" class="body">官方 settings user 层优先</text><text x="50" y="231" class="body">旧 config / bak 只参与迁移</text><text x="50" y="269" class="evidence">config/impl/namespace.ts</text></g>
<g><rect x="450" y="108" width="340" height="180" rx="6" class="card"/><text x="470" y="143" class="heading">配置写入协议</text><text x="470" y="177" class="body">PUT patch + expectedRevision</text><text x="470" y="204" class="body">校验 → update；清证书用 replace</text><text x="470" y="231" class="body">冲突 409；settings 缺席 503</text><text x="470" y="269" class="evidence">config/impl/routes.ts</text></g>
<g><rect x="870" y="108" width="340" height="180" rx="6" class="card"/><text x="890" y="143" class="heading">生效值与实例读数</text><text x="890" y="177" class="body">scope.get / watch → sync</text><text x="890" y="204" class="body">3s 防抖；重建会断开旧连接</text><text x="890" y="231" class="body">计数在新实例重新开始，不落盘</text><text x="890" y="269" class="evidence">server/apply.ts</text></g>
<g><rect x="30" y="420" width="340" height="180" rx="6" class="card"/><text x="50" y="455" class="heading">证书与旧备份</text><text x="50" y="489" class="body">DSH_HOME/lan-proxy/</text><text x="50" y="516" class="body">证书缓存；自签名私钥 0600</text><text x="50" y="543" class="body">bak 后续启动仍可能重放</text><text x="50" y="581" class="evidence">tls/impl/index.ts · migrate/impl/file</text></g>
<g><rect x="450" y="420" width="340" height="180" rx="6" class="card"/><text x="470" y="455" class="heading">认证与页面状态</text><text x="470" y="489" class="body">token 每请求现读，不自建凭据库</text><text x="470" y="516" class="body">cookie 由浏览器 / 宿主认证持有</text><text x="470" y="543" class="body">marker 仅代表本页曾执行注入</text><text x="470" y="581" class="evidence">proxy/impl/proxy.ts · host-trust</text></g>
<g><rect x="870" y="420" width="340" height="180" rx="6" class="card"/><text x="890" y="455" class="heading">读取与解释边界</text><text x="890" y="489" class="body">config：user / effective / revision</text><text x="890" y="516" class="body">health：开关、句柄存在与统计</text><text x="890" y="543" class="body">不是端到端探活或授权证明</text><text x="890" y="581" class="evidence">server/apply.ts · compressSnapshot</text></g>
<path d="M30 648H1210" stroke="#eb6c36"/><text x="30" y="681" class="body">迁移：先 rename 为 bak，再净化写 scope；失败尝试还原。bak 不等于永不重放的完成标记。</text><text x="30" y="712" class="evidence">证据路径默认相对 packages/dsh-lan-proxy/src；构建与仓库规范路径除外。实线表示标注的调用或数据关系。</text></svg>