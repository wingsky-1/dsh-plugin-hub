<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 736" role="img" aria-labelledby="ba-title ba-desc"><title id="ba-title">dsh-lan-proxy BA 业务架构</title><desc id="ba-desc">局域网设备共享宿主能力，不增加用户隔离层。 阅读重点：TLS 是传输边界；injectToken 是访问授权；ownsHostCompat 是页面拓扑声明。</desc><defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4f5d75"/></marker><style>.card{fill:#fff;stroke:#b7becb;stroke-width:1.2}.heading{font:600 21px 'Geist',sans-serif;fill:#2d3142}.body{font:17px 'Geist',sans-serif;fill:#2d3142}.evidence{font:13px 'Geist Mono',monospace;fill:#4f5d75}.edge{fill:none;stroke:#4f5d75;stroke-width:1.5}.edge-label{font:15px 'Geist',sans-serif;fill:#4f5d75}</style></defs><rect width="1240" height="736" fill="#f5f5f5"/><text x="30" y="44" class="heading">dsh-lan-proxy · BA 业务架构</text><text x="30" y="76" class="body">局域网设备共享宿主能力，不增加用户隔离层。</text><path d="M 370 198 H 450" class="edge" marker-end="url(#arrow)"/><text x="410" y="185" class="edge-label" text-anchor="middle">访问</text>
<path d="M 790 198 H 870" class="edge" marker-end="url(#arrow)"/><text x="830" y="185" class="edge-label" text-anchor="middle">提供</text>
<path d="M 370 510 H 450" class="edge" marker-end="url(#arrow)"/><text x="410" y="497" class="edge-label" text-anchor="middle">配置</text>
<path d="M 790 510 H 870" class="edge" marker-end="url(#arrow)"/><text x="830" y="497" class="edge-label" text-anchor="middle">受约束</text>
<path d="M 200 420 V 288" class="edge" marker-end="url(#arrow)"/><text x="210" y="354" class="edge-label" text-anchor="start">管理设备</text>
<g><rect x="30" y="108" width="340" height="180" rx="6" class="card"/><text x="50" y="143" class="heading">使用者</text><text x="50" y="177" class="body">手机 / 平板 / 另一台电脑</text><text x="50" y="204" class="body">访问同一台宿主上的 dsh web</text><text x="50" y="231" class="body">不是独立部署的第二套会话服务</text><text x="50" y="269" class="evidence">README · 定位</text></g>
<g><rect x="450" y="108" width="340" height="180" rx="6" class="card"/><text x="470" y="143" class="heading">访问能力</text><text x="470" y="177" class="body">HTTP / HTTPS / WebSocket</text><text x="470" y="204" class="body">TLS、WS 保活与按需压缩</text><text x="470" y="231" class="body">浏览器仍使用宿主会话与认证</text><text x="470" y="269" class="evidence">server/apply.ts · apply</text></g>
<g><rect x="870" y="108" width="340" height="180" rx="6" class="card"/><text x="890" y="143" class="heading">可见结果</text><text x="890" y="177" class="body">同一套 Web UI 与会话</text><text x="890" y="204" class="body">启动横幅显示可访问地址</text><text x="890" y="231" class="body">health 暴露配置与实例读数</text><text x="890" y="269" class="evidence">server/apply.ts · health</text></g>
<g><rect x="30" y="420" width="340" height="180" rx="6" class="card"/><text x="50" y="455" class="heading">管理者</text><text x="50" y="489" class="body">设置 → 插件 → 局域网访问</text><text x="50" y="516" class="body">调整端口、证书、压缩与策略</text><text x="50" y="543" class="body">保存回执先返回，再延迟重建</text><text x="50" y="581" class="evidence">client/settings-card.tsx</text></g>
<g><rect x="450" y="420" width="340" height="180" rx="6" class="card"/><text x="470" y="455" class="heading">授权取舍</text><text x="470" y="489" class="body">injectToken 默认开启</text><text x="470" y="516" class="body">网络可达者可能获得宿主控制权</text><text x="470" y="543" class="body">ownsHostCompat 默认关闭</text><text x="470" y="581" class="evidence">server/config/impl/model.ts</text></g>
<g><rect x="870" y="420" width="340" height="180" rx="6" class="card"/><text x="890" y="455" class="heading">非目标与边界</text><text x="890" y="489" class="body">不是任意目标的开放代理</text><text x="890" y="516" class="body">不是多用户权限隔离或认证替代</text><text x="890" y="543" class="body">HTTPS 不代表缩小授权范围</text><text x="890" y="581" class="evidence">server/shared/net.ts</text></g>
<path d="M30 648H1210" stroke="#eb6c36"/><text x="30" y="681" class="body">阅读重点：TLS 是传输边界；injectToken 是访问授权；ownsHostCompat 是页面拓扑声明。</text><text x="30" y="712" class="evidence">证据路径默认相对 packages/dsh-lan-proxy/src；构建与仓库规范路径除外。实线表示标注的调用或数据关系。</text></svg>