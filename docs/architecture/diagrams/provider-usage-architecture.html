<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dsh-provider-usage 宿主端渲染架构</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame { max-width: 1240px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif); font-size: clamp(1.4rem, 2.2vw + 0.7rem, 1.9rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink);
      margin-bottom: 1.25rem;
    }
    svg { width: 100%; min-width: 1040px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · dsh-provider-usage</p>
    <h1>宿主端渲染：一次取数，两份 HTML</h1>

    <svg viewBox="0 0 1160 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="usage-title usage-desc">
      <title id="usage-title">dsh-provider-usage 宿主端渲染架构</title>
      <desc id="usage-desc">适配器在宿主进程取数并渲染胶囊与面板 HTML，经 7 条路由下发；客户端只轮询注入，密钥不进浏览器；历史按天分片 JSONL 落盘。</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Zone: 宿主进程 -->
      <rect x="268" y="72" width="620" height="400" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="480" y="76" width="196" height="12" rx="2" fill="#f5f5f5"/>
      <text x="578" y="85" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">宿主进程（dsh web · Node）</text>

      <!-- Arrows (behind boxes) -->
      <!-- 浏览器 → /stats -->
      <path d="M 180,168 H 236 Q 244,168 244,176 V 192 Q 244,200 252,200 H 316"
            fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- 浏览器 → /history -->
      <line x1="180" y1="212" x2="316" y2="212" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- getStats → pipeline -->
      <line x1="500" y1="216" x2="596" y2="216" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- pipeline → 适配器 -->
      <line x1="696" y1="216" x2="796" y2="216" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- 适配器 → 外部 API -->
      <line x1="944" y1="216" x2="1044" y2="216" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- 路由 → 历史（面板走 /history 经路由读存储） -->
      <line x1="460" y1="256" x2="460" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- pipeline → 历史（落盘） -->
      <line x1="604" y1="248" x2="604" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="186" y="144" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="234" y="153" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET /stats</text>

      <rect x="186" y="188" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="238" y="197" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET /history</text>

      <rect x="716" y="196" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="748" y="205" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">注入</text>

      <rect x="964" y="196" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="996" y="205" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">fetch</text>

      <rect x="468" y="280" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="516" y="289" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">历史落盘</text>

      <rect x="612" y="302" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="636" y="311" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">落盘</text>

      <!-- Node: 浏览器 -->
      <rect x="40" y="120" width="140" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="120" width="140" height="96" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="128" width="36" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="66" y="137" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
      <text x="110" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">浏览器客户端</text>
      <text x="110" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">胶囊 · 面板 · 设置页</text>
      <text x="110" y="186" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">60s 轮询 / 注入 HTML</text>

      <!-- Node: 胶囊 -->
      <rect x="110" y="272" width="140" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="110" y="272" width="140" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="118" y="280" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="136" y="289" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PILL</text>
      <text x="180" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">悬浮胶囊</text>
      <text x="180" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">capsuleHtml 注入</text>

      <!-- Node: 面板 -->
      <rect x="110" y="380" width="140" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="110" y="380" width="140" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="118" y="388" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="136" y="397" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PANEL</text>
      <text x="180" y="416" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">详情面板</text>
      <text x="180" y="432" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">panelHtml 注入</text>

      <!-- Node: 路由 -->
      <rect x="316" y="192" width="184" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="316" y="192" width="184" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="324" y="200" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="350" y="209" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROUTES</text>
      <text x="408" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">7 条 HTTP 路由</text>
      <text x="408" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">loopback 围栏（403/405）</text>

      <!-- Node: getStats（focal） -->
      <rect x="500" y="184" width="96" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="500" y="184" width="96" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="508" y="192" width="40" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="528" y="201" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATS</text>
      <text x="548" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">getStats()</text>
      <text x="548" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">缓存 TTL · Mutex</text>

      <!-- Node: 管道 -->
      <rect x="596" y="184" width="100" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="596" y="184" width="100" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="604" y="192" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="624" y="201" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PIPE</text>
      <text x="646" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">渲染管道</text>
      <text x="646" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fetch → format</text>

      <!-- Node: 适配器 -->
      <rect x="796" y="184" width="148" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="796" y="184" width="148" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="804" y="192" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="830" y="201" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ADAPTER</text>
      <text x="870" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">用户适配器 .mjs</text>
      <text x="870" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fetchData · format*</text>

      <!-- Node: 外部 API -->
      <rect x="1044" y="184" width="96" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="1044" y="184" width="96" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="1052" y="192" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="1070" y="201" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="1092" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">外部用量 API</text>
      <text x="1092" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">DeepSeek / OpenCode</text>

      <!-- Node: 历史 -->
      <rect x="444" y="360" width="168" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="444" y="360" width="168" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="452" y="368" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="472" y="377" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HIST</text>
      <text x="528" y="396" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HistoryStore</text>
      <text x="528" y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">按天分片 JSONL</text>

      <!-- Legend strip -->
      <line x1="40" y1="508" x2="1120" y2="508" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="524" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="532" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="540" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal（取数主链路）</text>

      <line x1="230" y1="537" x2="258" y2="537" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="266" y="540" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP（用户适配器出站）</text>

      <line x1="460" y1="537" x2="488" y2="537" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="496" y="540" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">数据流 / 落盘</text>
    </svg>
  </div>
</body>
</html>
