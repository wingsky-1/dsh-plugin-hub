<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1400 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="naa-title naa-desc">
<title id="naa-title">AA 应用架构 · 功能模块如何协作</title><desc id="naa-desc">八个功能模块展示事件与服务接入、通知管线、频道适配、配置存储和浏览器接口的主要协作。</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#d7dbe1"/></pattern><marker id="blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#2e5aa8"/></marker><marker id="orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#eb6c36"/></marker></defs>
<rect width="1400" height="800" fill="#f5f5f5"/><rect width="1400" height="800" fill="url(#dots)" opacity=".5"/>
<g font-family="'Geist',system-ui,sans-serif"><text x="40" y="53" font-size="32" font-weight="600" fill="#2d3142">AA 应用架构 · 功能模块如何协作</text><text x="40" y="87" font-size="17" fill="#4f5d75">dsh-notifier · 功能模块视图 · 基线 473584ce · 橙：通知投递　蓝：配置与数据</text>
<path d="M370 240 H420 V400 H480" fill="none" stroke="#eb6c36" stroke-width="2" marker-end="url(#orange)"/><text x="422" y="318" text-anchor="middle" font-size="17" fill="#4f5d75" paint-order="stroke" stroke="#f5f5f5" stroke-width="6" stroke-linejoin="round">事件请求</text>
<path d="M370 450 H480" fill="none" stroke="#eb6c36" stroke-width="2" marker-end="url(#orange)"/><text x="425" y="437" text-anchor="middle" font-size="17" fill="#4f5d75" paint-order="stroke" stroke="#f5f5f5" stroke-width="6" stroke-linejoin="round">插件请求</text>
<path d="M640 250 V370" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#blue)"/><text x="699" y="315" text-anchor="middle" font-size="17" fill="#4f5d75" paint-order="stroke" stroke="#f5f5f5" stroke-width="6" stroke-linejoin="round">当前配置</text>
<path d="M800 400 H875 V240 H960" fill="none" stroke="#eb6c36" stroke-width="2" marker-end="url(#orange)"/><text x="877" y="319" text-anchor="middle" font-size="17" fill="#4f5d75" paint-order="stroke" stroke="#f5f5f5" stroke-width="6" stroke-linejoin="round">频道投递</text>
<path d="M800 450 H960" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#blue)"/><text x="880" y="437" text-anchor="middle" font-size="17" fill="#4f5d75" paint-order="stroke" stroke="#f5f5f5" stroke-width="6" stroke-linejoin="round">投递记录</text>
<path d="M640 470 V600" fill="none" stroke="#eb6c36" stroke-width="2" marker-end="url(#orange)"/><text x="714" y="542" text-anchor="middle" font-size="17" fill="#4f5d75" paint-order="stroke" stroke="#f5f5f5" stroke-width="6" stroke-linejoin="round">浏览器通知帧</text>
<path d="M480 650 H370" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#blue)"/><text x="425" y="637" text-anchor="middle" font-size="17" fill="#4f5d75" paint-order="stroke" stroke="#f5f5f5" stroke-width="6" stroke-linejoin="round">配置 / 通知</text>
<path d="M800 650 H1120 V510" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#blue)"/><text x="976" y="637" text-anchor="middle" font-size="17" fill="#4f5d75" paint-order="stroke" stroke="#f5f5f5" stroke-width="6" stroke-linejoin="round">查询历史 / 状态</text>
<g id="events" class="module"><rect x="50" y="190" width="320" height="100" rx="8" fill="#fff8f3" stroke="#eb6c36" stroke-width="1.6"/><text x="70" y="229" font-size="24" font-weight="600" fill="#2d3142">事件接入</text><text x="70" y="263" font-size="18" fill="#4f5d75">将宿主事件转为统一通知请求。</text></g>
<g id="sdk" class="module"><rect x="50" y="410" width="320" height="100" rx="8" fill="#fff8f3" stroke="#eb6c36" stroke-width="1.6"/><text x="70" y="449" font-size="24" font-weight="600" fill="#2d3142">通知 SDK</text><text x="70" y="483" font-size="18" fill="#4f5d75">接入插件通知与自定义通知类型。</text></g>
<g id="config" class="module"><rect x="480" y="150" width="320" height="100" rx="8" fill="#f1f5fb" stroke="#2e5aa8" stroke-width="1.6"/><text x="500" y="189" font-size="24" font-weight="600" fill="#2d3142">配置管理</text><text x="500" y="223" font-size="18" fill="#4f5d75">提供当前配置并保存用户偏好。</text></g>
<g id="pipeline" class="module"><rect x="480" y="370" width="320" height="100" rx="8" fill="#fff8f3" stroke="#eb6c36" stroke-width="1.6"/><text x="500" y="409" font-size="24" font-weight="600" fill="#2d3142">通知管线</text><text x="500" y="443" font-size="18" fill="#4f5d75">统一执行策略与投递编排。</text></g>
<g id="channels" class="module"><rect x="960" y="190" width="320" height="100" rx="8" fill="#fff8f3" stroke="#eb6c36" stroke-width="1.6"/><text x="980" y="229" font-size="24" font-weight="600" fill="#2d3142">频道适配</text><text x="980" y="263" font-size="18" fill="#4f5d75">对接系统、Bark 与 Webhook。</text></g>
<g id="stores" class="module"><rect x="960" y="410" width="320" height="100" rx="8" fill="#f1f5fb" stroke="#2e5aa8" stroke-width="1.6"/><text x="980" y="449" font-size="24" font-weight="600" fill="#2d3142">记录存储</text><text x="980" y="483" font-size="18" fill="#4f5d75">维护通知历史与频道投递状态。</text></g>
<g id="api" class="module"><rect x="480" y="600" width="320" height="100" rx="8" fill="#f1f5fb" stroke="#2e5aa8" stroke-width="1.6"/><text x="500" y="639" font-size="24" font-weight="600" fill="#2d3142">管理与通知流 API</text><text x="500" y="673" font-size="18" fill="#4f5d75">提供配置查询、测试与通知推流。</text></g>
<g id="browser" class="module"><rect x="50" y="600" width="320" height="100" rx="8" fill="#f1f5fb" stroke="#2e5aa8" stroke-width="1.6"/><text x="70" y="639" font-size="24" font-weight="600" fill="#2d3142">浏览器客户端</text><text x="70" y="673" font-size="18" fill="#4f5d75">展示通知并提供设置与历史界面。</text></g>
<text x="40" y="773" font-size="17" fill="#4f5d75">只展开主要运行协作；启动迁移的数据归属见 DA，进程与平台边界见 TA。</text></g>
</svg>