<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1520 960" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="naa-title naa-desc"><title id="naa-title">AA 应用架构：组合根、能力接口与浏览器衔接</title><desc id="naa-desc">dsh-notifier 0.2.4，源码核对基线 5e05e6d5。实线为具体调用或结果，虚线为标注的控制或生命周期关系；不表示阅读顺序。</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#d7dbe1"/></pattern><marker id="orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#eb6c36"/></marker><marker id="blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#2e5aa8"/></marker></defs><rect width="1520" height="960" fill="#f5f5f5"/><rect width="1520" height="960" fill="url(#dots)" opacity=".55"/>
<g font-family="'Geist',system-ui,sans-serif"><text x="30" y="42" font-size="27" fill="#2d3142">AA 应用架构：组合根、能力接口与浏览器衔接</text><text x="30" y="70" font-size="13" fill="#4f5d75">dsh-notifier · 0.2.4 · 5e05e6d5 · 橙：请求 / 投递　蓝：能力 / 控制 / 边界</text>
<g><rect x="30" y="105" width="1460" height="100" rx="8" fill="#fff8f3" stroke="#eb6c36"/><text x="46" y="128" font-size="11" fill="#eb6c36">唯一组合根 · src/index.ts</text><text x="46" y="155" font-size="19" fill="#2d3142">apply → bindHost → assemble</text><text x="46" y="181" font-size="14" fill="#4f5d75">inject: webServer / settings；按 upgrade → config → stores → pipeline → events → sdk → api 装配，传能力而非配置快照</text></g><g><rect x="30" y="255" width="295" height="123" rx="8" fill="#f1f5fb" stroke="#2e5aa8"/><text x="46" y="278" font-size="11" fill="#2e5aa8">启动域 · upgrade</text><text x="46" y="305" font-size="19" fill="#2d3142">installUpgrade</text><text x="46" y="331" font-size="14" fill="#4f5d75">legacySettings → 迁移磁盘</text>
<text x="46" y="353" font-size="14" fill="#4f5d75">先于所有读盘域；失败中止启动</text></g><g><rect x="420" y="255" width="425" height="123" rx="8" fill="#f1f5fb" stroke="#2e5aa8"/><text x="436" y="278" font-size="11" fill="#2e5aa8">配置域 · config/interface.ts</text><text x="436" y="305" font-size="19" fill="#2d3142">readConfig / writeConfig</text><text x="436" y="331" font-size="14" fill="#4f5d75">ConfigStore：stored / user / effective</text>
<text x="436" y="353" font-size="14" fill="#4f5d75">api 与 sdk 读写；pipeline 与 stores 只读</text></g><g><rect x="975" y="255" width="515" height="123" rx="8" fill="#f1f5fb" stroke="#2e5aa8"/><text x="991" y="278" font-size="11" fill="#2e5aa8">存储域 · stores/interface.ts</text><text x="991" y="305" font-size="19" fill="#2d3142">appendHistory / recordStatus</text><text x="991" y="331" font-size="14" fill="#4f5d75">HistoryStore / StatusStore</text>
<text x="991" y="353" font-size="14" fill="#4f5d75">api 读历史、清空历史、读状态；无裁决职责</text></g><path d="M180 205 V255" fill="none" stroke="#2e5aa8" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#blue)"/><text x="195" y="233" font-size="12" fill="#2e5aa8">install</text><path d="M633 205 V255" fill="none" stroke="#2e5aa8" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#blue)"/><path d="M1230 205 V255" fill="none" stroke="#2e5aa8" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#blue)"/><path d="M975 318 H845" fill="none" stroke="#2e5aa8" stroke-width="1.7"  marker-end="url(#blue)"/><text x="864" y="306" font-size="12" fill="#2e5aa8">readConfig</text><g><rect x="30" y="445" width="300" height="121" rx="8" fill="#fff8f3" stroke="#eb6c36"/><text x="46" y="468" font-size="11" fill="#eb6c36">事件域 · events</text><text x="46" y="495" font-size="19" fill="#2d3142">EventListener / agentStates</text><text x="46" y="521" font-size="14" fill="#4f5d75">七项全局订阅 → 翻译 / 完成证据</text>
<text x="46" y="543" font-size="14" fill="#4f5d75">只产出请求，开关交给 pipeline</text></g><g><rect x="30" y="620" width="300" height="121" rx="8" fill="#fff8f3" stroke="#eb6c36"/><text x="46" y="643" font-size="11" fill="#eb6c36">服务域 · sdk</text><text x="46" y="670" font-size="19" fill="#2d3142">wingsky.notifier</text><text x="46" y="696" font-size="14" fill="#4f5d75">registerKind / send；apiVersion=2</text>
<text x="46" y="718" font-size="14" fill="#4f5d75">KindRegistry；config 持久化确认态</text></g><g><rect x="440" y="445" width="415" height="182" rx="8" fill="#fff8f3" stroke="#eb6c36"/><text x="456" y="468" font-size="11" fill="#eb6c36">唯一裁决域 · pipeline/interface.ts</text><text x="456" y="495" font-size="19" fill="#2d3142">NotificationPipeline.submit</text><text x="456" y="521" font-size="14" fill="#4f5d75">judgeRequest → routeTargets</text>
<text x="456" y="543" font-size="14" fill="#4f5d75">→ finalizeRequest → Dispatcher.dispatch</text>
<text x="456" y="565" font-size="14" fill="#4f5d75">stores：归档 / 记录逐频道终态</text>
<text x="456" y="587" font-size="14" fill="#4f5d75">frames.emit：仅 browser target</text></g><path d="M330 502 H440" fill="none" stroke="#eb6c36" stroke-width="1.7"  marker-end="url(#orange)"/><text x="354" y="490" font-size="12" fill="#4f5d75">submit</text><path d="M330 681 H385 V581 H440" fill="none" stroke="#eb6c36" stroke-width="1.7"  marker-end="url(#orange)"/><text x="350" y="668" font-size="12" fill="#4f5d75">submit</text><path d="M645 445 V378" fill="none" stroke="#2e5aa8" stroke-width="1.7"  marker-end="url(#blue)"/><text x="659" y="414" font-size="12" fill="#2e5aa8">readConfig</text><path d="M855 478 H918 V400 H1230 V378" fill="none" stroke="#2e5aa8" stroke-width="1.7"  marker-end="url(#blue)"/><text x="931" y="410" font-size="12" fill="#2e5aa8">appendHistory / recordStatus</text><g><rect x="1060" y="465" width="430" height="162" rx="8" fill="#fff8f3" stroke="#eb6c36"/><text x="1076" y="488" font-size="11" fill="#eb6c36">出口域 · channels/interface.ts</text><text x="1076" y="515" font-size="19" fill="#2d3142">deliver / 能力探测</text><text x="1076" y="541" font-size="14" fill="#4f5d75">browser / system / Bark / Webhook</text>
<text x="1076" y="563" font-size="14" fill="#4f5d75">无域级 install；无其它功能域依赖</text>
<text x="1076" y="585" font-size="14" fill="#4f5d75">api 只获只读探测面，拿不到 deliver</text></g><path d="M855 554 H1060" fill="none" stroke="#eb6c36" stroke-width="1.7"  marker-end="url(#orange)"/><text x="910" y="542" font-size="12" fill="#4f5d75">deliver(target)</text><g><rect x="470" y="690" width="300" height="112" rx="8" fill="#f1f5fb" stroke="#2e5aa8"/><text x="486" y="713" font-size="11" fill="#2e5aa8">本地设施 · 组合根私有</text><text x="486" y="740" font-size="19" fill="#2d3142">FrameBus</text><text x="486" y="766" font-size="14" fill="#4f5d75">emit → onFrame；OutgoingFrame</text>
<text x="486" y="788" font-size="14" fill="#4f5d75">不是宿主公共事件总线</text></g><path d="M645 627 V690" fill="none" stroke="#eb6c36" stroke-width="1.7"  marker-end="url(#orange)"/><text x="660" y="658" font-size="12" fill="#4f5d75">emit</text><g><rect x="850" y="690" width="315" height="150" rx="8" fill="#f1f5fb" stroke="#2e5aa8"/><text x="866" y="713" font-size="11" fill="#2e5aa8">管理 / 流域 · api</text><text x="866" y="740" font-size="19" fill="#2d3142">ApiService / StreamHub</text><text x="866" y="766" font-size="14" fill="#4f5d75">Settings / Journal / Kinds / Probe</text>
<text x="866" y="788" font-size="14" fill="#4f5d75">/test → submit；/events → SSE</text>
<text x="866" y="810" font-size="14" fill="#4f5d75">依赖 config / stores / sdk / 探测面</text></g><path d="M770 744 H850" fill="none" stroke="#2e5aa8" stroke-width="1.7"  marker-end="url(#blue)"/><text x="782" y="730" font-size="12" fill="#2e5aa8">onFrame</text><g><rect x="1230" y="690" width="260" height="150" rx="8" fill="#f1f5fb" stroke="#2e5aa8"/><text x="1246" y="713" font-size="11" fill="#2e5aa8">浏览器入口 · client/index.tsx</text><text x="1246" y="740" font-size="19" fill="#2d3142">apply / SettingsCard</text><text x="1246" y="766" font-size="14" fill="#4f5d75">通知半区无需打开设置页</text>
<text x="1246" y="788" font-size="14" fill="#4f5d75">session → policy / lease</text>
<text x="1246" y="810" font-size="14" fill="#4f5d75">→ display / audio / title</text></g><path d="M1165 748 H1230" fill="none" stroke="#2e5aa8" stroke-width="1.7"  marker-end="url(#blue)"/><text x="1182" y="733" font-size="12" fill="#2e5aa8">SSE</text><path d="M1358 840 V869 H1008 V840" fill="none" stroke="#2e5aa8" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#blue)"/><text x="1040" y="861" font-size="12" fill="#2e5aa8">ROUTES + fetch：管理 API</text><text x="30" y="846" font-size="13" fill="#2e5aa8">SDK 配置能力</text><text x="30" y="868" font-size="13" fill="#4f5d75">readConfig / writeConfig；confirmKind 仅供 api 管理面</text><text x="30" y="914" font-size="13" fill="#4f5d75">依赖边为消费方 → 能力提供方；帧 / SSE 边为生产方 → 消费方。组合根负责所有域接线，图中只展开关键运行关系。</text><text x="30" y="939" font-size="12" fill="#4f5d75">证据：src/index.ts#assemble / FrameBus · src/server/*/{interface,deps}.ts · src/client/index.tsx 与 notify/*</text>
</g></svg>