<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1400 920" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nda-title nda-desc"><title id="nda-title">DA 数据架构：持久化与生命周期</title><desc id="nda-desc">notifier 0.2.4 四视图；源码基线 80a8584a，静态机制，不代表实机验证。</desc><defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#d7dbe1"/></pattern><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker></defs><rect width="1400" height="920" fill="#f5f5f5"/><rect width="1400" height="920" fill="url(#dots)" opacity="0.55"/><text x="40" y="48" fill="#2d3142" font-family="'Instrument Serif',serif" font-size="27">DA 数据架构：持久化与生命周期</text><text x="40" y="78" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="13">dsh-notifier · 0.2.4 · 80a8584a · 路径证据省略 packages/dsh-notifier/src/ 前缀</text><g><rect x="40" y="125" width="420" height="280" rx="8" fill="#fff8f3" stroke="#eb6c36"/><text x="60" y="155" font-family="'Geist Mono',monospace" font-size="13" fill="#4f5d75">迁移优先</text><text x="60" y="192" font-family="'Geist',sans-serif" font-size="20" font-weight="600" fill="#2d3142">upgrade：0.2.3 → 0.2.4</text><text x="60" y="235" font-family="'Geist',sans-serif" font-size="16" fill="#4f5d75">布局 → 配置 → 结构化理由</text><text x="60" y="270" font-family="'Geist',sans-serif" font-size="16" fill="#4f5d75">旧 settings 文档 → 服务面 → 旧 JSON</text><text x="60" y="305" font-family="'Geist',sans-serif" font-size="16" fill="#4f5d75">成功后写 version；失败中止启动</text><line x1="60" y1="335" x2="440" y2="335" stroke="#d7dbe1"/><text x="60" y="362" font-family="'Geist Mono',monospace" font-size="11" fill="#4f5d75">server/upgrade/impl/steps/index.ts</text><text x="60" y="382" font-family="'Geist Mono',monospace" font-size="12" fill="#2e5aa8">#STEPS</text></g><g><rect x="490" y="125" width="420" height="280" rx="8" fill="#fff8f3" stroke="#eb6c36"/><text x="510" y="155" font-family="'Geist Mono',monospace" font-size="13" fill="#4f5d75">配置</text><text x="510" y="192" font-family="'Geist',sans-serif" font-size="20" font-weight="600" fill="#2d3142">config.json 与内存三层</text><text x="510" y="235" font-family="'Geist',sans-serif" font-size="16" fill="#4f5d75">stored → user → effective</text><text x="510" y="270" font-family="'Geist',sans-serif" font-size="16" fill="#4f5d75">掩码还原 → 校验 → 队列 commit</text><text x="510" y="305" font-family="'Geist',sans-serif" font-size="16" fill="#4f5d75">摘要 revision；写成功才 adopt</text><line x1="510" y1="335" x2="890" y2="335" stroke="#d7dbe1"/><text x="510" y="362" font-family="'Geist Mono',monospace" font-size="11" fill="#4f5d75">server/config/impl/service/index.ts</text><text x="510" y="382" font-family="'Geist Mono',monospace" font-size="12" fill="#2e5aa8">#ConfigStore</text></g><g><rect x="940" y="125" width="420" height="280" rx="8" fill="#fff8f3" stroke="#eb6c36"/><text x="960" y="155" font-family="'Geist Mono',monospace" font-size="13" fill="#4f5d75">归档</text><text x="960" y="192" font-family="'Geist',sans-serif" font-size="20" font-weight="600" fill="#2d3142">history.jsonl / status.json</text><text x="960" y="235" font-family="'Geist',sans-serif" font-size="16" fill="#4f5d75">历史：串行读改写，不是 appendFile</text><text x="960" y="270" font-family="'Geist',sans-serif" font-size="16" fill="#4f5d75">读最多 200；超过 400 行时压至 200</text><text x="960" y="305" font-family="'Geist',sans-serif" font-size="16" fill="#4f5d75">状态：500ms 合并写，record 淘汰至 64</text><line x1="960" y1="335" x2="1340" y2="335" stroke="#d7dbe1"/><text x="960" y="362" font-family="'Geist Mono',monospace" font-size="11" fill="#4f5d75">server/stores/impl/history/index.ts</text><text x="960" y="382" font-family="'Geist Mono',monospace" font-size="12" fill="#2e5aa8">#HistoryStore</text></g><g><rect x="40" y="475" width="420" height="280" rx="8" fill="#f1f5fb" stroke="#2e5aa8"/><text x="60" y="505" font-family="'Geist Mono',monospace" font-size="13" fill="#4f5d75">通知流</text><text x="60" y="542" font-family="'Geist',sans-serif" font-size="20" font-weight="600" fill="#2d3142">FrameBus → StreamHub → SSE</text><text x="60" y="585" font-family="'Geist',sans-serif" font-size="16" fill="#4f5d75">seq.json 仅存整数；replay 内存 200 帧</text><text x="60" y="620" font-family="'Geist',sans-serif" font-size="16" fill="#4f5d75">body → message；pop → playOnly</text><text x="60" y="655" font-family="'Geist',sans-serif" font-size="16" fill="#4f5d75">开流立即 flush；30s 心跳</text><line x1="60" y1="685" x2="440" y2="685" stroke="#d7dbe1"/><text x="60" y="712" font-family="'Geist Mono',monospace" font-size="11" fill="#4f5d75">server/api/impl/stream/index.ts</text><text x="60" y="732" font-family="'Geist Mono',monospace" font-size="12" fill="#2e5aa8">#StreamHub</text></g><g><rect x="490" y="475" width="420" height="280" rx="8" fill="#f1f5fb" stroke="#2e5aa8"/><text x="510" y="505" font-family="'Geist Mono',monospace" font-size="13" fill="#4f5d75">客户端水位</text><text x="510" y="542" font-family="'Geist',sans-serif" font-size="20" font-weight="600" fill="#2d3142">lastSeq 同时用于去重与 since</text><text x="510" y="585" font-family="'Geist',sans-serif" font-size="16" fill="#4f5d75">主动新建 EventSource URL 带 since</text><text x="510" y="620" font-family="'Geist',sans-serif" font-size="16" fill="#4f5d75">静默 60s 看门狗；65s 检查节拍</text><text x="510" y="655" font-family="'Geist',sans-serif" font-size="16" fill="#4f5d75">重连至少隔 5s；可见性恢复触发</text><line x1="510" y1="685" x2="890" y2="685" stroke="#d7dbe1"/><text x="510" y="712" font-family="'Geist Mono',monospace" font-size="11" fill="#4f5d75">client/notify/session.ts</text><text x="510" y="732" font-family="'Geist Mono',monospace" font-size="12" fill="#2e5aa8">#startNotifySession</text></g><g><rect x="940" y="475" width="420" height="280" rx="8" fill="#f1f5fb" stroke="#2e5aa8"/><text x="960" y="505" font-family="'Geist Mono',monospace" font-size="13" fill="#4f5d75">释放与缺口</text><text x="960" y="542" font-family="'Geist',sans-serif" font-size="20" font-weight="600" fill="#2d3142">不承诺无损退出或 exactly-once</text><text x="960" y="585" font-family="'Geist',sans-serif" font-size="16" fill="#4f5d75">重启丢 replay；序号写盘不挡广播</text><text x="960" y="620" font-family="'Geist',sans-serif" font-size="16" fill="#4f5d75">history.clear 与 append 存在竞争</text><text x="960" y="655" font-family="'Geist',sans-serif" font-size="16" fill="#4f5d75">status 卸载取消未触发 debounce</text><line x1="960" y1="685" x2="1340" y2="685" stroke="#d7dbe1"/><text x="960" y="712" font-family="'Geist Mono',monospace" font-size="11" fill="#4f5d75">server/stores/interface.ts</text><text x="960" y="732" font-family="'Geist Mono',monospace" font-size="12" fill="#2e5aa8">#releaseStores</text></g><path d="M460 265 H488 M910 265 H938" stroke="#eb6c36" stroke-width="2" marker-end="url(#arrow)" fill="none"/><text x="40" y="837" font-family="'Geist',sans-serif" font-size="16" fill="#2d3142">读图：上排为主线 / 结构，下排补充机制与边界；箭头表示阅读主线，具体依赖以框内说明为准。</text><text x="40" y="873" font-family="'Geist Mono',monospace" font-size="13" fill="#4f5d75">橙色：主线　蓝色：机制与约束　·　完整路径与证据语义见 dsh-notifier.md</text></svg>