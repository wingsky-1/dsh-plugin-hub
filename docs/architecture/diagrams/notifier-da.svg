<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1400 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nda-title nda-desc">
<title id="nda-title">DA 数据架构 · 数据由谁管理与传递</title><desc id="nda-desc">以配置管理、历史管理、状态管理、通知流管理、客户端、迁移和通知管线作为节点；连线描述数据。</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#d7dbe1"/></pattern><marker id="blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#2e5aa8"/></marker><marker id="orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#eb6c36"/></marker></defs>
<rect width="1400" height="800" fill="#f5f5f5"/><rect width="1400" height="800" fill="url(#dots)" opacity=".5"/>
<g font-family="'Geist',system-ui,sans-serif"><text x="40" y="53" font-size="32" font-weight="600" fill="#2d3142">DA 数据架构 · 数据由谁管理与传递</text><text x="40" y="87" font-size="17" fill="#4f5d75">dsh-notifier · 功能模块视图 · 基线 473584ce · 橙：通知投递　蓝：配置与数据</text>
<path d="M380 190 H520" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#blue)"/><text x="450" y="177" text-anchor="middle" font-size="17" fill="#4f5d75" paint-order="stroke" stroke="#f5f5f5" stroke-width="6" stroke-linejoin="round">迁移后配置</text>
<path d="M680 240 V290 H220 V450" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#blue)"/><text x="438" y="277" text-anchor="middle" font-size="17" fill="#4f5d75" paint-order="stroke" stroke="#f5f5f5" stroke-width="6" stroke-linejoin="round">生效配置</text>
<path d="M840 180 H1160 V350" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#blue)"/><text x="990" y="167" text-anchor="middle" font-size="17" fill="#4f5d75" paint-order="stroke" stroke="#f5f5f5" stroke-width="6" stroke-linejoin="round">掩码配置</text>
<path d="M1080 350 V250 H800 V240" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#blue)"/><text x="993" y="237" text-anchor="middle" font-size="17" fill="#4f5d75" paint-order="stroke" stroke="#f5f5f5" stroke-width="6" stroke-linejoin="round">偏好变更</text>
<path d="M380 480 H450 V400 H520" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#blue)"/><text x="451" y="388" text-anchor="middle" font-size="17" fill="#4f5d75" paint-order="stroke" stroke="#f5f5f5" stroke-width="6" stroke-linejoin="round">通知历史</text>
<path d="M380 530 H420 V630 H520" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#blue)"/><text x="446" y="654" text-anchor="middle" font-size="17" fill="#4f5d75" paint-order="stroke" stroke="#f5f5f5" stroke-width="6" stroke-linejoin="round">频道结果</text>
<path d="M840 400 H1000" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#blue)"/><text x="920" y="387" text-anchor="middle" font-size="17" fill="#4f5d75" paint-order="stroke" stroke="#f5f5f5" stroke-width="6" stroke-linejoin="round">历史数据</text>
<path d="M840 630 H920 V450 H1000" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#blue)"/><text x="922" y="548" text-anchor="middle" font-size="17" fill="#4f5d75" paint-order="stroke" stroke="#f5f5f5" stroke-width="6" stroke-linejoin="round">状态概况</text>
<path d="M220 550 V715 H1160 V680" fill="none" stroke="#eb6c36" stroke-width="2" marker-end="url(#orange)"/><text x="716" y="703" text-anchor="middle" font-size="17" fill="#4f5d75" paint-order="stroke" stroke="#f5f5f5" stroke-width="6" stroke-linejoin="round">浏览器通知数据</text>
<path d="M1160 580 V450" fill="none" stroke="#eb6c36" stroke-width="2" marker-end="url(#orange)"/><text x="1241" y="520" text-anchor="middle" font-size="17" fill="#4f5d75" paint-order="stroke" stroke="#f5f5f5" stroke-width="6" stroke-linejoin="round">实时 / 回放通知</text>
<g id="migration" class="module"><rect x="60" y="140" width="320" height="100" rx="8" fill="#f1f5fb" stroke="#2e5aa8" stroke-width="1.6"/><text x="80" y="179" font-size="24" font-weight="600" fill="#2d3142">存储迁移</text><text x="80" y="213" font-size="18" fill="#4f5d75">在启动时转换旧版数据与布局。</text></g>
<g id="config" class="module"><rect x="520" y="140" width="320" height="100" rx="8" fill="#f1f5fb" stroke="#2e5aa8" stroke-width="1.6"/><text x="540" y="179" font-size="24" font-weight="600" fill="#2d3142">配置管理</text><text x="540" y="213" font-size="18" fill="#4f5d75">保存用户偏好并提供生效配置。</text></g>
<g id="pipeline" class="module"><rect x="60" y="450" width="320" height="100" rx="8" fill="#fff8f3" stroke="#eb6c36" stroke-width="1.6"/><text x="80" y="489" font-size="24" font-weight="600" fill="#2d3142">通知管线</text><text x="80" y="523" font-size="18" fill="#4f5d75">产生投递记录与浏览器通知数据。</text></g>
<g id="history" class="module"><rect x="520" y="350" width="320" height="100" rx="8" fill="#f1f5fb" stroke="#2e5aa8" stroke-width="1.6"/><text x="540" y="389" font-size="24" font-weight="600" fill="#2d3142">历史管理</text><text x="540" y="423" font-size="18" fill="#4f5d75">保留通知经过与各频道投递记录。</text></g>
<g id="status" class="module"><rect x="520" y="580" width="320" height="100" rx="8" fill="#f1f5fb" stroke="#2e5aa8" stroke-width="1.6"/><text x="540" y="619" font-size="24" font-weight="600" fill="#2d3142">状态管理</text><text x="540" y="653" font-size="18" fill="#4f5d75">维护各频道最近结果与失败概况。</text></g>
<g id="client" class="module"><rect x="1000" y="350" width="320" height="100" rx="8" fill="#f1f5fb" stroke="#2e5aa8" stroke-width="1.6"/><text x="1020" y="389" font-size="24" font-weight="600" fill="#2d3142">客户端</text><text x="1020" y="423" font-size="18" fill="#4f5d75">编辑偏好并消费历史与通知数据。</text></g>
<g id="stream" class="module"><rect x="1000" y="580" width="320" height="100" rx="8" fill="#f1f5fb" stroke="#2e5aa8" stroke-width="1.6"/><text x="1020" y="619" font-size="24" font-weight="600" fill="#2d3142">通知流管理</text><text x="1020" y="653" font-size="18" fill="#4f5d75">管理通知广播与短期重连回放。</text></g>
<text x="40" y="773" font-size="17" fill="#4f5d75">持久数据由各管理模块维护；通知回放保留在内存中，不是可靠消息队列。</text></g>
</svg>