<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1520 960" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nta-title nta-desc"><title id="nta-title">TA 技术架构：进程、协议、重连与清理边界</title><desc id="nta-desc">dsh-notifier 0.2.4，源码核对基线 5e05e6d5。实线为具体调用或结果，虚线为标注的控制或生命周期关系；不表示阅读顺序。</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#d7dbe1"/></pattern><marker id="orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#eb6c36"/></marker><marker id="blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#2e5aa8"/></marker></defs><rect width="1520" height="960" fill="#f5f5f5"/><rect width="1520" height="960" fill="url(#dots)" opacity=".55"/>
<g font-family="'Geist',system-ui,sans-serif"><text x="30" y="42" font-size="27" fill="#2d3142">TA 技术架构：进程、协议、重连与清理边界</text><text x="30" y="70" font-size="13" fill="#4f5d75">dsh-notifier · 0.2.4 · 5e05e6d5 · 橙：请求 / 投递　蓝：能力 / 控制 / 边界</text>
<g><rect x="30" y="110" width="400" height="708" rx="10" fill="none" stroke="#b4bdca" stroke-dasharray="6 5"/></g><text x="45" y="138" font-size="16" fill="#2d3142">浏览器进程 · lib/client.js</text><g><rect x="505" y="110" width="565" height="708" rx="10" fill="none" stroke="#b4bdca" stroke-dasharray="6 5"/></g><text x="520" y="138" font-size="16" fill="#2d3142">dsh 宿主进程 · Node ≥20 / lib/index.js</text><g><rect x="1145" y="110" width="345" height="708" rx="10" fill="none" stroke="#b4bdca" stroke-dasharray="6 5"/></g><text x="1160" y="138" font-size="16" fill="#2d3142">进程外出口 / 资源</text><g><rect x="50" y="167" width="360" height="123" rx="8" fill="#f1f5fb" stroke="#2e5aa8"/><text x="66" y="190" font-size="11" fill="#2e5aa8">客户端 · slots / locale</text><text x="66" y="217" font-size="19" fill="#2d3142">startNotifySession</text><text x="66" y="243" font-size="14" fill="#4f5d75">EventSource；lastSeq 为内存水位</text>
<text x="66" y="265" font-size="14" fill="#4f5d75">onerror / 回前台 / 静默超时触发重连</text></g><g><rect x="525" y="167" width="525" height="123" rx="8" fill="#fff8f3" stroke="#eb6c36"/><text x="541" y="190" font-size="11" fill="#eb6c36">准入 · registerEndpoints</text><text x="541" y="217" font-size="19" fill="#2d3142">isLoopbackRequest → 方法检查</text><text x="541" y="243" font-size="14" fill="#4f5d75">peer + Host 回环；Origin authority 匹配</text>
<text x="541" y="265" font-size="14" fill="#4f5d75">默认拒 cross-site；先 403，再 405 + Allow</text></g><path d="M410 225 H525" fill="none" stroke="#2e5aa8" stroke-width="1.7"  marker-end="url(#blue)"/><text x="422" y="207" font-size="12" fill="#2e5aa8">HTTP GET</text><g><rect x="525" y="345" width="525" height="166" rx="8" fill="#fff8f3" stroke="#eb6c36"/><text x="541" y="368" font-size="11" fill="#eb6c36">流服务 · StreamHub / createSseHub</text><text x="541" y="395" font-size="19" fill="#2d3142">GET /api/dsh-notifier/events</text><text x="541" y="421" font-size="14" fill="#4f5d75">text/event-stream · no-store · 禁反代缓冲</text>
<text x="541" y="443" font-size="14" fill="#4f5d75">写 : connected → since 回放 → register</text>
<text x="541" y="465" font-size="14" fill="#4f5d75">之后 data: notify；共享 hub 每 30s 发 ping</text>
<text x="541" y="487" font-size="14" fill="#4f5d75">没有 SSE id / Last-Event-ID 协议</text></g><path d="M788 290 V345" fill="none" stroke="#eb6c36" stroke-width="1.7"  marker-end="url(#orange)"/><text x="802" y="323" font-size="12" fill="#4f5d75">准入通过</text><g><rect x="50" y="345" width="360" height="166" rx="8" fill="#f1f5fb" stroke="#2e5aa8"/><text x="66" y="368" font-size="11" fill="#2e5aa8">连接状态 · client/notify/session.ts</text><text x="66" y="395" font-size="19" fill="#2d3142">解析 → 去重 → onFrame</text><text x="66" y="421" font-size="14" fill="#4f5d75">解析成功才刷新 lastActivity</text>
<text x="66" y="443" font-size="14" fill="#4f5d75">seq ≤ lastSeq 丢弃；新序号推进水位</text>
<text x="66" y="465" font-size="14" fill="#4f5d75">60s 静默窗口 / 65s 检查定时器</text>
<text x="66" y="487" font-size="14" fill="#4f5d75">RECONNECT_MIN_GAP_MS = 5000</text></g><path d="M525 409 H410" fill="none" stroke="#2e5aa8" stroke-width="1.7"  marker-end="url(#blue)"/><text x="448" y="397" font-size="12" fill="#2e5aa8">SSE</text><path d="M70 345 V317 H100 V290" fill="none" stroke="#2e5aa8" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#blue)"/><text x="112" y="326" font-size="12" fill="#2e5aa8">关闭旧连接 → 带 ?since=lastSeq 重建</text><g><rect x="1165" y="167" width="305" height="145" rx="8" fill="#fff8f3" stroke="#eb6c36"/><text x="1181" y="190" font-size="11" fill="#eb6c36">系统出口 · 子进程</text><text x="1181" y="217" font-size="19" fill="#2d3142">宿主桌面 / 音频</text><text x="1181" y="243" font-size="14" fill="#4f5d75">Windows：PowerShell WinRT</text>
<text x="1181" y="265" font-size="14" fill="#4f5d75">macOS：osascript</text>
<text x="1181" y="287" font-size="14" fill="#4f5d75">Linux：notify-send / 播放器</text></g><g><rect x="1165" y="368" width="305" height="143" rx="8" fill="#fff8f3" stroke="#eb6c36"/><text x="1181" y="391" font-size="11" fill="#eb6c36">远程出口 · HTTP(S)</text><text x="1181" y="418" font-size="19" fill="#2d3142">Bark / Webhook</text><text x="1181" y="444" font-size="14" fill="#4f5d75">认证 / 模板发往用户配置目标</text>
<text x="1181" y="466" font-size="14" fill="#4f5d75">允许内网服务；无域名白名单</text>
<text x="1181" y="488" font-size="14" fill="#4f5d75">出站失败回到逐频道结果</text></g><path d="M1050 650 H1120 V440 H1165" fill="none" stroke="#eb6c36" stroke-width="1.7"  marker-end="url(#orange)"/><text x="1090" y="583" font-size="12" fill="#4f5d75">出站</text><g><rect x="525" y="558" width="525" height="123" rx="8" fill="#fff8f3" stroke="#eb6c36"/><text x="541" y="581" font-size="11" fill="#eb6c36">投递运行时 · pipeline / channels</text><text x="541" y="608" font-size="19" fill="#2d3142">Dispatcher + 执行端口</text><text x="541" y="634" font-size="14" fill="#4f5d75">Bark 在途 2；重试退避 1s / 2s；队列无上限</text>
<text x="541" y="656" font-size="14" fill="#4f5d75">system 1s 节流；其它出口不重试</text></g><path d="M1050 601 H1085 V274 H1165" fill="none" stroke="#eb6c36" stroke-width="1.7"  marker-end="url(#orange)"/><text x="1081" y="619" font-size="12" fill="#4f5d75">执行</text><g><rect x="50" y="558" width="360" height="123" rx="8" fill="#f1f5fb" stroke="#2e5aa8"/><text x="66" y="581" font-size="11" fill="#2e5aa8">展示资源 · 页面内</text><text x="66" y="608" font-size="19" fill="#2d3142">Notification / Audio / DOM</text><text x="66" y="634" font-size="14" fill="#4f5d75">安全上下文 + 权限；声音需手势解锁</text>
<text x="66" y="656" font-size="14" fill="#4f5d75">不可用 → 横幅 / 标题；后台仍可能挂起</text></g><path d="M230 511 V558" fill="none" stroke="#2e5aa8" stroke-width="1.7"  marker-end="url(#blue)"/><text x="243" y="539" font-size="12" fill="#2e5aa8">onFrame</text><g><rect x="50" y="721" width="360" height="78" rx="8" fill="#f1f5fb" stroke="#2e5aa8"/><text x="66" y="744" font-size="11" fill="#2e5aa8">卸载 · pageOwner</text><text x="66" y="771" font-size="19" fill="#2d3142">关连接 / timer / 监听 / 自有通知</text></g><path d="M230 681 V721" fill="none" stroke="#2e5aa8" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#blue)"/><g><rect x="525" y="721" width="525" height="78" rx="8" fill="#f1f5fb" stroke="#2e5aa8"/><text x="541" y="744" font-size="11" fill="#2e5aa8">卸载 · 逆序 disposer 栈</text><text x="541" y="770" font-size="17" fill="#2d3142">api：摘路由 / 退订帧 / 停心跳 / 关连接</text><text x="541" y="792" font-size="13" fill="#4f5d75">api → sdk → events → pipeline → stores → config → upgrade</text></g><path d="M788 681 V721" fill="none" stroke="#2e5aa8" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#blue)"/><g><rect x="1165" y="584" width="305" height="151" rx="8" fill="#f1f5fb" stroke="#2e5aa8"/><text x="1181" y="607" font-size="11" fill="#2e5aa8">临时音频 · 文件生命周期</text><text x="1181" y="634" font-size="19" fill="#2d3142">stage → 播放 → unstage</text><text x="1181" y="660" font-size="14" fill="#4f5d75">等待播放器退出后才删除文件</text>
<text x="1181" y="682" font-size="14" fill="#4f5d75">releaseSoundTemps 最后执行</text>
<text x="1181" y="704" font-size="14" fill="#4f5d75">stores 不等待在飞写；status</text>
<text x="1181" y="726" font-size="14" fill="#4f5d75">取消尚未触发的 debounce</text></g><path d="M1050 760 H1118 V705 H1165" fill="none" stroke="#2e5aa8" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#blue)"/><text x="1075" y="788" font-size="12" fill="#2e5aa8">最后清理</text><text x="30" y="858" font-size="14" fill="#2d3142">挂载边界：cordis.patch.yml / ui-dsh-notifier；宿主 inject webServer + settings，客户端依赖 dsh-client-connection。</text><text x="30" y="887" font-size="13" fill="#4f5d75">代理边界：LAN proxy 改写回环上游 Host / Origin；合法同源可过围栏。HTTPS 解决安全上下文，不代替 API 准入。</text><text x="30" y="915" font-size="13" fill="#4f5d75">可靠性边界：重启丢 replay；seq 异步落盘失败不挡广播。客户端刷新丢水位；不承诺可靠队列、无损退出或 exactly-once。</text><text x="30" y="942" font-size="12" fill="#4f5d75">证据：api/impl/{route,stream} · client/notify/session · channels/impl/system · src/index.ts#assemble（域路径前缀 src/server）</text>
</g></svg>