<g font-family="'Geist',system-ui,sans-serif"><text x="30" y="42" font-size="27" fill="#2d3142">BA 业务架构：触发、拒绝与可见结果</text><text x="30" y="70" font-size="13" fill="#4f5d75">dsh-notifier · 0.2.4 · 5e05e6d5 · 橙：请求 / 投递　蓝：能力 / 控制 / 边界</text>
