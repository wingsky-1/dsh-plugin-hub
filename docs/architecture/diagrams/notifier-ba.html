<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>BA 业务架构 · 提供哪些通知能力</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:#f5f5f5}.frame{max-width:min(1600px,calc((100vh - 32px)*1.75));margin:auto}svg{display:block;width:100%;height:auto}@media(max-width:700px){body{padding:8px}.frame{max-width:100%}}</style></head><body><main class="frame">
<svg viewBox="0 0 1400 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nba-title nba-desc">
<title id="nba-title">BA 业务架构 · 提供哪些通知能力</title><desc id="nba-desc">以业务能力协作呈现事件提醒、用户控制、多渠道投递与结果追溯，不展开内部判定。</desc>
<defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#d7dbe1"/></pattern><marker id="blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#2e5aa8"/></marker><marker id="orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#eb6c36"/></marker></defs>
<rect width="1400" height="800" fill="#f5f5f5"/><rect width="1400" height="800" fill="url(#dots)" opacity=".5"/>
<g font-family="'Geist',system-ui,sans-serif"><text x="40" y="53" font-size="32" font-weight="600" fill="#2d3142">BA 业务架构 · 提供哪些通知能力</text><text x="40" y="87" font-size="17" fill="#4f5d75">dsh-notifier · 功能模块视图 · 基线 473584ce · 橙：通知投递　蓝：配置与数据</text>
<path d="M380 230 H440 V410 H530" fill="none" stroke="#eb6c36" stroke-width="2" marker-end="url(#orange)"/><text x="446" y="319" text-anchor="middle" font-size="17" fill="#4f5d75" paint-order="stroke" stroke="#f5f5f5" stroke-width="6" stroke-linejoin="round">事件提醒</text>
<path d="M380 530 H440 V450 H530" fill="none" stroke="#eb6c36" stroke-width="2" marker-end="url(#orange)"/><text x="445" y="567" text-anchor="middle" font-size="17" fill="#4f5d75" paint-order="stroke" stroke="#f5f5f5" stroke-width="6" stroke-linejoin="round">扩展通知</text>
<path d="M690 270 V380" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#blue)"/><text x="748" y="326" text-anchor="middle" font-size="17" fill="#4f5d75" paint-order="stroke" stroke="#f5f5f5" stroke-width="6" stroke-linejoin="round">通知策略</text>
<path d="M850 430 H1000" fill="none" stroke="#eb6c36" stroke-width="2" marker-end="url(#orange)"/><text x="925" y="417" text-anchor="middle" font-size="17" fill="#4f5d75" paint-order="stroke" stroke="#f5f5f5" stroke-width="6" stroke-linejoin="round">目标通知</text>
<path d="M690 600 V480" fill="none" stroke="#eb6c36" stroke-width="2" marker-end="url(#orange)"/><text x="745" y="547" text-anchor="middle" font-size="17" fill="#4f5d75" paint-order="stroke" stroke="#f5f5f5" stroke-width="6" stroke-linejoin="round">测试通知</text>
<path d="M1160 480 V600" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#blue)"/><text x="1216" y="544" text-anchor="middle" font-size="17" fill="#4f5d75" paint-order="stroke" stroke="#f5f5f5" stroke-width="6" stroke-linejoin="round">投递结果</text>
<path d="M850 455 H915 V650 H1000" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#blue)"/><text x="915" y="573" text-anchor="middle" font-size="17" fill="#4f5d75" paint-order="stroke" stroke="#f5f5f5" stroke-width="6" stroke-linejoin="round">抑制记录</text>
<g id="event" class="module"><rect x="60" y="180" width="320" height="100" rx="8" fill="#fff8f3" stroke="#eb6c36" stroke-width="1.6"/><text x="80" y="219" font-size="24" font-weight="600" fill="#2d3142">宿主事件提醒</text><text x="80" y="253" font-size="18" fill="#4f5d75">将审批、提问与任务事件转成提醒。</text></g>
<g id="extensions" class="module"><rect x="60" y="480" width="320" height="100" rx="8" fill="#fff8f3" stroke="#eb6c36" stroke-width="1.6"/><text x="80" y="519" font-size="24" font-weight="600" fill="#2d3142">插件通知扩展</text><text x="80" y="553" font-size="18" fill="#4f5d75">让兄弟插件接入统一通知能力。</text></g>
<g id="preference" class="module"><rect x="530" y="170" width="320" height="100" rx="8" fill="#f1f5fb" stroke="#2e5aa8" stroke-width="1.6"/><text x="550" y="209" font-size="24" font-weight="600" fill="#2d3142">通知偏好管理</text><text x="550" y="243" font-size="18" fill="#4f5d75">由用户设置频道与免打扰策略。</text></g>
<g id="orchestration" class="module"><rect x="530" y="380" width="320" height="100" rx="8" fill="#fff8f3" stroke="#eb6c36" stroke-width="1.6"/><text x="550" y="419" font-size="24" font-weight="600" fill="#2d3142">通知编排</text><text x="550" y="453" font-size="18" fill="#4f5d75">按用户策略组织通知与目标。</text></g>
<g id="delivery" class="module"><rect x="1000" y="380" width="320" height="100" rx="8" fill="#fff8f3" stroke="#eb6c36" stroke-width="1.6"/><text x="1020" y="419" font-size="24" font-weight="600" fill="#2d3142">多渠道提醒</text><text x="1020" y="453" font-size="18" fill="#4f5d75">通过浏览器、系统与推送触达。</text></g>
<g id="trace" class="module"><rect x="1000" y="600" width="320" height="100" rx="8" fill="#f1f5fb" stroke="#2e5aa8" stroke-width="1.6"/><text x="1020" y="639" font-size="24" font-weight="600" fill="#2d3142">结果追溯</text><text x="1020" y="673" font-size="18" fill="#4f5d75">解释通知抑制与各频道投递结果。</text></g>
<g id="test" class="module"><rect x="530" y="600" width="320" height="100" rx="8" fill="#f1f5fb" stroke="#2e5aa8" stroke-width="1.6"/><text x="550" y="639" font-size="24" font-weight="600" fill="#2d3142">通知自检</text><text x="550" y="673" font-size="18" fill="#4f5d75">以测试通知验证配置后的体验。</text></g>
<text x="40" y="773" font-size="17" fill="#4f5d75">业务边界：提醒不接管审批；投递记录不等于用户已读。</text></g>
</svg>
</main></body></html>
