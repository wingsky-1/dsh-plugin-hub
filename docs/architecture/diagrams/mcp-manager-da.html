      <text x="60" y="358" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">ensureDir（目录取表）+ writeFileAtomic（唯一临时名 → 显式 mode 写入 → rename 覆盖 → 失败清理并上抛原错误）+ writeChains 同路径串行</text>
      <text x="60" y="376" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">readTextFile / readJsonFile（不存在/不可读/是目录/解析失败一律回落 null，由各域按既有语义回落空值）</text>
      <text x="60" y="394" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">登记路径经 writeFileAtomic（mode 取表+串行+清理）· 未登记路径（单测 tmp 覆盖/调用方自定义）回落硬化直写：随机后缀 + 失败清理（笔3 R1/R2，store.save 的 S2-B 同式）</text>
      <text x="60" y="412" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">同步禁调：stats flushSync 不调异步 writeFileAtomic（同步契约要求返回时盘上已有数据）· 此处用同步拼写 mkdirOptionsFor/writeOptionsFor</text>
      <text x="60" y="430" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">序列化逐字节不变：目录 version1+entries · 禁用 version1+disabled · 统计 snapshot，均保持既有 JSON 2 空格形状 · 否定式：没有 revision（并发写只串行不判冲）</text>
      <text x="60" y="448" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">fileMode 未登记即抛 I6（写函数不替调用点做权限决定）· 直接调 writeFileAtomic 等于把回落写盘变成写失败</text>

      <text x="60" y="510" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">CALL_TIMEOUT_MS=30_000 · CATALOG_TTL_MS=24h · MAX_TOOLS_PER_SERVER=512 · MAX_BYTES_PER_TOOL=4096 · MAX_TOTAL_CATALOG_BYTES=256KiB</text>
      <text x="60" y="526" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">LIST_MAX_TOOLS_PER_SERVER=500 · LIST_DEFAULT_TOOLS_PER_SERVER=50 · DEFAULT_TOOL_CALL_TIMEOUT_MS=15_000（withTimeout 兜底+2s）· CONNECT/DISCOVERY_TIMEOUT_MS=10_000</text>
      <text x="60" y="542" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">DEFAULT_RESULT_TRUNCATE_BYTES=8192（extractText 现状不截断）· DEFAULT_CATALOG_MAX_ENTRIES=6 · 重连 500ms 起/30s 封顶/10 次上限 · SSE 心跳 30s · 统计 debounce 1000ms · 自有目录 0o700</text>
      <text x="40" y="568" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">MIGRATE · 迁移与卸载（STEPS 0.0.0→0.2.5 migrateStorageLayout）</text>
      <text x="60" y="590" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">链在各域装配前跑完：按目标版本升序执行，任何一步失败即抛（存储没升完就被按错误形态解释）· 跑完与插件版本对账 reportGap（落差告警不自动降级）</text>
      <text x="60" y="608" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">布局迁移：旧文件写到新位置后归档 .migrated.bak · 项目级 just-in-time 经 orchestrator upgrade 端口调 settleProjectConfig · 无旧文件不凭空写默认内容</text>
      <text x="60" y="626" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">逆序释放：disposeInjection → disposeSection → disposeRoutes → disposeMiddleware → disposeVisibility → watchCleanup → manager.dispose → releaseLifecycle → 账本排空 → releaseUpgrade</text>
      <text x="60" y="644" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">不等在飞写：禁用表与目录缓存落盘失败吞错不阻塞主流程 · manager.dispose 走 fire-and-forget（官方 dispose 会等在途首连，装载账本单独排空一次）</text>
