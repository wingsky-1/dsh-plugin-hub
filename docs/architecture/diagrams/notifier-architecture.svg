<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1160 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="notifier-title notifier-desc">
      <title id="notifier-title">dsh-notifier 通知管线架构</title>
      <desc id="notifier-desc">宿主事件经 sendKind 通知管线（门控、模板、免打扰、路由）分发到浏览器 SSE、系统 toast 与 Bark 三个通道，并落盘历史。</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Zone: 投递通道 -->
      <rect x="580" y="80" width="240" height="400" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="668" y="84" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="700" y="93" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">投递通道</text>

      <!-- Arrows (behind boxes) -->
      <!-- 事件源 → 管线（accent） -->
      <path d="M 180,228 H 236 Q 244,228 244,220 V 196 Q 244,188 252,188 H 300"
            fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- 管线 → browser（accent） -->
      <path d="M 520,188 H 572 Q 580,188 580,180 V 150 Q 580,142 588,142 H 620"
            fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- 管线 → system -->
      <path d="M 520,188 H 572 Q 580,188 580,196 V 272 Q 580,280 588,280 H 620"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- 管线 → bark -->
      <path d="M 520,188 H 572 Q 580,188 580,196 V 410 Q 580,418 588,418 H 620"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- browser → 客户端（SSE 长连接） -->
      <line x1="780" y1="142" x2="880" y2="142" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- 管线 → 历史（落盘） -->
      <line x1="410" y1="236" x2="410" y2="380" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="186" y="204" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="234" y="213" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">7 事件触发</text>

      <rect x="524" y="118" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="556" y="127" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SSE 帧</text>

      <rect x="524" y="256" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="556" y="265" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">系统 toast</text>

      <rect x="524" y="394" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="556" y="403" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /push</text>

      <rect x="800" y="120" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="836" y="129" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SSE 长连接</text>

      <rect x="418" y="308" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="454" y="317" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">历史落盘</text>

      <!-- Node: 事件源 -->
      <rect x="40" y="180" width="140" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="180" width="140" height="96" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="188" width="36" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="66" y="197" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EVT</text>
      <text x="110" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">宿主事件</text>
      <text x="110" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">approval / agent / session</text>
      <text x="110" y="246" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">（{global:true} 监听）</text>

      <!-- Node: 通知管线（focal） -->
      <rect x="300" y="140" width="220" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="300" y="140" width="220" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="308" y="148" width="52" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="334" y="157" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PIPE</text>
      <text x="410" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">通知管线 sendKind</text>
      <text x="410" y="196" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">门控 · 模板 · 免打扰 · 路由</text>
      <text x="410" y="210" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">（聚合 / 合并 / 脱敏）</text>

      <!-- Node: browser 通道 -->
      <rect x="620" y="110" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="620" y="110" width="160" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="628" y="118" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="654" y="127" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BROWSER</text>
      <text x="700" y="146" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">浏览器通道</text>
      <text x="700" y="162" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SSE 广播 · Notification</text>

      <!-- Node: system 通道 -->
      <rect x="620" y="248" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="620" y="248" width="160" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="628" y="256" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="654" y="265" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SYSTEM</text>
      <text x="700" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">系统通知</text>
      <text x="700" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">WinRT / osascript / notify-send</text>

      <!-- Node: bark 通道 -->
      <rect x="620" y="386" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="620" y="386" width="160" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="628" y="394" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="648" y="403" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BARK</text>
      <text x="700" y="422" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bark 推送</text>
      <text x="700" y="438" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">POST /push · 重试 ×2</text>

      <!-- Node: 客户端 -->
      <rect x="880" y="110" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="880" y="110" width="160" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="888" y="118" width="52" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="914" y="127" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
      <text x="960" y="146" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">浏览器客户端</text>
      <text x="960" y="162" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Notification / 横幅 / 提示音</text>

      <!-- Node: 历史 -->
      <rect x="300" y="380" width="220" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="300" y="380" width="220" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="308" y="388" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="328" y="397" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HIST</text>
      <text x="410" y="416" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">历史 / 状态存储</text>
      <text x="410" y="432" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">jsonl 落盘 · 原子写</text>

      <!-- Legend strip -->
      <line x1="40" y1="508" x2="1120" y2="508" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="524" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="532" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="540" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal（主链路）</text>

      <rect x="180" y="532" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="200" y="540" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Backend 通道</text>

      <line x1="360" y1="537" x2="388" y2="537" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="396" y="540" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP / 长连接</text>
    </svg>