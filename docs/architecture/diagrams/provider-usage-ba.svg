<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1160 510" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ba-title ba-desc">
      <title id="ba-title">BA：能力不变与显式非目标（目标）</title>
      <desc id="ba-desc">上半为五项不变能力：多 provider 框架、宿主端渲染、密钥不进浏览器、双触发汇入 getStats、历史读本地分片；下半为五项显式非目标。节点名与锚 v3 第 1 节同词。</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <rect x="40" y="16" width="1080" height="196" rx="8" fill="rgba(235,108,54,0.05)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="42" fill="#eb6c36" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">能力不变 · V2 契约（行为零变化是验收前提）</text>

      <g id="ba-cap-framework">
        <rect x="60" y="60" width="196" height="104" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="158" y="102" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">多 provider 框架</text>
        <text x="158" y="130" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle">V2 契约 · 三内置适配器</text>
      </g>
      <g id="ba-cap-render">
        <rect x="266" y="60" width="196" height="104" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="364" y="102" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">宿主端渲染</text>
        <text x="364" y="130" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle">HTML 宿主产出</text>
      </g>
      <g id="ba-cap-key">
        <rect x="472" y="60" width="196" height="104" rx="8" fill="#f1f5fb" stroke="#2e5aa8" stroke-width="1.6"/>
        <text x="570" y="102" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">密钥不进浏览器</text>
        <text x="570" y="130" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle">宿主内存注入</text>
      </g>
      <g id="ba-cap-getstats">
        <rect x="678" y="60" width="190" height="104" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.6"/>
        <text x="773" y="102" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">双触发汇入</text>
        <text x="773" y="130" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle">60s 轮询 + 5min 预热</text>
      </g>
      <g id="ba-cap-history">
        <rect x="908" y="60" width="192" height="104" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="1004" y="102" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">历史读本地分片</text>
        <text x="1004" y="130" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle">按天分片 JSONL</text>
      </g>

      <path d="M158 164 V188 H778 V164" fill="none" stroke="#eb6c36" stroke-width="2" marker-end="url(#arrow-accent)"/>
      <path d="M364 164 V188 H778 V164" fill="none" stroke="#eb6c36" stroke-width="2" marker-end="url(#arrow-accent)"/>
      <path d="M570 164 V188 H778 V164" fill="none" stroke="#eb6c36" stroke-width="2" marker-end="url(#arrow-accent)"/>
      <text x="676" y="182" fill="#eb6c36" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle" style="paint-order:stroke;stroke:#f5f5f5;stroke-width:5px">汇入</text>
      <path d="M868 112 H908" fill="none" stroke="#eb6c36" stroke-width="2" marker-end="url(#arrow-accent)"/>
      <text x="888" y="184" fill="#eb6c36" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle" style="paint-order:stroke;stroke:#f5f5f5;stroke-width:5px">面板直读</text>

      <text x="40" y="240" fill="#4f5d75" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">能力 · 入口与可见结果</text>

      <g id="ba-cap-config">
        <rect x="40" y="250" width="208" height="118" rx="8" fill="#f1f5fb" stroke="#2e5aa8" stroke-width="1.6"/>
        <text x="144" y="296" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">取数主链路</text>
        <text x="144" y="322" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle">getStats 缓存 + 锁</text>
      </g>
      <g id="ba-cap-visible">
        <rect x="258" y="250" width="208" height="118" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.6"/>
        <text x="362" y="296" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">胶囊与面板</text>
        <text x="362" y="322" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle">宿主 HTML · 注入</text>
      </g>
      <g id="ba-cap-catalog">
        <rect x="476" y="250" width="208" height="118" rx="8" fill="#f1f5fb" stroke="#2e5aa8" stroke-width="1.6"/>
        <text x="580" y="296" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">三内置适配器</text>
        <text x="580" y="322" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle">唯一启用 · 可切换</text>
      </g>
      <g id="ba-cap-push">
        <rect x="694" y="250" width="208" height="118" rx="8" fill="#f1f5fb" stroke="#2e5aa8" stroke-width="1.6"/>
        <text x="798" y="296" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">数据路由面</text>
        <text x="798" y="322" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle">data 三路由之一</text>
      </g>
      <g id="ba-cap-admin">
        <rect x="912" y="250" width="208" height="118" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="1016" y="296" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">设置页注入</text>
        <text x="1016" y="322" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle">三条注入路径</text>
      </g>

      <text x="40" y="396" fill="#4f5d75" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">显式非目标</text>

      <g id="ba-non">
        <rect x="40" y="406" width="208" height="72" rx="8" fill="#ffffff" stroke="#c96a5e" stroke-width="1.2" stroke-dasharray="6 4"/>
        <text x="144" y="450" fill="#4f5d75" font-size="16" font-family="'Geist', sans-serif" text-anchor="middle">不改适配器契约</text>
        <rect x="258" y="406" width="208" height="72" rx="8" fill="#ffffff" stroke="#c96a5e" stroke-width="1.2" stroke-dasharray="6 4"/>
        <text x="362" y="450" fill="#4f5d75" font-size="16" font-family="'Geist', sans-serif" text-anchor="middle">不改取数语义</text>
        <rect x="476" y="406" width="208" height="72" rx="8" fill="#ffffff" stroke="#c96a5e" stroke-width="1.2" stroke-dasharray="6 4"/>
        <text x="580" y="450" fill="#4f5d75" font-size="16" font-family="'Geist', sans-serif" text-anchor="middle">不改 UI 文案</text>
        <rect x="694" y="406" width="208" height="72" rx="8" fill="#ffffff" stroke="#c96a5e" stroke-width="1.2" stroke-dasharray="6 4"/>
        <text x="798" y="450" fill="#4f5d75" font-size="16" font-family="'Geist', sans-serif" text-anchor="middle">行为零变化验收</text>
        <rect x="912" y="406" width="208" height="72" rx="8" fill="#ffffff" stroke="#c96a5e" stroke-width="1.2" stroke-dasharray="6 4"/>
        <text x="1016" y="450" fill="#4f5d75" font-size="16" font-family="'Geist', sans-serif" text-anchor="middle">多错语义另立评审</text>
      </g>
    </svg>