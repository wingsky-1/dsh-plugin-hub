<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>TA 技术架构 · 运行在哪些组件上</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:#f5f5f5}.frame{max-width:min(1600px,calc((100vh - 32px)*1.75));margin:auto}svg{display:block;width:100%;height:auto}@media(max-width:700px){body{padding:8px}.frame{max-width:100%}}</style></head><body><main class="frame">
<svg viewBox="0 0 1400 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nta-title nta-desc">
<title id="nta-title">TA 技术架构 · 运行在哪些组件上</title><desc id="nta-desc">展现浏览器、宿主 Web 服务、插件运行时、本地存储、平台通知与外部推送之间的部署和通信关系。</desc>
<defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#d7dbe1"/></pattern><marker id="blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#2e5aa8"/></marker><marker id="orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#eb6c36"/></marker></defs>
<rect width="1400" height="800" fill="#f5f5f5"/><rect width="1400" height="800" fill="url(#dots)" opacity=".5"/>
<g font-family="'Geist',system-ui,sans-serif"><text x="40" y="53" font-size="32" font-weight="600" fill="#2d3142">TA 技术架构 · 运行在哪些组件上</text><text x="40" y="87" font-size="17" fill="#4f5d75">dsh-notifier · 功能模块视图 · 基线 473584ce · 橙：通知投递　蓝：配置与数据</text>
<path d="M380 230 H530" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#blue)"/><text x="455" y="217" text-anchor="middle" font-size="17" fill="#4f5d75" paint-order="stroke" stroke="#f5f5f5" stroke-width="6" stroke-linejoin="round">管理 HTTP</text>
<path d="M530 275 H380" fill="none" stroke="#eb6c36" stroke-width="2" marker-end="url(#orange)"/><text x="455" y="266" text-anchor="middle" font-size="17" fill="#4f5d75" paint-order="stroke" stroke="#f5f5f5" stroke-width="6" stroke-linejoin="round">通知 SSE</text>
<path d="M690 450 V300" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#blue)"/><text x="794" y="378" text-anchor="middle" font-size="17" fill="#4f5d75" paint-order="stroke" stroke="#f5f5f5" stroke-width="6" stroke-linejoin="round">管理数据 / 通知帧</text>
<path d="M850 480 H925 V210 H1000" fill="none" stroke="#eb6c36" stroke-width="2" marker-end="url(#orange)"/><text x="926" y="354" text-anchor="middle" font-size="17" fill="#4f5d75" paint-order="stroke" stroke="#f5f5f5" stroke-width="6" stroke-linejoin="round">系统投递</text>
<path d="M850 520 H1000" fill="none" stroke="#eb6c36" stroke-width="2" marker-end="url(#orange)"/><text x="925" y="507" text-anchor="middle" font-size="17" fill="#4f5d75" paint-order="stroke" stroke="#f5f5f5" stroke-width="6" stroke-linejoin="round">HTTP(S) 推送</text>
<path d="M530 510 H450 V620 H380" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#blue)"/><text x="450" y="691" text-anchor="middle" font-size="17" fill="#4f5d75" paint-order="stroke" stroke="#f5f5f5" stroke-width="6" stroke-linejoin="round">配置 / 记录读写</text>
<g id="browser" class="module"><rect x="60" y="200" width="320" height="100" rx="8" fill="#f1f5fb" stroke="#2e5aa8" stroke-width="1.6"/><text x="80" y="239" font-size="24" font-weight="600" fill="#2d3142">浏览器</text><text x="80" y="273" font-size="18" fill="#4f5d75">运行通知展示与设置交互界面。</text></g>
<g id="web" class="module"><rect x="530" y="200" width="320" height="100" rx="8" fill="#f1f5fb" stroke="#2e5aa8" stroke-width="1.6"/><text x="550" y="239" font-size="24" font-weight="600" fill="#2d3142">宿主 Web 服务</text><text x="550" y="273" font-size="18" fill="#4f5d75">承载管理 HTTP 与通知 SSE 通道。</text></g>
<g id="runtime" class="module"><rect x="530" y="450" width="320" height="100" rx="8" fill="#fff8f3" stroke="#eb6c36" stroke-width="1.6"/><text x="550" y="489" font-size="24" font-weight="600" fill="#2d3142">宿主插件运行时</text><text x="550" y="523" font-size="18" fill="#4f5d75">在 Node.js 内处理事件与通知。</text></g>
<g id="platform" class="module"><rect x="1000" y="160" width="320" height="100" rx="8" fill="#fff8f3" stroke="#eb6c36" stroke-width="1.6"/><text x="1020" y="199" font-size="24" font-weight="600" fill="#2d3142">平台通知服务</text><text x="1020" y="233" font-size="18" fill="#4f5d75">调用宿主桌面通知与音频能力。</text></g>
<g id="push" class="module"><rect x="1000" y="450" width="320" height="100" rx="8" fill="#fff8f3" stroke="#eb6c36" stroke-width="1.6"/><text x="1020" y="489" font-size="24" font-weight="600" fill="#2d3142">外部推送服务</text><text x="1020" y="523" font-size="18" fill="#4f5d75">接收 Bark 或 Webhook 通知。</text></g>
<g id="disk" class="module"><rect x="60" y="570" width="320" height="100" rx="8" fill="#f1f5fb" stroke="#2e5aa8" stroke-width="1.6"/><text x="80" y="609" font-size="24" font-weight="600" fill="#2d3142">本地存储</text><text x="80" y="643" font-size="18" fill="#4f5d75">在宿主磁盘保留配置与通知记录。</text></g>
<text x="40" y="773" font-size="17" fill="#4f5d75">管理入口受回环同源围栏约束；系统提醒发生在宿主设备，外部推送按用户配置出站。</text></g>
</svg>
