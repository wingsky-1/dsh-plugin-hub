      <title id="ov-title">dsh-provider-usage 目标总览：组合根 + 十三域</title>
      <desc id="ov-desc">src/index.ts 组合根装配 server 十三域：upgrade、schedule、config、execute、adapters、registry、pipeline、collect、aggregate、history、data-routes、report-routes、ui-routes，外加 server/shared 共享叶 errsurf；浏览器经 data/report/ui 三路由取数注入，密钥不进浏览器；历史天分片 JSONL 落盘。</desc>
