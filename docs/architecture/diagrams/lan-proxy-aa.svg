<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 736" role="img" aria-labelledby="aa-title aa-desc"><title id="aa-title">dsh-lan-proxy AA 应用架构</title><desc id="aa-desc">装配闭包连接五域；转发层和页面信任层各自负责一段。 本图“经装配层”不是 config 直引 proxy；迁移直接依赖 config。host-trust 自身消费 ctx。</desc><defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4f5d75"/></marker><style>.card{fill:#fff;stroke:#b7becb;stroke-width:1.2}.heading{font:600 21px 'Geist',sans-serif;fill:#2d3142}.body{font:17px 'Geist',sans-serif;fill:#2d3142}.evidence{font:13px 'Geist Mono',monospace;fill:#4f5d75}.edge{fill:none;stroke:#4f5d75;stroke-width:1.5}.edge-label{font:15px 'Geist',sans-serif;fill:#4f5d75}</style></defs><rect width="1240" height="736" fill="#f5f5f5"/><text x="30" y="44" class="heading">dsh-lan-proxy · AA 应用架构</text><text x="30" y="76" class="body">装配闭包连接五域；转发层和页面信任层各自负责一段。</text><path d="M 370 198 H 450" class="edge" marker-end="url(#arrow)"/><text x="410" y="185" class="edge-label" text-anchor="middle">装配</text>
<path d="M 790 198 H 870" class="edge" marker-end="url(#arrow)"/><text x="830" y="185" class="edge-label" text-anchor="middle">经装配层</text>
<path d="M 200 288 V 420" class="edge" marker-end="url(#arrow)"/><text x="210" y="354" class="edge-label" text-anchor="start">注册</text>
<path d="M 370 510 H 450" class="edge" marker-end="url(#arrow)"/><text x="410" y="497" class="edge-label" text-anchor="middle">注入页面</text>
<path d="M 790 510 H 870" class="edge" marker-end="url(#arrow)"/><text x="830" y="497" class="edge-label" text-anchor="middle">同源请求</text>
<path d="M 1040 288 V 420" class="edge" marker-end="url(#arrow)"/><text x="1050" y="354" class="edge-label" text-anchor="start">回环转发</text>
<g><rect x="30" y="108" width="340" height="180" rx="6" class="card"/><text x="50" y="143" class="heading">包入口与装配层</text><text x="50" y="177" class="body">src/index.ts 保留导出契约</text><text x="50" y="204" class="body">server/apply.ts 持有实例与定时器</text><text x="50" y="231" class="body">sync 拆旧建新；effect 回收资源</text><text x="50" y="269" class="evidence">src/index.ts · server/apply.ts</text></g>
<g><rect x="450" y="108" width="340" height="180" rx="6" class="card"/><text x="470" y="143" class="heading">config + migrate</text><text x="470" y="177" class="body">config：模型、路由与 settings</text><text x="470" y="204" class="body">migrate → config 门面净化 / 写入</text><text x="470" y="231" class="body">settings watch 驱动 3s 防抖</text><text x="470" y="269" class="evidence">server/{config,migrate}/interface.ts</text></g>
<g><rect x="870" y="108" width="340" height="180" rx="6" class="card"/><text x="890" y="143" class="heading">tls + proxy</text><text x="890" y="177" class="body">tls 向装配层交出证书材料</text><text x="890" y="204" class="body">proxy：HTTP(S) 与 WS 转发</text><text x="890" y="231" class="body">shared：默认值与回环目标谓词</text><text x="890" y="269" class="evidence">server/{tls,proxy}/interface.ts</text></g>
<g><rect x="30" y="420" width="340" height="180" rx="6" class="card"/><text x="50" y="455" class="heading">host-trust</text><text x="50" y="489" class="body">tapIndex 只注册一次</text><text x="50" y="516" class="body">每次请求读取 ownsHostCompat</text><text x="50" y="543" class="body">仅非回环且无 transport 时声明</text><text x="50" y="581" class="evidence">host-trust/impl/injection.ts</text></g>
<g><rect x="450" y="420" width="340" height="180" rx="6" class="card"/><text x="470" y="455" class="heading">浏览器端</text><text x="470" y="489" class="body">index：locale、样式、插槽</text><text x="470" y="516" class="body">settings-card：同源配置请求</text><text x="470" y="543" class="body">host-trust-status：四态观测</text><text x="470" y="581" class="evidence">client/index.ts · host-trust-status.ts</text></g>
<g><rect x="870" y="420" width="340" height="180" rx="6" class="card"/><text x="890" y="455" class="heading">官方宿主能力</text><text x="890" y="489" class="body">webServer：port / register / tapIndex</text><text x="890" y="516" class="body">settings：get / watch / update</text><text x="890" y="543" class="body">connection：authenticatedUrl</text><text x="890" y="581" class="evidence">server/apply.ts · 宿主接线</text></g>
<path d="M30 648H1210" stroke="#eb6c36"/><text x="30" y="681" class="body">本图“经装配层”不是 config 直引 proxy；迁移直接依赖 config。host-trust 自身消费 ctx。</text><text x="30" y="712" class="evidence">证据路径默认相对 packages/dsh-lan-proxy/src；构建与仓库规范路径除外。实线表示标注的调用或数据关系。</text></svg>