<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <title>dsh-provider-usage DA 落盘与命名空间割接（目标）</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame { max-width: 1240px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif); font-size: clamp(1.4rem, 2.2vw + 0.7rem, 1.9rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink);
      margin-bottom: 0.4rem;

    .meta { font-family: var(--font-mono); font-size: 0.72rem; color: var(--color-muted); margin-bottom: 1.25rem; }
    svg { width: 100%; min-width: 1040px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture &middot; dsh-provider-usage &middot; DA</p>
    <h1>落盘与命名空间割接（目标）</h1>
    <p class="meta">目标锚 draft-768-target-arch.md v3 &sect;3 &middot; 落盘以 packages/dsh-provider-usage/docs/architecture.md 对账 &middot; SVG 讲结构（mermaid 讲关系，非同图两画法）</p>

    <svg viewBox="0 0 1160 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="da-title da-desc">
      <title id="da-title">DA：落盘与命名空间割接（目标）</title>
      <desc id="da-desc">上半为 upgrade 命名空间割接搬运流：旧位置经纯字节搬移写新位置，分支为目标存在不覆盖、旧文件固定名留痕、版本化空形、可再生不进迁移、只搬运不校验（校验归 config 归一化）；下半为历史天分片 JSONL、last-run 校准链 index.jsonl 经 derive/align 到 writeLastRun per-root 链、SSE 非可靠推送与落盘对账。节点名与锚 v3 第 3 节同词。</desc>

        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">

        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>

      <text x="40" y="572" fill="#4f5d75" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">last-run 校准链 · index 事实→投影（per-root 串行）</text>

  </div>
