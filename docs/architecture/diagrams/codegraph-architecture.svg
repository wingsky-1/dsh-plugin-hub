<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1160 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="codegraph-title codegraph-desc">
      <title id="codegraph-title">dsh-codegraph 架构</title>
      <desc id="codegraph-desc">dsh-codegraph 探测 codegraph CLI，经 mcp-manager 用 8 个封装工具注册 MCP 服务器，并在 git 仓会话注入 worktree 开发纪律。</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Zone: dsh-codegraph 插件 -->
      <rect x="268" y="72" width="420" height="400" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="420" y="76" width="116" height="12" rx="2" fill="#f5f5f5"/>
      <text x="478" y="85" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">dsh-codegraph 宿主端</text>

      <!-- Arrows (behind boxes) -->
      <!-- 会话 → 纪律注入 -->
      <line x1="980" y1="200" x2="832" y2="200" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- 模型 → 封装工具 -->
      <path d="M 980,170 H 752 Q 744,170 744,178 V 220 Q 744,228 736,228 H 680" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- 封装 → mcpManager -->
      <line x1="560" y1="228" x2="428" y2="228" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- mcpManager → codegraph CLI -->
      <line x1="320" y1="228" x2="180" y2="228" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- Arrow labels -->
      <rect x="880" y="180" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="928" y="189" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">纪律注入</text>

      <rect x="900" y="148" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="936" y="157" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">调用工具</text>

      <rect x="436" y="208" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="484" y="217" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">registerServer</text>

      <rect x="196" y="208" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="232" y="217" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">stdio</text>

      <!-- Node: codegraph CLI（外部） -->
      <rect x="40" y="196" width="140" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="196" width="140" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="204" width="36" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="66" y="213" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
      <text x="110" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">codegraph CLI</text>
      <text x="110" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">serve --mcp（本地二进制）</text>

      <!-- Node: mcp-manager（focal 协作方） -->
      <rect x="320" y="196" width="108" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="196" width="108" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="328" y="204" width="52" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="354" y="213" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MGR</text>
      <text x="374" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">mcp-manager</text>
      <text x="374" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ctx.mcpManager 服务</text>

      <!-- Node: 8 封装工具 -->
      <rect x="560" y="196" width="184" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="196" width="184" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="568" y="204" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="594" y="213" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOOLS</text>
      <text x="652" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">8 个封装工具</text>
      <text x="652" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">explore / impact / node / ...</text>

      <!-- Node: 纪律钩子 -->
      <rect x="560" y="356" width="184" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="356" width="184" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="568" y="364" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="594" y="373" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DISC</text>
      <text x="652" y="392" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">纪律钩子</text>
      <text x="652" y="408" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">agent/pre-step · cwd 判 git</text>

      <!-- Node: 探测/安装 -->
      <rect x="320" y="356" width="108" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="356" width="108" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="328" y="364" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="354" y="373" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INST</text>
      <text x="374" y="392" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">探测 / 引导安装</text>
      <text x="374" y="408" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">默认不自动执行</text>

      <!-- Node: git 仓会话 -->
      <rect x="880" y="120" width="200" height="132" rx="6" fill="#f5f5f5"/>
      <rect x="880" y="120" width="200" height="132" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="888" y="128" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="906" y="137" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
      <text x="980" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">git 仓会话</text>
      <text x="980" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">主 checkout / worktree</text>
      <text x="980" y="188" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">（非 git 仓不注入）</text>
      <text x="980" y="204" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cwd 判定 · 历史幂等</text>
      <text x="980" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pre-step user 消息注入</text>

      <!-- Legend strip -->
      <line x1="40" y1="508" x2="1120" y2="508" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="524" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="532" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="540" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal（注册主链路）</text>

      <line x1="240" y1="537" x2="268" y2="537" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="276" y="540" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP / 子进程（stdio）</text>

      <line x1="460" y1="537" x2="488" y2="537" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="496" y="540" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">在插件内协作</text>
    </svg>