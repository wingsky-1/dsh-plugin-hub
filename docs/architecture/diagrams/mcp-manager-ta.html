<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dsh-mcp-manager TA 挂载构建与安全兼容边界</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .frame { max-width: 1240px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.4rem, 2.2vw + 0.7rem, 1.9rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 0.4rem; }
    .meta { font-family: var(--font-mono); font-size: 0.72rem; color: var(--color-muted); margin-bottom: 1.25rem; }
    svg { width: 100%; min-width: 1040px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · dsh-mcp-manager · TA</p>
    <h1>挂载、构建与安全兼容边界（现状）</h1>
    <p class="meta">证据基线 da4eea6e · 关系逻辑见 dsh-mcp-manager.md §4（§4.4 待核不进图）</p>

    <svg viewBox="0 0 1160 570" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ta-title ta-desc">
      <title id="ta-title">TA：挂载、构建与安全兼容边界</title>
      <desc id="ta-desc">cordis 挂载后构建内联为自包含产物，门禁为构建合闸；传输由官方客户端承担；六项安全机制各自守一条边界。节点名与正文 §4 同词，阈值与待核见正文不进图。</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>

      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <text x="40" y="40" fill="#4f5d75" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">挂载与构建</text>

      <g id="ta-mount">
        <rect x="40" y="52" width="340" height="96" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="210" y="90" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">挂载</text>
        <text x="210" y="116" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle">cordis.patch.yml 挂载</text>
      </g>
      <g id="ta-build">
        <rect x="410" y="52" width="340" height="96" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.6"/>
        <text x="580" y="90" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">构建</text>
        <text x="580" y="116" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle">bundle-host 依赖内联</text>
      </g>
      <g id="ta-transport">
        <rect x="780" y="52" width="340" height="96" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="950" y="90" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">传输</text>
        <text x="950" y="116" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle">官方客户端 · 自研已退役</text>
      </g>

      <path d="M380 100 H410" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="395" y="162" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle" style="paint-order:stroke;stroke:#f5f5f5;stroke-width:5px">内联自包含</text>

      <text x="40" y="178" fill="#4f5d75" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">安全边界</text>

      <g id="ta-env">
        <rect x="40" y="190" width="340" height="92" rx="8" fill="#f1f5fb" stroke="#2e5aa8" stroke-width="1.6"/>
        <text x="210" y="226" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">env 净化</text>
        <text x="210" y="252" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle">父环境过滤 + ENV 引用展开</text>
      </g>
      <g id="ta-redact">
        <rect x="410" y="190" width="340" height="92" rx="8" fill="#f1f5fb" stroke="#2e5aa8" stroke-width="1.6"/>
        <text x="580" y="226" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">redactor 脱敏</text>
        <text x="580" y="252" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle">错误逐值替换 [REDACTED]</text>
      </g>
      <g id="ta-fence">
        <rect x="780" y="190" width="340" height="92" rx="8" fill="#f1f5fb" stroke="#2e5aa8" stroke-width="1.6"/>
        <text x="950" y="226" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">loopback 围栏</text>
        <text x="950" y="252" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle">403 先于 405 · config 豁免</text>
      </g>

      <g id="ta-perm">
        <rect x="40" y="306" width="340" height="92" rx="8" fill="#f1f5fb" stroke="#2e5aa8" stroke-width="1.6"/>
        <text x="210" y="342" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">落盘权限</text>
        <text x="210" y="368" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle">配置 0o600 · 未登记拒绝写</text>
      </g>
      <g id="ta-stdio">
        <rect x="410" y="306" width="340" height="92" rx="8" fill="#f1f5fb" stroke="#2e5aa8" stroke-width="1.6"/>
        <text x="580" y="342" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">stdio 继承权限</text>
        <text x="580" y="368" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle">仅配置可信服务器</text>
      </g>
      <g id="ta-isolation">
        <rect x="780" y="306" width="340" height="92" rx="8" fill="#f1f5fb" stroke="#2e5aa8" stroke-width="1.6"/>
        <text x="950" y="342" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">工作空间隔离</text>
        <text x="950" y="368" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle">cwd 路由 + 全名校验</text>
      </g>

      <path d="M210 282 V306" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="226" y="296" fill="#2e5aa8" font-size="14" font-family="'Geist', sans-serif" style="paint-order:stroke;stroke:#f5f5f5;stroke-width:5px">先净化后继承</text>

      <text x="40" y="428" fill="#4f5d75" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">门禁与待核</text>

      <g id="ta-gate">
        <rect x="40" y="440" width="340" height="92" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.6"/>
        <text x="210" y="476" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">gate:pr</text>
        <text x="210" y="502" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle">结构门禁 · 阈值以脚本为准</text>
      </g>
      <g id="ta-todo">
        <rect x="410" y="440" width="340" height="92" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="580" y="476" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">待核项</text>
        <text x="580" y="502" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle">图-码对账 · 图片准入待验证</text>
      </g>

      <path d="M395 440 V100 H410" fill="none" stroke="#eb6c36" stroke-width="2" marker-end="url(#arrow-accent)"/>
      <text x="395" y="300" fill="#eb6c36" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle" style="paint-order:stroke;stroke:#f5f5f5;stroke-width:5px">合闸</text>
    </svg>
  </div>
</body>
</html>
