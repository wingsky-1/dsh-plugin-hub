<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dsh-mcp-manager AA 组合根装配与域分工</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame { max-width: 1240px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif); font-size: clamp(1.4rem, 2.2vw + 0.7rem, 1.9rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink);
      margin-bottom: 0.4rem;
    }
    .meta { font-family: var(--font-mono); font-size: 0.72rem; color: var(--color-muted); margin-bottom: 1.25rem; }
    svg { width: 100%; min-width: 1040px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · dsh-mcp-manager · AA</p>
    <h1>组合根装配、域分工与调用链路（现状）</h1>
    <p class="meta">证据基线 da4eea6e · 关系逻辑见 dsh-mcp-manager.md §2 mermaid（非同图两画法）</p>

    <svg viewBox="0 0 1160 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aa-title aa-desc">
      <title id="aa-title">AA：组合根、域分工与调用链路</title>
      <desc id="aa-desc">上带为 apply 组合根装配顺序（升级链最先）；下图为九域依赖，箭头 A 到 B 读作 A 依赖 B，被 Pick 的方向；橙色边为单次 ws_mcp_call 寻址链路。workspace 全名归一见 connection 约束行；pipeline 超时与 redact 见 §2.3 链路；stats 落盘见 DA；api 路由见 DA §3.4。节点名与正文 §2 及 mermaid 同词。</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <rect x="40" y="16" width="1080" height="100" rx="8" fill="rgba(235,108,54,0.05)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="40" fill="#eb6c36" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">装配顺序 · apply 组合根（升级链最先）</text>

      <g id="aa-seq" font-family="'Geist', sans-serif" font-size="15" text-anchor="middle">
        <rect x="60" y="50" width="140" height="52" rx="7" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="130" y="83" fill="#2d3142">apply 组合根</text>
        <rect x="222" y="50" width="140" height="52" rx="7" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="292" y="83" fill="#2d3142">upgrade 链最先</text>
        <rect x="384" y="50" width="140" height="52" rx="7" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="454" y="83" fill="#2d3142">lifecycle 次之</text>
        <rect x="546" y="50" width="140" height="52" rx="7" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="616" y="83" fill="#2d3142">McpStore 装配</text>
        <rect x="708" y="50" width="190" height="52" rx="7" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
        <text x="803" y="83" fill="#2d3142">initMiddleware 建池载表</text>
        <rect x="920" y="50" width="140" height="52" rx="7" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="990" y="83" fill="#2d3142">路由 + 可见面</text>
      </g>
      <path d="M202 76 H220" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#arrow)"/>
      <path d="M364 76 H382" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#arrow)"/>
      <path d="M526 76 H544" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#arrow)"/>
      <path d="M688 76 H706" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#arrow)"/>
      <path d="M900 76 H918" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#arrow)"/>

      <text x="40" y="142" fill="#4f5d75" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.14em">域依赖（Pick 方向）· A→B 读作 A 依赖 B</text>

      <g id="aa-upgrade">
        <rect x="40" y="154" width="340" height="100" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="210" y="192" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">upgrade</text>
        <text x="210" y="218" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle">存量迁移 · 成功写刻度</text>
      </g>
      <g id="aa-connection-top">
        <rect x="410" y="154" width="340" height="100" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="580" y="192" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">connection</text>
        <text x="580" y="218" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle">单元路由 · 状态广播</text>
      </g>
      <g id="aa-store">
        <rect x="780" y="154" width="340" height="100" rx="8" fill="#f1f5fb" stroke="#2e5aa8" stroke-width="1.6"/>
        <text x="950" y="192" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">store</text>
        <text x="950" y="218" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle">禁用表 · 目录落盘读写</text>
      </g>

      <g id="aa-lifecycle">
        <rect x="40" y="286" width="340" height="100" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="210" y="324" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">lifecycle</text>
        <text x="210" y="350" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle">官方客户端装载</text>
      </g>
      <g id="aa-config">
        <rect x="410" y="286" width="340" height="100" rx="8" fill="#f1f5fb" stroke="#2e5aa8" stroke-width="1.6"/>
        <text x="580" y="324" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">config</text>
        <text x="580" y="350" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle">schema 归一 · env 净化</text>
      </g>
      <g id="aa-catalog">
        <rect x="780" y="286" width="340" height="100" rx="8" fill="#f1f5fb" stroke="#2e5aa8" stroke-width="1.6"/>
        <text x="950" y="324" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">catalog</text>
        <text x="950" y="350" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle">采集 · digest · 检索</text>
      </g>

      <g id="aa-visibility">
        <rect x="40" y="418" width="340" height="100" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.6"/>
        <text x="210" y="456" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">visibility</text>
        <text x="210" y="482" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle">restrict 摘除 mcp__*</text>
      </g>
      <g id="aa-dispatch">
        <rect x="410" y="418" width="340" height="100" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.6"/>
        <text x="580" y="456" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dispatch</text>
        <text x="580" y="482" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle">守卫 → 路由 → 分支派发</text>
      </g>
      <g id="aa-inject">
        <rect x="780" y="418" width="340" height="100" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.6"/>
        <text x="950" y="456" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">inject</text>
        <text x="950" y="482" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif" text-anchor="middle">ws_mcp_* 注册 · 图片准入</text>
      </g>

      <path d="M580 286 V254" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="596" y="272" fill="#4f5d75" font-size="14" font-family="'Geist', sans-serif" style="paint-order:stroke;stroke:#f5f5f5;stroke-width:5px">落盘读写</text>
      <path d="M410 336 H380" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
      <path d="M380 468 H410" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
      <path d="M210 518 V534 H950 V518" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
      <path d="M750 468 H770 V204 H780" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
      <path d="M580 418 V386" fill="none" stroke="#eb6c36" stroke-width="2" marker-end="url(#arrow-accent)"/>
      <text x="596" y="404" fill="#eb6c36" font-size="14" font-family="'Geist', sans-serif" style="paint-order:stroke;stroke:#f5f5f5;stroke-width:5px">按 cwd 寻址</text>
    </svg>
  </div>
</body>
</html>
