<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1400 920" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nba-title nba-desc"><title id="nba-title">BA 业务架构：能力与非目标</title><desc id="nba-desc">notifier 0.2.4 四视图；源码基线 80a8584a，静态机制，不代表实机验证。</desc><defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#d7dbe1"/></pattern><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker></defs><rect width="1400" height="920" fill="#f5f5f5"/><rect width="1400" height="920" fill="url(#dots)" opacity="0.55"/><text x="40" y="48" fill="#2d3142" font-family="'Instrument Serif',serif" font-size="27">BA 业务架构：能力与非目标</text><text x="40" y="78" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="13">dsh-notifier · 0.2.4 · 80a8584a · 路径证据省略 packages/dsh-notifier/src/ 前缀</text><g><rect x="40" y="125" width="420" height="280" rx="8" fill="#fff8f3" stroke="#eb6c36"/><text x="60" y="155" font-family="'Geist Mono',monospace" font-size="13" fill="#4f5d75">入口</text><text x="60" y="192" font-family="'Geist',sans-serif" font-size="20" font-weight="600" fill="#2d3142">宿主事件与插件请求</text><text x="60" y="235" font-family="'Geist',sans-serif" font-size="16" fill="#4f5d75">审批 / 提问 / 完成 / 错误</text><text x="60" y="270" font-family="'Geist',sans-serif" font-size="16" fill="#4f5d75">user-questions/request 为当前提问入口</text><text x="60" y="305" font-family="'Geist',sans-serif" font-size="16" fill="#4f5d75">SDK apiVersion=2：registerKind + send</text><line x1="60" y1="335" x2="440" y2="335" stroke="#d7dbe1"/><text x="60" y="362" font-family="'Geist Mono',monospace" font-size="11" fill="#4f5d75">src/index.ts</text><text x="60" y="382" font-family="'Geist Mono',monospace" font-size="12" fill="#2e5aa8">#bindHost</text></g><g><rect x="490" y="125" width="420" height="280" rx="8" fill="#fff8f3" stroke="#eb6c36"/><text x="510" y="155" font-family="'Geist Mono',monospace" font-size="13" fill="#4f5d75">裁决</text><text x="510" y="192" font-family="'Geist',sans-serif" font-size="20" font-weight="600" fill="#2d3142">用户决定何时、向谁提醒</text><text x="510" y="235" font-family="'Geist',sans-serif" font-size="16" fill="#4f5d75">事件开关 → 动态 kind 确认 → 免打扰</text><text x="510" y="270" font-family="'Geist',sans-serif" font-size="16" fill="#4f5d75">kindRoutes 收窄启用频道</text><text x="510" y="305" font-family="'Geist',sans-serif" font-size="16" fill="#4f5d75">test 仍受组合层 enabled 约束</text><line x1="510" y1="335" x2="890" y2="335" stroke="#d7dbe1"/><text x="510" y="362" font-family="'Geist Mono',monospace" font-size="11" fill="#4f5d75">server/pipeline/impl/judge/index.ts</text><text x="510" y="382" font-family="'Geist Mono',monospace" font-size="12" fill="#2e5aa8">#judgeRequest</text></g><g><rect x="940" y="125" width="420" height="280" rx="8" fill="#fff8f3" stroke="#eb6c36"/><text x="960" y="155" font-family="'Geist Mono',monospace" font-size="13" fill="#4f5d75">结果</text><text x="960" y="192" font-family="'Geist',sans-serif" font-size="20" font-weight="600" fill="#2d3142">离屏提醒与可解释记录</text><text x="960" y="235" font-family="'Geist',sans-serif" font-size="16" fill="#4f5d75">browser：当前浏览器；system：宿主桌面</text><text x="960" y="270" font-family="'Geist',sans-serif" font-size="16" fill="#4f5d75">Bark / Webhook：配置的出站服务</text><text x="960" y="305" font-family="'Geist',sans-serif" font-size="16" fill="#4f5d75">历史记录 suppressed 与逐频道终态</text><line x1="960" y1="335" x2="1340" y2="335" stroke="#d7dbe1"/><text x="960" y="362" font-family="'Geist Mono',monospace" font-size="11" fill="#4f5d75">server/pipeline/interface.ts</text><text x="960" y="382" font-family="'Geist Mono',monospace" font-size="12" fill="#2e5aa8">#submit</text></g><g><rect x="40" y="475" width="420" height="280" rx="8" fill="#f1f5fb" stroke="#2e5aa8"/><text x="60" y="505" font-family="'Geist Mono',monospace" font-size="13" fill="#4f5d75">控制面</text><text x="60" y="542" font-family="'Geist',sans-serif" font-size="20" font-weight="600" fill="#2d3142">设置、测试与诊断</text><text x="60" y="585" font-family="'Geist',sans-serif" font-size="16" fill="#4f5d75">频道 / 事件 / 历史设置面</text><text x="60" y="620" font-family="'Geist',sans-serif" font-size="16" fill="#4f5d75">health 摘要 + diagnostics 详情</text><text x="60" y="655" font-family="'Geist',sans-serif" font-size="16" fill="#4f5d75">测试成功响应只表示受理</text><line x1="60" y1="685" x2="440" y2="685" stroke="#d7dbe1"/><text x="60" y="712" font-family="'Geist Mono',monospace" font-size="11" fill="#4f5d75">server/api/impl/probe/index.ts</text><text x="60" y="732" font-family="'Geist Mono',monospace" font-size="12" fill="#2e5aa8">#ProbeEndpoints</text></g><g><rect x="490" y="475" width="420" height="280" rx="8" fill="#f1f5fb" stroke="#2e5aa8"/><text x="510" y="505" font-family="'Geist Mono',monospace" font-size="13" fill="#4f5d75">非目标</text><text x="510" y="542" font-family="'Geist',sans-serif" font-size="20" font-weight="600" fill="#2d3142">不是审批服务或可靠消息队列</text><text x="510" y="585" font-family="'Geist',sans-serif" font-size="16" fill="#4f5d75">waterfall 必须交回 next()</text><text x="510" y="620" font-family="'Geist',sans-serif" font-size="16" fill="#4f5d75">不保证送达、展示或用户已读</text><text x="510" y="655" font-family="'Geist',sans-serif" font-size="16" fill="#4f5d75">没有跨请求身份聚合契约</text><line x1="510" y1="685" x2="890" y2="685" stroke="#d7dbe1"/><text x="510" y="712" font-family="'Geist Mono',monospace" font-size="11" fill="#4f5d75">server/sdk/impl/service/type.ts</text><text x="510" y="732" font-family="'Geist Mono',monospace" font-size="12" fill="#2e5aa8">#NotifierService</text></g><g><rect x="940" y="475" width="420" height="280" rx="8" fill="#f1f5fb" stroke="#2e5aa8"/><text x="960" y="505" font-family="'Geist Mono',monospace" font-size="13" fill="#4f5d75">边界</text><text x="960" y="542" font-family="'Geist',sans-serif" font-size="20" font-weight="600" fill="#2d3142">环境与隐私由部署决定</text><text x="960" y="585" font-family="'Geist',sans-serif" font-size="16" fill="#4f5d75">浏览器安全上下文 ≠ API 准入</text><text x="960" y="620" font-family="'Geist',sans-serif" font-size="16" fill="#4f5d75">系统声音取决于宿主能力</text><text x="960" y="655" font-family="'Geist',sans-serif" font-size="16" fill="#4f5d75">凭据掩码不等于正文脱敏</text><line x1="960" y1="685" x2="1340" y2="685" stroke="#d7dbe1"/><text x="960" y="712" font-family="'Geist Mono',monospace" font-size="11" fill="#4f5d75">src/client/index.tsx</text><text x="960" y="732" font-family="'Geist Mono',monospace" font-size="12" fill="#2e5aa8">#showNotification</text></g><path d="M460 265 H488 M910 265 H938" stroke="#eb6c36" stroke-width="2" marker-end="url(#arrow)" fill="none"/><text x="40" y="837" font-family="'Geist',sans-serif" font-size="16" fill="#2d3142">读图：上排为主线 / 结构，下排补充机制与边界；箭头表示阅读主线，具体依赖以框内说明为准。</text><text x="40" y="873" font-family="'Geist Mono',monospace" font-size="13" fill="#4f5d75">橙色：主线　蓝色：机制与约束　·　完整路径与证据语义见 dsh-notifier.md</text></svg>