packages:
  - 'packages/*'
  - 'shared'

# SDK peers 不自动安装，运行时由 DSH profile 树解析（与 dsh-web-ui 同策略）。
autoInstallPeers: false

# @deepseek-ai/* 官方类型层统一锁版（issue #16，与 DSH 发布节奏同步升级，
# 升级须跑全量门禁并核验 SessionHeader.origin / Agent.session 结构）。
# 注意：@deepseek-ai/cordis 版本体系独立（4.x），不随 dsh-* 的 rc 节奏走。
# 仅限 import type（编译期擦除），禁止任何运行时值导入（contract-check 有门禁）。
catalog:
  '@deepseek-ai/cordis': 4.0.1
  '@deepseek-ai/dsh-agent': 0.1.1-rc.2
  '@deepseek-ai/dsh-agent-default-model': 0.1.1-rc.2
  '@deepseek-ai/dsh-host-webserver': 0.1.1-rc.2
  '@deepseek-ai/dsh-llm': 0.1.1-rc.2
  '@deepseek-ai/dsh-session': 0.1.1-rc.2
  '@deepseek-ai/dsh-session-title': 0.1.1-rc.2
  '@deepseek-ai/dsh-system-prompt': 0.1.1-rc.2
  '@deepseek-ai/dsh-tools': 0.1.1-rc.2
  '@deepseek-ai/dsh-user-approval': 0.1.1-rc.2

allowBuilds:
  esbuild: true

# 供应链 minimumReleaseAge 策略的预备豁免清单：当前仓库未开启该策略，此列表暂为
# 死配置；一旦全局启用 minimumReleaseAge（rc 包发布时间新、会超龄拦截），按此清单
# 豁免官方 rc 包。升级锁版版本号时同步更新此处。
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-agent@0.1.1-rc.2'
  - '@deepseek-ai/dsh-agent-default-model@0.1.1-rc.2'
  - '@deepseek-ai/dsh-host-webserver@0.1.1-rc.2'
  - '@deepseek-ai/dsh-llm@0.1.1-rc.2'
  - '@deepseek-ai/dsh-session-title@0.1.1-rc.2'
  - '@deepseek-ai/dsh-session@0.1.1-rc.2'
  - '@deepseek-ai/dsh-system-prompt@0.1.1-rc.2'
  - '@deepseek-ai/dsh-tools@0.1.1-rc.2'
  - '@deepseek-ai/dsh-user-approval@0.1.1-rc.2'
