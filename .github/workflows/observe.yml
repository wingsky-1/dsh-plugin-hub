name: Observe (nightly)

# #85 v3 F1/F6 定案：观察期采集与变异门禁的夜间调度。
# - cov / self-cov --check（阈值硬校验）/ crap 明细
# - 六包全量变异（串行）+ mutate 面守卫（F5）
# - 报告落 issue（幂等：同日不重开）；回落 >1pp 自动追评（隔夜必有工单）
# 变异硬门禁在本 workflow 生效：任一包 covered < threshold 且 strict 开启 → 运行失败。
# #178 v2 增量链路（#204 修订：缓存 → 仓库内版本化基线）：
# - 本 workflow 刻意不做 actions/cache restore —— 无增量基线即天然全量，无需 --force；
#   请勿"好心"补 restore 步骤（会破坏全量基线语义）。
# - 全量运行末尾将六份 incremental 基线收集到 scripts/gate/baseline/（仓库内文件，
#   #204 方案 A），有实质变化时经 create-pull-request 自动开 PR 合入 main；
#   PR 侧 ci.yml mutation-gate 直接读该目录文件走增量变异。
# - 背景：actions/cache 按 ref 隔离（PR 永远读不到 main 的缓存，社区广泛确认
#   GitHub Community #58583），#204 实证此前增量链路对 PR 从未生效。

on:
  schedule:
    # UTC 18:43 = 北京时间 02:43，避开整点 GitHub Actions 高峰（夜间兜底）
    - cron: '43 18 * * *'
  push:
    # #204 用户指示：基线更新不必等夜间——每次 PR 合入 main 即触发全量变异更新基线，
    # 使基线始终跟随 main 最新状态，后续 PR 增量面仅含本次合入改动（避免一天改动
    # 堆积导致次日所有 PR 增量慢）。
    # paths-ignore（#204 修订）：基线 PR 合入只改 scripts/gate/baseline/** → 事件层
    # 被过滤不触发 observe（防白跑 30min 全量变异）。
    branches: [main]
    paths-ignore: ['scripts/gate/baseline/**']
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  # #204 修订：按事件分组——push 触发可被新合入取代（cancel），schedule 兜底必须完整跑完
  group: observe-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  nightly:
    name: Cov / Crap / Mutation nightly
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        # 版本以根 package.json 的 packageManager 字段为单一事实源（勿同时指定 version）

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all
        run: pnpm build

      - name: Coverage（c8 采集）
        run: pnpm cov

      - name: Self-written coverage gate（selfWrittenFunctions threshold 硬校验）
        run: node scripts/gate/self-cov.mjs --check

      - name: CRAP check（复杂度×覆盖率，观察期只记录）
        run: pnpm crap
        continue-on-error: true   # 观察期：基线校准归 #42 二期

      - name: Mutation scope guard（F5：mutate 区间须落在 // lib/*.js 分段边界内）
        run: node scripts/gate/mutate-scope-guard.mjs

      - name: Mutation suites（全部变异配置串行全量；单配置失败记账继续跑完，结尾统一判红）
        # id 供 collect 步骤区分「整套 skip（无产物无从收集）」与「部分失败
        # （记账夜已产出的基线照常收集）」（#217）
        id: mutation-suites
        # #178 逐包容错：strict 判红路径下 incremental 基线已先落盘（StrykerJS 源码核实），
        # 记账继续可让后续包照常产出报告与基线，避免单包连锁丢弃整夜数据。
        # #220 B 方案：不再硬编码包名单 —— glob stryker.conf.d/dsh-*.json 全集
        #（含拆分三包的段配置与未拆分包的包级配置），新增/退役配置自动纳入
        run: |
          FAILED=0
          FAILED_CONFS=''
          for conf in stryker.conf.d/dsh-*.json; do
            name="$(basename "$conf" .json)"
            echo "::group::stryker $name"
            if npx stryker run "$conf"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::变异套件失败：$name（记账后继续执行其余配置）"
              FAILED=1
              FAILED_CONFS="$FAILED_CONFS $name"
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::以下变异套件失败，统一判红:$FAILED_CONFS"
            exit 1
          fi

      - name: Collect incremental baseline（#204：收集到仓库内 scripts/gate/baseline/）
        # #204 方案 A（业界最佳实践）：夜间基线改「仓库内版本化文件」，替代 actions/cache
        # save。actions/cache 按 ref 隔离（PR 永远读不到 main 的缓存，社区广泛确认，
        # GitHub Community #58583），而 git 内容跨 ref 天然可见、可本地实证。
        # if: always() && 非 skipped —— 部分失败夜已产出的基线文件照常收集；
        # 但整套变异被 skip 时无任何产物，collect 不运行（防 copied=0 误红，#217）。
        if: always() && steps.mutation-suites.outcome != 'skipped'
        run: node scripts/gate/collect-incremental-baseline.mjs

      - name: Open baseline PR（基线有变化时自动建 PR 合入 main）
        # create-pull-request 只在有 diff 时创建 PR（无变化 = no-op，不产生噪音提交）。
        # 受保护分支禁止 workflow 直接 push main → 走 PR + auto-merge 路径。
        # PR 由 bot 身份创建，auto-merge 需在 PR 创建后由后续步骤开启（该 action 本身
        # 不自动合并，仅建 PR；合并策略见下）。
        if: always()
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ci/incremental-baseline
          base: main
          title: 'chore(ci): update incremental mutation baseline（基线快照）'
          body: |
            全量变异产出的 Stryker incremental 基线快照（#204 方案 A；main push 或夜间调度触发）。

            变更内容：`scripts/gate/baseline/` 下的六包 incremental 基线文件与
            manifest.json（仅当基线内容有实质变化时本 PR 才会被创建）。

            无代码逻辑变更；合并后 PR 的 mutation-gate 将直接读取本目录基线
            走增量变异（跳过未变 mutant），替代失效的 actions/cache 跨 ref 通道。
          commit-message: 'chore(ci): update incremental mutation baseline（基线快照）'
          labels: 'ci'
          delete-branch: true
          signoff: false

      - name: Auto-merge baseline PR（若被创建）
        # create-pull-request 只建 PR 不合并；此处用 gh 开启 auto-merge。
        # 竞态处理：create-pull-request 刚创建 PR 后，GitHub API 可能有传播延迟，
        # 单次 gh pr list 可能查不到 → 用循环重试（最多 60s）规避。
        # 注意：auto-merge 需要分支保护规则允许该 bot PR 自动合并（CI 全绿 + 无
        # review 要求，或配置 auto-merge 通过条件）。若保护规则要求 review，本步骤
        # 会失败并在日志提示，不影响夜间报告其余流程。
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=""
          for i in $(seq 1 12); do
            PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head ci/incremental-baseline --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)
            if [ -n "$PR" ]; then
              echo "PR #$PR 已可见（第 ${i} 次轮询）"
              break
            fi
            echo "等待 PR 可见性传播（第 ${i} 次，5s）…"
            sleep 5
          done
          if [ -n "$PR" ]; then
            echo "开启 auto-merge：PR #$PR"
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash || \
              echo "::warning::auto-merge 开启失败（可能受分支保护 review 规则限制）——需人工合入 PR #$PR"
          else
            echo "无基线变更 PR（基线内容未变化或创建失败），跳过 auto-merge"
          fi

      - name: Threshold check & report body（阈值校验 + 回落检测 + 报告产出）
        id: report
        run: |
          set -e
          node scripts/gate/observe-check.mjs --body-file observe-body.md --marker-file observe-marker.txt
          # 报告与回落标记均以文件传递（#204：$GITHUB_OUTPUT 多行值在中文+换行内容下
          # 触发 "Matching delimiter not found" 解析失败；GitHub 官方文档明示值不可控时
          # 应写文件而非用 delimiter 格式）。下游步骤直接读 observe-body.md /
          # observe-marker.txt（[ -s file ] 判断非空）。

      - name: Create/update observe issue（幂等：同日重跑不重复建；回落即追评）
        if: always() && steps.report.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TITLE="chore(observe): 夜间质量报告 $(date -u +%Y-%m-%d)"
          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "issue #$EXISTING 已存在，跳过创建"
          else
            gh issue create --title "$TITLE" --body-file observe-body.md
          fi
          # F6 回落闭环：标记文件非空 = 存在指标回落 → 在当日 issue 上追加警示评论
          if [ -s observe-marker.txt ]; then
            NUM=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
            gh issue comment "$NUM" --body-file observe-marker.txt || true
          fi

      - name: Upload artifacts（coverage / mutation 报告留档）
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: observe-reports
          path: |
            coverage/self-coverage.json
            coverage/mutation/
          retention-days: 14
          if-no-files-found: error   # 报告缺失本身即异常（fail-closed，评审 F4 旁证）
