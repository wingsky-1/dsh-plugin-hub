name: Observe (nightly)

# #85 v3 F1/F6 定案：观察期采集与变异门禁的夜间调度。
# - cov（含阈值硬校验：vitest 的 coverage.thresholds 未达标即非零退出）；
#   CRAP 明细自 #722 阶段三起停用（数据源口径不可比），见下方 Coverage 步骤旁注释
# - 全量变异（#718 S1.1 起改为**逐段矩阵**，并行度由 max-parallel 控制）
# - 报告落 issue（幂等：同日不重开）；回落 >1pp 自动追评（隔夜必有工单）
# 变异硬门禁在本 workflow 生效：任一包 covered < threshold 且 strict 开启 → 运行失败。
# #276 方案 A + #433 调度重设计 + #572 孤立分支基线：本 workflow 为每日全量班（北京次日 04:00 = UTC 20:00，
# cron '0 20 * * *'）——全量变异 + 基线并集入档至孤立分支 baseline/mutation。
# #718 S2.2：原每日四班次增量班（observe-incremental.yml）**已退役**——基线新鲜度由
# 「PR 合入即 baseline-overlay.yml 秒级 overlay」+「本班次夜间并集入档」两条路径承担。
# #178 v2 增量链路（#572：基线改走 Orphan 孤立分支存储）：
# - 本 workflow 刻意不做 actions/cache restore 与基线 restore —— 无增量基线即天然全量；
#   请勿"好心"补 restore 步骤（会破坏全量基线语义）。
# - 全量运行末尾将 incremental 基线提交至孤立分支 baseline/mutation（单 commit 纯文本树，
#   #572），PR 侧 ci.yml mutation-gate 直接浅拉取该分支走增量变异，彻底剥离 main 分支代码树巨型 JSON 与自动 PR 噪音。
#
# #718 S1.1 / S1.4 / S1.5（本 job 拓扑的成因，务必连着读）：
# - **S1.5 job 边界**：`quality`（install + build + contract/pack:check/verify:npmlayout +
#   stryker:check + cov + crap）与 `mutation-shards` **无相互依赖、并行跑**；两者产出由
#   `mutation-collect`（判分 + 单点并集入档 + 报告 + 工单，if: always()）收口。
#   为什么必须拆：原单 job 串行 90 分钟，任一长段擦边即整班被杀，且被杀点在报告步骤之前
#   ⇒ 当夜无工单、无留痕、基线不更新（#718 两次事故 34536263640 / 34652766708 的形态）。
# - **S1.1 矩阵化**：段清单由 `stryker.conf.d/*.json` 派生（`mutation-plan` job 秒级产出），
#   每段一个矩阵实例；`max-parallel: 8`（取 8 的依据见下方 mutation-shards 的 strategy
#   注释：账户并发余量 + 与 ci.yml mutation-gate 同值限流；8 档并非「已饱和」）。
# - **S1.4 逐段超时**：`timeout-minutes` 取 `matrix.shard.timeoutMinutes`，由
#   `scripts/gate/mutation-plan.mjs` 按 `mutation-segment-ledger.json` 里该段 `scope=full`
#   的实测墙钟 × 1.5 + 构建开销派生，下限 10 分钟（#718 整合版规定）；无实测的段取保守
#   默认值。`fail-fast: false`：单段失败不连坐其余段，配合 `gh run rerun --failed` 定向重跑。

on:
  schedule:
    # 每日全量变异与基线刷新（#276 方案 A + #433 调度重设计）：北京次日 04:00
    # = UTC 20:00，避开整点 Actions 高峰（增量班已于 #718 S2.2 退役）
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  # #572：基线同步统一互斥锁，排队顺序落盘，消除并发覆盖踩踏
  group: mutation-baseline-sync
  cancel-in-progress: false

jobs:
  # ── 段清单与逐段超时 ──────────────────────────────────────────────
  # 为什么需要这个 job：GHA 的动态 matrix 只能引用 `needs` 的 output，**不能读工作区文件**，
  # 而「哪些段要跑」的唯一事实源是 stryker.conf.d/*.json（随拆段/加包自动演进，
  # #720 拆段即 31→33）。故由本 job 把文件系统事实翻译成 matrix 可消费的 JSON。
  # 秒级完成，不构成并行度瓶颈。
  mutation-plan:
    name: Plan mutation shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          # 本 job 只跑 Node 内置模块，不 pnpm install；显式关掉 setup-node 的
          # package-manager-cache（它会调 PATH 里的 pnpm，而本 job 无 pnpm/action-setup）
          package-manager-cache: false

      - name: Derive shard matrix（段清单 + 逐段超时）
        id: plan
        run: node scripts/gate/mutation-plan.mjs

  # ── 质量侧（无 needs：与 mutation-shards 并行跑，S1.5）──────────────
  quality:
    name: Quality (cov / crap / artifact gates)
    runs-on: ubuntu-latest
    # cov + crap + 三个全仓产物闸 + 全量 build 的实测墙钟远低于此值；
    # 设 30 分钟是给 runner 抖动与主干增长留余量，不与变异段的预算互相挤占。
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        # 版本以根 package.json 的 packageManager 字段为单一事实源（勿同时指定 version）

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all
        run: pnpm build

      # #722 门禁分层：PR 侧改为「命中包切片」后，全仓产物闸（contract / pack:check /
      # verify:npmlayout）必须在这里落地——否则「全仓打包契约」在默认 PR 路径上无人检查，
      # 只靠 gate:full 标签的 PR 属自觉行为。三个闸都需要全仓 lib 产物，故紧随 Build all。
      - name: Client contract（全仓）
        run: pnpm contract

      - name: Pack check（全仓）
        run: pnpm pack:check

      - name: Npm layout（全仓）
        run: pnpm verify:npmlayout

      # 这四条原先由 Client contract 以子进程执行（审计 P0-1 迁成直接步骤）：内嵌形态下 workflow
      # 里看不到它们，本班次的覆盖面也就不可审计；迁出后必须在这里同样落到（PR 侧由 repo-gate 承担）。
      - name: Verify dir imports（目录门面：跨模块引用只走 interface.ts；4 包硬判）
        run: node scripts/gate/verify-dir-imports.mjs --package dsh-mcp-manager --package dsh-notifier --package dsh-lan-proxy --package dsh-worktree-sidebar

      - name: Verify dir imports（provider-usage，--soft）
        run: node scripts/gate/verify-dir-imports.mjs --package dsh-provider-usage --soft

      - name: Export surface snapshot（dsh-notifier 导出面与基线零 diff）
        run: node scripts/gate/export-surface-snapshot.mjs --package dsh-notifier

      - name: Export surface snapshot（dsh-lan-proxy 导出面与基线零 diff）
        run: node scripts/gate/export-surface-snapshot.mjs --package dsh-lan-proxy

      - name: Export surface snapshot（dsh-worktree-sidebar 导出面与基线零 diff）
        run: node scripts/gate/export-surface-snapshot.mjs --package dsh-worktree-sidebar

      - name: Export surface snapshot（dsh-mcp-manager 导出面与基线零 diff）
        run: node scripts/gate/export-surface-snapshot.mjs --package dsh-mcp-manager

      - name: Export surface snapshot（dsh-provider-usage 导出面与基线零 diff）
        run: node scripts/gate/export-surface-snapshot.mjs --package dsh-provider-usage
      - name: Export surface snapshot（dsh-jev-decide 导出面与基线零 diff）
        run: node scripts/gate/export-surface-snapshot.mjs --package dsh-jev-decide

      - name: Verify shared fan-in（shared 模块跨包扇入；#792）
        run: node scripts/gate/verify-shared-fanin.mjs

      - name: Stryker config check（变异配置与拓扑 SSOT 一致）
        run: pnpm stryker:check

      # #722 阶段三：阈值判分进入 vitest 的 coverage.thresholds，未达标即非零退出——
      # 本步骤同时承担采集与硬校验，原独立的 self-cov --check 执行点随之退役。
      - name: Coverage（vitest coverage，阈值 coverage.thresholds 内 fail-closed）
        run: pnpm cov

      # CRAP 于 #722 阶段五完成 src 口径重建（复杂度取自 ESLint 的 complexity 规则，
      # 覆盖率取自同一份 src 口径产物，两者行号可比），恢复接入本班次。
      # 覆盖率面交叉断言：产物（coverage/coverage-final.json）已产出，此时验「产物 keys ⊆ include
      # 面」才有意义——PR 组 A 跑本闸时产物还不存在，那里的执行点只覆盖结构与面完整性。
      - name: Coverage scope（产物交叉断言）
        run: node scripts/gate/verify-coverage-scope.mjs

      - name: CRAP（热点报告；strict 见 gauntlet.config.json 的 crap.strict）
        run: pnpm crap

      # #765：豁免/临时项到期台账（纯报告，脚本退出码恒 0，不会让本班变红）。
      # 放夜间全量班而不是 PR 路径——它的用途是排期复核（人工裁决续期或收口），
      # 每次 PR 都打印同一份存量台账只会变成噪音。
      - name: Exemption ledger（豁免到期台账，仅报告）
        run: node scripts/gate/collect-exemptions.mjs

      - name: Upload coverage summary（供 mutation-collect 的报告展示；#718 S1.5）
        # 报告正文同时含覆盖率与变异率，故覆盖率产物必须跨 job 传递。
        # 失败时不阻断收口：collect 侧的 observe-check 对该文件本就是可选的。
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 14
          if-no-files-found: warn

  # ── 变异矩阵：每段一个实例（S1.1）────────────────────────────────
  mutation-shards:
    name: Mutation shard (${{ matrix.shard.seg }})
    needs: mutation-plan
    strategy:
      # S1.4：单段失败不连坐——原串行实现的「单配置失败记账继续跑完」语义由矩阵天然承担，
      # 且失败段可用 `gh run rerun --failed` 定向重跑，无需整班重来。
      fail-fast: false
      # S1.1 + #718 P3（维护者 approved）：取 8，与 ci.yml mutation-gate 同值限流。取 8 的
      # 依据是**账户并发余量**，不是「8 档已饱和」——8 档在两种调度形态下都尚未到零收益：
      # - 本 job 按台账估计耗时降序（LPT，mutation-plan 的 buildShardMatrix）：夜间全量 32 段（当时口径；#826 后为 35 段）、
      #   台账合计 14803 s，模型 @8 = 31.24 min、@10 = 25.22 min（总工作量下界 30.84 / 24.67）。
      # - ci.yml 侧的 PR 矩阵是 package+seg 字典序（非 LPT）：run 34764977606（12 段、
      #   合计 145.65 min、5 槽）实测窗口 43.05 min，与同序模型 43.00 min 吻合；
      #   同口径模型 @8 = 29.83 min、@10 = 26.80 min。
      # - 以上都是**模型值**：同段集的 LPT 模型给 30.63 min，而全量/失效形态实测窗口到过
      #   43.0 min（#718 approved 记录）——实际受 runner 排队与调度形态影响。
      # - 增量形态实测（本项 PR run 34796310130 / 96637f96，当时 32 段、8 档）：mutation 窗口
      #   3.87 min、本轮全 run 并发峰值 15、mutation-verdict pass。
      # - 账户并发上界 20 是 #718 S0.3 的**历史实测口径**（PR #753 的 100 个 run，峰值分布
      #   20×15 / 19×4 / 18×1）。scripts/maintenance/scan-actions-concurrency.mjs 未过滤
      #   cancelled run，直接复跑会因被取消 run 的排队 job 时间戳得到伪影（复核实测 max=35，
      #   同一 run 滤掉 cancelled 后为 11）——故沿用历史口径，扫描器另记 follow-up。
      #   本仓峰值 = build-test（**至多 7** = 命中包数；实测有 1、1+哨兵、7）+ max-parallel：
      #   8 档 → 至多 15，gate:full 带 coverage → 16；10 档 → 17~18，只剩 3 个余量。
      # docs/mutation-speedup-methodology.md §4.3 的 timeout 机制核对不适用（本项是 job 级
      # 并发，每 job 独立 runner VM，不改 Stryker 段内 concurrency）；score 与基线口径的核对
      # 见上一条 8 档实测（run 34796310130，mutation-verdict pass）。
      max-parallel: 8
      matrix:
        # 段清单与逐段超时均来自 mutation-plan（见该 job 与文件头注释）
        shard: ${{ fromJSON(needs.mutation-plan.outputs.shards) }}
    runs-on: ubuntu-latest
    # S1.4：逐段超时（下限 10 分钟），由台账里该段 scope=full 的实测墙钟派生；
    # 无实测的段取保守默认值。原实现取整班 90 分钟，长段擦边即整班被杀。
    timeout-minutes: ${{ matrix.shard.timeoutMinutes }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        # 版本以根 package.json 的 packageManager 字段为单一事实源（勿同时指定 version）

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 必须全量构建（run #32790425132 教训）：变异面按 src 级文件 glob 声明，
      # 但测试面与 workspace 内联链（shared/ 与依赖包副本）需要全集一致的构建产物。
      - name: Build all packages
        run: pnpm build

      - name: Mutation shard（全量冷跑：本班无基线 restore，见文件头）
        run: npx stryker run "stryker.conf.d/${{ matrix.shard.seg }}.json"

      # if: always()：实例非零退出（崩溃 / 内建阈值不足）时已产出的报告照常下发聚合判分；
      # 未产出报告时 if-no-files-found: error 让实例自身红（fail-closed）。
      - name: Upload shard reports（交 mutation-collect 统一判分与归档）
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-shard-${{ matrix.shard.seg }}
          path: |
            coverage/mutation/${{ matrix.shard.seg }}.json
            coverage/mutation/incremental-*.json
          retention-days: 1
          if-no-files-found: error

  # ── 收口：判分 + 单点 push 基线 + 报告 + 工单（S1.5）──────────────
  # - 各段报告（mutation-shards 矩阵）与覆盖率（quality）在此汇合后判分：
  #   报告齐备性由 observe-check.mjs 按 stryker.conf.d/ 派生的段集合校验（缺段 fail-closed）。
  # - `if: always()`：矩阵实例失败、quality 失败（cov 阈值不达标）时本 job 仍运行——
  #   它同时承担「已产出数据的收集」与「异常留痕」，这正是 #718 两次事故中缺失的环节
  #   （取消点在报告步骤之前 ⇒ 当夜无工单、基线不更新且无人察觉）。
  # - 判分链与基线推送均为纯 Node 内置模块 + git，无需 pnpm install。
  mutation-collect:
    name: Mutation collect (score + baseline + report)
    needs: [mutation-plan, quality, mutation-shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # 基线推送要操作孤立分支，需要完整 ref 视图
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          # 本 job 不 pnpm install（判分链为纯 Node 内置模块），必须显式关闭
          # setup-node v5 默认的 package-manager-cache：它探测到 pnpm-lock.yaml 会调
          # PATH 中的 pnpm，而本 job 无 pnpm/action-setup（实证 run 32879414842）。
          package-manager-cache: false

      - name: Download shard reports
        # 全段失败时也可能零产物：不因下载为空而阻断收口——「零报告」本身要由
        # 后续的报告齐备性校验判红并留痕，而不是让本步骤先崩掉。
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mutation-shard-*
          path: coverage/mutation

      - name: Download coverage summary
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-summary
          path: coverage

      - name: Restore report layout（多 artifact 下载各建子目录，平铺回 coverage/mutation/）
        id: reports
        run: |
          set -e
          mkdir -p coverage/mutation
          shopt -s nullglob
          for dir in coverage/mutation/mutation-shard-*; do
            [ -d "$dir" ] || continue
            for report in "$dir"/*.json; do cp "$report" coverage/mutation/; done
          done
          REPORTS=(coverage/mutation/dsh-*.json)
          COUNT=${#REPORTS[@]}
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "报告 artifact 还原完成：${COUNT} 份段报告"
          if [ "$COUNT" -eq 0 ]; then
            echo '::warning::本班次未产出任何段报告（全部实例失败或被杀）—— 基线不更新，由收尾工单留痕'
          fi

      - name: Threshold check & report body（阈值校验 + 回落检测 + 报告产出）
        id: report
        if: steps.reports.outputs.count != '0'
        run: |
          set -e
          node scripts/gate/observe-check.mjs --body-file observe-body.md --marker-file observe-marker.txt --status-file observe-status.json
          # 报告与回落标记均以文件传递（#204：$GITHUB_OUTPUT 多行值在中文+换行内容下
          # 触发 "Matching delimiter not found" 解析失败；GitHub 官方文档明示值不可控时
          # 应写文件而非用 delimiter 格式）。下游步骤直接读 observe-body.md /
          # observe-marker.txt（[ -s file ] 判断非空）。

      - name: Archive baseline to orphan branch（#718 S1.2：并集入档 + 对账）
        # #572：替代旧方案（#204 方案 A：向 main 自动建 PR 提交数十万行 JSON 导致 git 膨胀）。
        # 将最新增量基线以单 commit 纯文本树推送到孤立分支 refs/heads/baseline/mutation，
        # 享受 Git Blob 原生内容去重红利，彻底净化 main 分支代码树与提交历史。
        # #718 S1.5：本步骤**单点**落在收口 job——矩阵各实例不再各自推送，消除并发覆盖踩踏。
        # #718 S1.2：由整树替换改为**并集入档**——先取回远端基线，本次未产出的段沿用远端文件
        # 并在日志里记账（新算/沿用/缺/退役），段被失败实例吃掉因而在物理上不可能再发生；
        # 拉取失败一律 fail-loud（取不到远端 = 沿用集合未知，以空集合推送就是删段）。
        if: always() && steps.reports.outputs.count != '' && steps.reports.outputs.count != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OBSERVE_PAT: ${{ secrets.OBSERVE_PAT }}
        run: node scripts/gate/orphan-baseline.mjs archive

      - name: Create/update observe issue（幂等：同日重跑不重复建；回落即追评）
        # #765 G1：原条件 `steps.report.outcome == 'success'` 恰好把**违约夜**排除在外——
        # 违约正是判分 exit 1 的那一刻，于是只剩正常夜有工单（实测最后一张 = #683 /
        # 2026-09-09，其后违约夜零工单）。always 收尾：零报告/缺 count/无正文均诊断，
        # 有正文则保留判分结果；同日已有工单仍追加本次结果。
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_COUNT: ${{ steps.reports.outputs.count }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SHARDS_RESULT: ${{ needs.mutation-shards.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          TITLE="chore(observe): 夜间质量报告 $(date -u +%Y-%m-%d)"
          BODY=observe-body.md
          DIAGNOSTIC=false
          if [ -z "$REPORT_COUNT" ] || [ "$REPORT_COUNT" = "0" ] || [ ! -s "$BODY" ]; then
            DIAGNOSTIC=true
            echo "::error::判分未产出报告正文（$BODY 缺失或为空）—— 以诊断工单留痕"
            {
              echo "## 夜间质量报告（判分无数据）"
              echo
              echo "本班次数据缺失，无法给出覆盖率 / 变异率结论。"
              echo "报告数量：${REPORT_COUNT:-缺失}；判分：${REPORT_OUTCOME:-未知}；quality：${QUALITY_RESULT:-未知}；shards：${SHARDS_RESULT:-未知}"
              echo "运行：${RUN_URL:-未知}"
              echo "判分状态文件："
              echo
              echo '```json'
              cat observe-status.json 2>/dev/null || echo '(状态文件亦缺失)'
              echo '```'
            } > "$BODY"
          fi
          if [ "$QUALITY_RESULT" != "success" ] || [ "$SHARDS_RESULT" != "success" ]; then
            DIAGNOSTIC=true
            echo "::error::上游任务未成功——保留判分正文并追加诊断"
            {
              echo
              echo "## 上游任务未成功"
              echo
              echo "quality：${QUALITY_RESULT:-未知}；shards：${SHARDS_RESULT:-未知}"
              echo "运行：${RUN_URL:-未知}"
            } >> "$BODY"
          fi
          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            # 同日重跑仍追加本次结果：诊断、部分报告和违约正文不能被旧报告掩盖。
            gh issue comment "$EXISTING" --body-file "$BODY"
          else
            gh issue create --title "$TITLE" --body-file "$BODY"
          fi
          # F6 回落闭环：标记文件非空 = 存在指标回落 → 在当日 issue 上追加警示评论。
          # bash 陷阱：`if ...; then ...; fi` 整体实测 exit 0，`set -e` 不会传播 gh 的失败，
          # 故这里显式告警——评论失败不该让整班变红，但也不能无声吞掉。
          if [ -s observe-marker.txt ]; then
            NUM=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
            gh issue comment "$NUM" --body-file observe-marker.txt || echo "::warning::回落评论追加失败（issue #$NUM）"
          fi
          # 无有效判分或上游非 success，留痕后仍须判红。
          [ "$DIAGNOSTIC" = false ] || exit 1

      - name: Upload artifacts（coverage / mutation 报告留档）
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: observe-reports
          path: |
            coverage/coverage-summary.json
            coverage/mutation/
          retention-days: 14
          # 报告缺失本身即异常，但此处不判红：判红由 observe-check 的段齐备性校验承担，
          # 本步骤只负责留档（若在此 error，被杀夜次会连「零产物」这一事实都留不下）。
          if-no-files-found: warn
