name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── 第 1 段：路径预筛（声明式 filter；失败一律 fallback 全量 = fail-closed）──
  changes:
    name: Detect changed packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # 命中"需跑 smoke/typecheck 切片"的包清单（json 数组，可为 []）
      hitPackages: ${{ steps.pkgs.outputs.hitPackages }}
      # 增量变异切片清单（#178）：hitPackages 剔除聚合包 dsh-plugins-all（无变异配置）
      mutationPackages: ${{ steps.pkgs.outputs.mutationPackages }}
      # 变异 matrix 组合清单（#220 B 方案）：[{package, seg}] —— 拆分包按
      # stryker.conf.d/<pkg>-<后缀>.json（功能段名/数字段名统一）展开为多实例
      # 并行，未拆分包 seg="0" 走包级配置（#342 二期功能命名改造）
      mutationCombos: ${{ steps.pkgs.outputs.mutationCombos }}
      # 切片是否含变异对象包（#217：显式布尔字符串 'true'/'false'）。GHA 表达式
      # 无取长度与管道能力，在 if 里对清单做取长判空或裸数组文本比较均脆弱；
      # 下游 if 一律用 needs.changes.outputs.hasMutations == 'true' 精确比较
      hasMutations: ${{ steps.pkgs.outputs.hasMutations }}
      # 全量包清单（单一事实源，从 plugins-manifest.json active + 聚合包派生）：
      # 供 repo-gate 产物齐备断言等下游消费，空清单 fail-closed
      allPackages: ${{ steps.pkgs.outputs.allPackages }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # F4：push 事件 diff 基准是 github.event.before（SHA），需完整历史保证可达；
          # PR 事件以 origin/main 为三点比基准同样依赖本地对象完整性
          fetch-depth: 0

      - name: Resolve diff base
        id: base
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && echo "${{ github.event.before }}" | grep -qv '^0*$'; then
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            # 全零 SHA（force push / 新分支首推）：base 置空 → 下方按全量处理
            echo "base=" >> "$GITHUB_OUTPUT"
            echo '::notice::push 事件 before 不可用 —— 按全量处理（fail-closed）'
          fi

      - name: Paths filter
        id: filter
        if: steps.base.outputs.base != ''
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          base: ${{ steps.base.outputs.base }}
          filters: |
            global:
              - 'shared/**'
              - 'scripts/**'
              - 'agents/**'
              - '.github/**'
              # docs/** 刻意不在 global 面（#220）：gate/build/release 脚本均不消费
              # docs/ 内容，文档 PR 无需变异切片与 smoke/typecheck（release-notes
              # 校验仅存在于 tag 触发的 release.yml）。若未来新增消费 docs 的门禁
              # 脚本，须同步加回此处——workflow-assert 契约已锁定该约定
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - 'AGENTS.md'
            dsh-notifier:
              - 'packages/dsh-notifier/**'
              # #322：stryker 段配置变更须命中本包面（段配置是 mutation 单一事实源，
              # 不映射则配置类 PR 的 mutation 矩阵全 skip、无法自证）。模式遵循
              # 包级 <pkg>.json 与段级 <pkg>-<n>.json 两种形态的通配覆盖
              - 'stryker.conf.d/dsh-notifier*.json'
            dsh-idle-archive:
              - 'packages/dsh-idle-archive/**'
              - 'stryker.conf.d/dsh-idle-archive*.json'
            dsh-web-file-preview:
              - 'packages/dsh-web-file-preview/**'
              - 'stryker.conf.d/dsh-web-file-preview*.json'
            dsh-mcp-manager:
              - 'packages/dsh-mcp-manager/**'
              - 'stryker.conf.d/dsh-mcp-manager-*.json'
            dsh-provider-usage:
              - 'packages/dsh-provider-usage/**'
              - 'stryker.conf.d/dsh-provider-usage-*.json'
            dsh-lan-proxy:
              - 'packages/dsh-lan-proxy/**'
              - 'stryker.conf.d/dsh-lan-proxy-*.json'
            dsh-subagent-model-inherit:
              - 'packages/dsh-subagent-model-inherit/**'
              - 'stryker.conf.d/dsh-subagent-model-inherit*.json'
            dsh-codegraph:
              - 'packages/dsh-codegraph/**'
            dsh-verify-isolated:
              - 'packages/dsh-verify-isolated/**'
            dsh-plugins-all:
              - 'packages/dsh-plugins-all/**'

      - name: Compute hit packages
        id: pkgs
        env:
          GLOBAL_HIT: ${{ steps.filter.outputs.global }}
          FILTER_OUTCOME: ${{ steps.filter.outcome }}
          BASE_SET: ${{ steps.base.outputs.base }}
        run: |
          set -e
          # ── 单一事实源：切片/产物清单从 plugins-manifest.json 派生（#306 评审）──
          # active 集（进聚合、参与切片）来自 manifest；聚合包 dsh-plugins-all 手工
          # 补入（manifest.active 不含聚合包自身）。新增 active 包只改 manifest 一处，
          # 全量列表（fallback / GLOBAL_HIT / 547 产物断言）自动跟随。
          # 空清单 = exit 1（fail-closed：任何消费方不得在空清单下静默通过）。
          read_manifest_active() {
            python3 -c "import json,sys;print(json.dumps(json.load(open('scripts/data/plugins-manifest.json'))['active']))" \
              || { echo '::error::读取 plugins-manifest.json 失败（fail-closed）'; exit 1; }
          }
          ALL_ACTIVE="$(read_manifest_active)"
          ALL_PACKAGES="$(printf '%s' "$ALL_ACTIVE" | jq -c '. + ["dsh-plugins-all"]')"
          if [ "$(printf '%s' "$ALL_PACKAGES" | jq 'length')" -eq 0 ]; then
            echo '::error::包清单为空（fail-closed，禁止静默通过）'
            exit 1
          fi
          echo "全量包清单（单一事实源）: $ALL_PACKAGES"
          # mutationPackages：hitPackages 剔除聚合包后的增量变异切片（#178）；
          # mutationCombos（#220 B 方案）：切片按 stryker.conf.d/ 段配置展开为
          #   matrix 组合 —— 存在 <pkg>-<后缀>.json 的包逐段实例化（后缀即
          #   功能段名，如 dsh-notifier-server.json → seg=server；数字段名
          #   dsh-lan-proxy-1.json → seg=1 亦兼容），否则 seg=0 走包级配置；
          #   段名以 conf 目录文件名为单一事实源，脚本不硬编码；
          # hasMutations（#217）：由同一清单推导的显式布尔，供下游 if 精确比较
          combos_for() {
            local pkg="$1" seg_name out= first=1 conf
            # 无任何 stryker 配置的包（如纯宿主 skill 包 dsh-verify-isolated）不进
            # 变异切片：既无段配置也无包级 <pkg>.json 时返回空（#306 防假红）
            if [ ! -f "stryker.conf.d/$pkg.json" ] && ! ls stryker.conf.d/"$pkg"-*.json >/dev/null 2>&1; then
              return 0
            fi
            # 段式配置：逐个枚举 stryker.conf.d/<pkg>-*.json，seg = 文件名剥
            # <pkg>- 前缀后的后缀（功能名 / 数字名统一；空 = 包级单段 seg=0）
            out='['
            for conf in $(ls stryker.conf.d/"$pkg"-*.json 2>/dev/null | sort); do
              seg_name="$(basename "$conf" .json | sed "s/^${pkg}-//")"
              if [ -z "$seg_name" ]; then continue; fi
              [ $first -eq 1 ] && first=0 || out="$out,"
              out="$out{\"package\":\"$pkg\",\"seg\":\"$seg_name\"}"
            done
            if [ "$first" -eq 1 ]; then
              echo "[{\"package\":\"$pkg\",\"seg\":\"0\"}]"
            else
              echo "$out]"
            fi
          }
          emit_outputs() {
            # mutationPackages：剔除聚合包 + 无 stryker 配置的包（纯宿主 skill 包如
            # dsh-verify-isolated 无变异配置，进 mutation 切片会让 verdict 假红）
            MUTS="$(printf '%s' "$1" | python3 -c 'import json,sys,os,glob; pkgs=json.load(sys.stdin); keep=lambda p: p!="dsh-plugins-all" and (os.path.exists(f"stryker.conf.d/{p}.json") or glob.glob(f"stryker.conf.d/{p}-*.json")); print(json.dumps([p for p in pkgs if keep(p)]))')"
            COMBOS="$(printf '%s' "$MUTS" | jq -r '.[]' | while read -r p; do combos_for "$p"; done | jq -sc 'add // []')"
            echo "hitPackages=$1" >> "$GITHUB_OUTPUT"
            echo "allPackages=$ALL_PACKAGES" >> "$GITHUB_OUTPUT"
            echo "mutationPackages=$MUTS" >> "$GITHUB_OUTPUT"
            echo "mutationCombos=$COMBOS" >> "$GITHUB_OUTPUT"
            echo "hasMutations=$(printf '%s' "$MUTS" | jq -c 'length > 0')" >> "$GITHUB_OUTPUT"
          }
          # fail-closed 双闸：diff 基准不可用 或 filter 步骤失败 → 一律全量切片
          if [ -z "$BASE_SET" ] || [ "$FILTER_OUTCOME" = "failure" ]; then
            echo '::notice::fallback 全量切片（fail-closed）'
            emit_outputs "$ALL_PACKAGES"
            exit 0
          fi
          if [ "$GLOBAL_HIT" = "true" ]; then
            echo '::notice::全局路径命中 → 全量切片'
            emit_outputs "$ALL_PACKAGES"
            exit 0
          fi
          HITS='['
          FIRST=1
          for pkg in dsh-notifier dsh-idle-archive dsh-web-file-preview dsh-mcp-manager dsh-provider-usage dsh-lan-proxy dsh-verify-isolated dsh-plugins-all; do
            case "$pkg" in
              dsh-notifier)          V='${{ steps.filter.outputs.dsh-notifier }}' ;;
              dsh-idle-archive)      V='${{ steps.filter.outputs.dsh-idle-archive }}' ;;
              dsh-web-file-preview)  V='${{ steps.filter.outputs.dsh-web-file-preview }}' ;;
              dsh-mcp-manager)       V='${{ steps.filter.outputs.dsh-mcp-manager }}' ;;
              dsh-provider-usage)    V='${{ steps.filter.outputs.dsh-provider-usage }}' ;;
              dsh-lan-proxy)         V='${{ steps.filter.outputs.dsh-lan-proxy }}' ;;
              dsh-verify-isolated)   V='${{ steps.filter.outputs.dsh-verify-isolated }}' ;;
              dsh-plugins-all)       V='${{ steps.filter.outputs.dsh-plugins-all }}' ;;
              *)                     V='false' ;;
            esac
            if [ "$V" = "true" ]; then
              if [ $FIRST -eq 1 ]; then FIRST=0; else HITS="$HITS,"; fi
              HITS="$HITS\"$pkg\""
            fi
          done
          HITS="$HITS]"
          emit_outputs "$HITS"
          echo "命中包（跑 smoke/typecheck 切片）: $HITS"

  # ── 第 2 段：全包并行 build + lib artifact；smoke/typecheck 只对命中包切片 ──
  # 设计说明（#85 评审 F1/F3 修订）：repo-gate 的全局门禁（contract/pack:check/
  # verify:npmlayout/aggregate:check）断言**全部**插件包的 lib 产物，因此 build 与
  # artifact 上传必须无条件覆盖全集；切片只作用于测试与类型检查，避免单包 PR
  # 场景下未命中包缺产物而必红。
  build-test:
    name: Build / Test / Typecheck (${{ matrix.package }})
    needs: changes
    if: always() && needs.changes.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        package:
          - dsh-notifier
          - dsh-idle-archive
          - dsh-web-file-preview
          - dsh-mcp-manager
          - dsh-provider-usage
          - dsh-lan-proxy
          - dsh-subagent-model-inherit
          - dsh-codegraph
          - dsh-verify-isolated
          - dsh-plugins-all
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        # 版本以根 package.json 的 packageManager 字段为单一事实源（勿同时指定 version）

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build package：名称选择器 + ... 后缀按 workspace 拓扑先构建依赖（如
      # dsh-codegraph 依赖 dsh-mcp-manager 的 lib 类型；目录选择器 + ... 在 pnpm 11
      # 不展开依赖，评审实测须用 @scope/name... 形态）。无条件：repo-gate 全局门禁
      # 依赖全量 lib 产物。
      - name: Build package（无条件：repo-gate 全局门禁依赖全量 lib 产物）
        run: pnpm --filter "@wingsky-1/${{ matrix.package }}"... build

      - name: Smoke tests（仅命中包；聚合包无 test 脚本由 --if-present 跳过）
        if: contains(fromJSON(needs.changes.outputs.hitPackages), matrix.package)
        run: pnpm --filter ./packages/${{ matrix.package }} --if-present test

      - name: Typecheck（仅命中包；聚合包无 typecheck 脚本由 --if-present 跳过）
        if: contains(fromJSON(needs.changes.outputs.hitPackages), matrix.package)
        run: pnpm --filter ./packages/${{ matrix.package }} --if-present typecheck

      - name: Upload package outputs artifact（供 repo-gate 全局门禁复用，F9）
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-${{ matrix.package }}
          # 构建产物全集（.gitignore 同款四类）；多路径最短公共祖先 = 包根，
          # zip 内容即 lib/ shared/ types/ LICENSE 本身
          path: |
            packages/${{ matrix.package }}/lib
            packages/${{ matrix.package }}/shared
            packages/${{ matrix.package }}/types
            packages/${{ matrix.package }}/LICENSE
          retention-days: 1
          if-no-files-found: error

  # ── 第 3 段之一：全局单次覆盖采集（#217 变异/覆盖解耦）──
  # cov 从变异矩阵剥离为全局单进程采集：此前矩阵 6 实例并行各自跑 c8 全仓
  # smoke，lan-proxy 固定端口 EADDRINUSE 与 provider-usage K12 时序漂移是 flake
  # 根因；单次采集根治端口竞争，self-coverage.json 经 artifact 下发给 verdict。
  #
  # 拓扑（复核裁决采纳并行选项 b）：本 job 与 mutation-gate 矩阵平行
  # （wall-clock = max(install+build+cov, install+build+stryker)，严格优于串行）。
  # fail-closed 链路（GHA needs 默认语义，勿「优化」掉）：coverage 失败/skip →
  # mutation-verdict（if 显式要求本 job success）连带 skipped → repo-gate 判定表
  # 对 hasMutations=true 的 PR 以 GATE_COVERAGE 维度优先点名「coverage 失败连坐」
  # 整体判红。变异矩阵不受本 job 影响、独立跑完（报告照常产出），但整体仍红——
  # 不存在「cov 挂了而门禁绿」的半通状态。coverage job 失败 ≈ smoke 失败（同一
  # c8 包裹），属 build-test 同级硬信号，观察期语义不豁免本 job。
  coverage:
    name: Coverage collection (global single-run)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.hasMutations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        # 版本以根 package.json 的 packageManager 字段为单一事实源（勿同时指定 version）

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 必须全量构建：selfWritten.functions.pct 是全仓 self-written 函数口径，
      # 任一包 lib/index.js 缺失既会让 c8 smoke 报 ERR_MODULE_NOT_FOUND，也让
      # 覆盖率分母与夜间 observe 口径漂移（run #32790425132 教训）
      - name: Build all packages（覆盖率口径为全仓分母，依赖全集 lib 产物）
        run: pnpm build

      # Mutate 面守卫已随 #276 方案 A 退役：src 级 mutate 用文件 glob 声明
      # （stryker.conf.d/<pkg>[-<n>].json 的 mutate = 源文件名清单），无产物
      # 行号、永不漂移，原 sync-mutate-segments / mutate-scope-guard 整套机制
      # 随之删除（见 #276 阶段 3 退役清点）。

      - name: Coverage collection（c8 包裹全仓 smoke，全局单进程无端口竞争）
        run: pnpm cov

      - name: Self-written coverage report（落盘 coverage/self-coverage.json）
        run: node scripts/gate/self-cov.mjs

      - name: Upload self-coverage artifact（供 mutation-verdict 聚合判分）
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # 精确 name：下游 download 用同名精确取（pattern 匹配 0 个不报错，精确名缺失才报错）
          name: self-coverage
          path: coverage/self-coverage.json
          retention-days: 1
          if-no-files-found: error

  # ── 第 3 段之二：增量变异矩阵（#178 v2 切片 + #187 触发面收敛 + #217 解耦）──
  # - 仅对变异切片实例化（动态 matrix ← changes.mutationPackages）；hasMutations
  #   为 'false' 时 if 直接为假、矩阵不实例化（job result = skipped，零实例
  #   动态矩阵实测报 failure 的怪癖形态由此消除）
  # - 仅限 pull_request 触发（#187）：主干变异覆盖归 observe.yml 夜间全量、发版
  #   归 release.yml tag 管线；非 PR 事件下整体 skipped，由 repo-gate 判定脚本
  #   按事件语义显式放行
  # - #217 解耦：本 job 只做基线 restore + stryker run + 报告上传，不再各自跑
  #   pnpm cov / self-cov / 判分——双指标判分统一收敛到 mutation-verdict；
  #   与 coverage job 平行无依赖（复核裁决选项 b），cov 失败不影响本矩阵跑完，
  #   由 verdict 缺席 + repo-gate 判定表兜底整体红
  # - 基线来源（#204）：读仓库内 scripts/gate/baseline/ 版本化文件（git 跨 ref
  #   天然可见）；首夜/基线缺失时天然降级为全量变异，门禁语义不变仅变慢
  # 已知约束：GitHub Actions 的 matrix 不允许引用 env context，但可引用 needs outputs
  mutation-gate:
    name: Mutation gate (${{ matrix.combo.package }} · ${{ matrix.combo.seg }})
    needs: changes
    # 与 coverage job 平行（无 needs 依赖）；if 精确锁定事件面与显式布尔切片，
    # 空 slice 时 if 直接为假、矩阵不实例化（job result = skipped）
    if: github.event_name == 'pull_request' && needs.changes.outputs.hasMutations == 'true'
    strategy:
      fail-fast: false
      # #220 B 方案：combo = {package, seg}；改造后 seg=功能段名（数字段名亦兼容），
      # 多段包逐段并行实例化，未拆分包单实例（seg="0" 走包级配置 <pkg>.json）
      matrix:
        combo: ${{ fromJSON(needs.changes.outputs.mutationCombos) }}
    runs-on: ubuntu-latest
    # cov 已剥离：最坏情形 = 基线缺失降级全量变异（lan-proxy 全量实测 7m36s）
    # + install + 全量 build，30 分钟余量充足（原 45 分钟悬崖余量为 cov 所设）
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        # 版本以根 package.json 的 packageManager 字段为单一事实源（勿同时指定 version）

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 必须全量构建（run #32790425132 教训）：mutate 区间的行号锚定 esbuild
      # 产物分段注释，产物结构依赖 workspace 内联链（shared/ 与依赖包副本）的
      # 全集一致性；单包构建曾因跨包 lib 缺失直接 ERR_MODULE_NOT_FOUND。
      # 注意：cov 移入全局 coverage job 后，本步骤与覆盖率口径无关
      - name: Build all packages（变异对象 lib 分段依赖全集一致的构建链）
        run: pnpm build

      - name: Resolve combo paths（#220 + #342 二期：seg="0" 包级配置；seg=功能段名/数字段名）
        env:
          MATRIX_PKG: ${{ matrix.combo.package }}
          SEG: ${{ matrix.combo.seg }}
        run: |
          set -e
          PKG="${MATRIX_PKG#dsh-}"
          if [ "$SEG" = "0" ]; then
            echo "CONF=stryker.conf.d/${MATRIX_PKG}.json" >> "$GITHUB_ENV"
            echo "REPORT=${MATRIX_PKG}" >> "$GITHUB_ENV"
            echo "BASENAME=incremental-${PKG}" >> "$GITHUB_ENV"
          else
            echo "CONF=stryker.conf.d/${MATRIX_PKG}-${SEG}.json" >> "$GITHUB_ENV"
            echo "REPORT=${MATRIX_PKG}-${SEG}" >> "$GITHUB_ENV"
            echo "BASENAME=incremental-${PKG}-${SEG}" >> "$GITHUB_ENV"
          fi

      - name: Restore repo incremental baseline（#204：读仓库内基线文件，替代失效的 actions/cache）
        # #204 方案 A：夜间 observe 把全部 incremental 基线提交进 scripts/gate/baseline/，
        # PR checkout（merge commit 含 base/main 内容）直接读文件复制到
        # coverage/mutation/ —— git 跨 ref 天然可见，替代失效的 actions/cache
        # 跨 ref 通道（#204 实证：actions/cache 按 ref 隔离，PR 永远 miss main 缓存）。
        # 基线文件名随 combo 段号：incremental-<pkg>.json / incremental-<pkg>-<seg>.json。
        # 首夜/基线缺失时天然降级为全量变异（notice 标注属预期，非缺陷）。
        id: baseline
        run: |
          set -e
          SRC="scripts/gate/baseline/${BASENAME}.json"
          if [ -f "$SRC" ]; then
            mkdir -p coverage/mutation
            cp "$SRC" "coverage/mutation/${BASENAME}.json"
            echo "incremental 基线命中：$SRC（仓库内文件）"
          else
            echo '::notice::incremental 基线文件缺失 —— 本次降级为全量变异（首夜无基线属预期，非缺陷）'
          fi

      - name: Incremental mutation（incremental 生效跳过未变 mutant）
        run: npx stryker run "${CONF}"

      - name: Upload stryker report artifact（报告交 mutation-verdict 统一判分）
        # if: always()：实例非零退出（如内建阈值不足/崩溃）时已产出的报告照常
        # 下发聚合判分；未产出报告时 if-no-files-found: error 让实例自身红
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-report-${{ matrix.combo.package }}-${{ matrix.combo.seg }}
          path: coverage/mutation/${{ env.REPORT }}.json
          retention-days: 1
          if-no-files-found: error

  # ── 第 3 段之三：聚合判分收尾（artifact 汇合 + 逐包双指标判分，#217）──
  # - self-coverage（coverage job）与各包 stryker 报告（mutation-gate 矩阵）
  #   在此汇合后逐包跑 scripts/gate/mutation-gate.mjs 双指标判分；
  # - if 用 always() 组合：矩阵 failure（实例级 stryker 非零退出）时仍运行
  #   聚合判分——已产出报告的包照常计账、缺报告的包由脚本 exit 2 fail-closed；
  #   coverage 非 success（失败/skip，本 job 是 fail-closed 链路的收敛点）或
  #   矩阵 skipped（空切片）时连带 skipped，交 repo-gate 判定表按维度裁决；
  # - 判分链为纯 Node 内置模块（gauntlet config + mutation-report-lib），
  #   无需 pnpm install。
  mutation-verdict:
    name: Mutation gate verdict (aggregate)
    needs: [changes, coverage, mutation-gate]
    if: always() && needs.coverage.result == 'success' && needs.mutation-gate.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          # 本 job 判分链为纯 Node 内置模块、不 pnpm install（见 job 头注释），必须
          # 显式关闭 setup-node v5 默认的 package-manager-cache：其探测到仓库根
          # pnpm-lock.yaml 会调用 PATH 中的 pnpm 计算缓存 key，而本 job 是全
          # workflow 唯一不前置 pnpm/action-setup 的 job，runner 镜像又不自带
          # pnpm → Setup Node.js 直接红（实证 run 32879414842 / 32876671584，
          # "Unable to locate executable file: pnpm"，repo-gate F2 随之连坐红）
          package-manager-cache: false

      - name: Download self-coverage artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: self-coverage
          # 单文件上传的 zip 根层级 = 文件本身：解压到 coverage/ 即还原出
          # coverage/self-coverage.json 原始路径（判分脚本按此固定路径读取）
          path: coverage

      - name: Download mutation report artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mutation-report-*
          path: coverage/mutation

      - name: Restore report layout（多 artifact 下载各建子目录，平铺回 coverage/mutation/）
        # #220 B 方案：缺失检查按 combo 粒度 —— 拆分包每段报告都必须下发
        # （段实例 if-no-files-found: error 已兜底，此处双保险 fail-closed）
        env:
          COMBOS: ${{ needs.changes.outputs.mutationCombos }}
        run: |
          set -e
          test -f coverage/self-coverage.json || { echo '::error::self-coverage artifact 未下发 —— fail-closed'; exit 1; }
          DIRS="$(ls -d coverage/mutation/mutation-report-* 2>/dev/null || true)"
          [ -n "$DIRS" ] || { echo '::error::变异报告 artifact 未下发（pattern 匹配 0 个）—— fail-closed'; exit 1; }
          for dir in $DIRS; do
            cp "$dir"/*.json coverage/mutation/
          done
          MISSING=0
          mapfile -t ROWS < <(printf '%s' "$COMBOS" | jq -r '.[] | "\(.package) \(.seg)"')
          for row in "${ROWS[@]}"; do
            pkg="${row% *}"; seg="${row#* }"
            if [ "$seg" = "0" ]; then f="coverage/mutation/${pkg}.json"; else f="coverage/mutation/${pkg}-${seg}.json"; fi
            [ -f "$f" ] || { echo "::error::${f} 报告 artifact 未下发 —— fail-closed"; MISSING=1; }
          done
          [ "$MISSING" -eq 0 ] || exit 1
          echo 'artifact 层级还原完成：coverage/self-coverage.json + coverage/mutation/<pkg>[-<seg>].json'

      - name: Mutation gate verdict（逐包双指标判分：覆盖率恒硬 + 变异率受 strict 开关）
        # 记账模式：任一包判分失败继续跑完其余包，结尾统一判红（与夜间逐包容错纪律一致）
        env:
          SLICE: ${{ needs.changes.outputs.mutationPackages }}
        run: |
          set -e
          FAILED=0
          for pkg in $(printf '%s' "$SLICE" | jq -r '.[]'); do
            echo "::group::mutation verdict $pkg"
            if node scripts/gate/mutation-gate.mjs "$pkg"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              FAILED=1
            fi
          done
          [ "$FAILED" -eq 0 ] || { echo '::error::存在未通过双指标判分的切片包 —— fail-closed'; exit 1; }

  # ── 第 4 段：聚合闸（job 名保持分支保护 required check 名不变，无缝切换）──
  # needs 连坐语义（#217）：coverage / mutation-gate / mutation-verdict 任一失败
  # 都必须让本闸红——判定表按「事件 × 切片(hasMutations) × coverage × 变异矩阵
  # × verdict」五维裁决；coverage 失败 → verdict 连坐 skipped → 判定表以
  # GATE_COVERAGE 维度优先点名「coverage 失败连坐」，而非误报「mutation 绕过」
  repo-gate:
    name: Build / Contract / Smoke / Pack
    needs: [changes, build-test, coverage, mutation-gate, mutation-verdict]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0   # 阈值单调性校验需读 origin/main 的 config（F3）

      - name: Fail-closed gate assertion（F2：任何上游非 success 即红）
        # #187：判定逻辑收敛到 scripts/gate/repo-gate-assert.mjs（可被单元测试
        # 全组合锁死），env 注入避免内联 bash 漂移。#217 扩展为五维判定：
        # 事件 × 切片(hasMutations) × coverage × 变异矩阵 × verdict。
        # 必须排在 Checkout 之后（run #32800733630 教训：脚本版需要工作区文件，
        # 旧内联 bash 无文件依赖掩盖了这一时序约束）；仅依赖 Node 内置模块，
        # 无需等 pnpm/setup-node，紧随 checkout 尽早判红
        env:
          GATE_EVENT: ${{ github.event_name }}
          GATE_CHANGES: ${{ needs.changes.result }}
          GATE_BUILD_TEST: ${{ needs.build-test.result }}
          GATE_COVERAGE: ${{ needs.coverage.result }}
          GATE_MUTATION: ${{ needs.mutation-gate.result }}
          GATE_VERDICT: ${{ needs.mutation-verdict.result }}
          GATE_HAS_MUTATIONS: ${{ needs.changes.outputs.hasMutations }}
          GATE_MUTATION_PKGS: ${{ needs.changes.outputs.mutationPackages }}
        run: node scripts/gate/repo-gate-assert.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        # 版本以根 package.json 的 packageManager 字段为单一事实源（勿同时指定 version）

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download package outputs artifacts（F9：复用 matrix 全集产物，避免重复构建）
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: pkg-*
          path: artifacts-tmp

      - name: Restore package outputs into package trees
        run: |
          set -e
          # 多路径上传的 zip 根 = 包根：artifact 内容即 lib/ shared/ types/ LICENSE 本身
          for dir in artifacts-tmp/pkg-*; do
            pkg="${dir#artifacts-tmp/pkg-}"
            mkdir -p "packages/$pkg"
            cp -r "$dir/." "packages/$pkg/"
          done
          # 断言全部包产物齐备（缺任何一个即红——全局门禁的前提）。
          # 清单从 needs.changes.outputs.allPackages（plugins-manifest.json 派生）驱动，
          # 新增 active 包自动纳入；空清单 fail-closed（fail-closed gate assertion 已兜底，
          # 此处显式防空防「零断言假绿」）。
          ALL="$(printf '%s' "$ALL_PACKAGES" | jq -c '.')"
          if [ "$(printf '%s' "$ALL" | jq 'length')" -eq 0 ]; then
            echo '::error::allPackages 为空（fail-closed，禁止零断言通过）'
            exit 1
          fi
          for pkg in $(printf '%s' "$ALL" | jq -r '.[]'); do
            test -f "packages/$pkg/lib/index.js" || { echo "::error::$pkg/lib/index.js 缺失"; exit 1; }
          done
          echo "全部包构建产物就位（$ALL）"
        env:
          ALL_PACKAGES: ${{ needs.changes.outputs.allPackages }}

      - name: Client contract（客户端契约）
        run: pnpm contract

      - name: Threshold monotonicity（F3：阈值只许升不许降，PR 场景生效）
        if: github.event_name == 'pull_request'
        run: node scripts/gate/threshold-monotonic.mjs origin/main

      - name: Pack check（防发布断链）
        run: pnpm pack:check

      - name: Npm layout（解包后可加载）
        run: pnpm verify:npmlayout

      - name: Aggregate check（聚合 patch 不漂移）
        run: pnpm aggregate:check

      - name: Scripts self-test（维护脚本自测，含 workflow 结构静态断言）
        run: pnpm test:scripts

      - name: Docs check（README/链接/占位符）
        run: pnpm docs:check
