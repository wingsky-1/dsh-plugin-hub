name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── 第 1 段：路径预筛（声明式 filter；失败一律 fallback 全量 = fail-closed）──
  changes:
    name: Detect changed packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # 命中"需跑 smoke/typecheck 切片"的包清单（json 数组，可为 []）
      hitPackages: ${{ steps.pkgs.outputs.hitPackages }}
      # 增量变异切片清单（#178）：hitPackages 剔除聚合包 dsh-plugins-all（无变异配置）
      mutationPackages: ${{ steps.pkgs.outputs.mutationPackages }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # F4：push 事件 diff 基准是 github.event.before（SHA），需完整历史保证可达；
          # PR 事件以 origin/main 为三点比基准同样依赖本地对象完整性
          fetch-depth: 0

      - name: Resolve diff base
        id: base
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && echo "${{ github.event.before }}" | grep -qv '^0*$'; then
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            # 全零 SHA（force push / 新分支首推）：base 置空 → 下方按全量处理
            echo "base=" >> "$GITHUB_OUTPUT"
            echo '::notice::push 事件 before 不可用 —— 按全量处理（fail-closed）'
          fi

      - name: Paths filter
        id: filter
        if: steps.base.outputs.base != ''
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          base: ${{ steps.base.outputs.base }}
          filters: |
            global:
              - 'shared/**'
              - 'scripts/**'
              - 'agents/**'
              - '.github/**'
              - 'docs/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - 'AGENTS.md'
            dsh-notifier:
              - 'packages/dsh-notifier/**'
            dsh-idle-archive:
              - 'packages/dsh-idle-archive/**'
            dsh-web-file-preview:
              - 'packages/dsh-web-file-preview/**'
            dsh-mcp-manager:
              - 'packages/dsh-mcp-manager/**'
            dsh-provider-usage:
              - 'packages/dsh-provider-usage/**'
            dsh-lan-proxy:
              - 'packages/dsh-lan-proxy/**'
            dsh-plugins-all:
              - 'packages/dsh-plugins-all/**'

      - name: Compute hit packages
        id: pkgs
        env:
          GLOBAL_HIT: ${{ steps.filter.outputs.global }}
          FILTER_OUTCOME: ${{ steps.filter.outcome }}
          BASE_SET: ${{ steps.base.outputs.base }}
        run: |
          set -e
          # mutationPackages：hitPackages 剔除聚合包后的增量变异切片（#178）
          emit_outputs() {
            echo "hitPackages=$1" >> "$GITHUB_OUTPUT"
            echo "mutationPackages=$(printf '%s' "$1" | jq -c '[.[] | select(. != "dsh-plugins-all")]')" >> "$GITHUB_OUTPUT"
          }
          # fail-closed 双闸：diff 基准不可用 或 filter 步骤失败 → 一律全量切片
          if [ -z "$BASE_SET" ] || [ "$FILTER_OUTCOME" = "failure" ]; then
            echo '::notice::fallback 全量切片（fail-closed）'
            emit_outputs '["dsh-notifier","dsh-idle-archive","dsh-web-file-preview","dsh-mcp-manager","dsh-provider-usage","dsh-lan-proxy","dsh-plugins-all"]'
            exit 0
          fi
          if [ "$GLOBAL_HIT" = "true" ]; then
            echo '::notice::全局路径命中 → 全量切片'
            emit_outputs '["dsh-notifier","dsh-idle-archive","dsh-web-file-preview","dsh-mcp-manager","dsh-provider-usage","dsh-lan-proxy","dsh-plugins-all"]'
            exit 0
          fi
          HITS='['
          FIRST=1
          for pkg in dsh-notifier dsh-idle-archive dsh-web-file-preview dsh-mcp-manager dsh-provider-usage dsh-lan-proxy dsh-plugins-all; do
            case "$pkg" in
              dsh-notifier)          V='${{ steps.filter.outputs.dsh-notifier }}' ;;
              dsh-idle-archive)      V='${{ steps.filter.outputs.dsh-idle-archive }}' ;;
              dsh-web-file-preview)  V='${{ steps.filter.outputs.dsh-web-file-preview }}' ;;
              dsh-mcp-manager)       V='${{ steps.filter.outputs.dsh-mcp-manager }}' ;;
              dsh-provider-usage)    V='${{ steps.filter.outputs.dsh-provider-usage }}' ;;
              dsh-lan-proxy)         V='${{ steps.filter.outputs.dsh-lan-proxy }}' ;;
              dsh-plugins-all)       V='${{ steps.filter.outputs.dsh-plugins-all }}' ;;
              *)                     V='false' ;;
            esac
            if [ "$V" = "true" ]; then
              if [ $FIRST -eq 1 ]; then FIRST=0; else HITS="$HITS,"; fi
              HITS="$HITS\"$pkg\""
            fi
          done
          HITS="$HITS]"
          emit_outputs "$HITS"
          echo "命中包（跑 smoke/typecheck 切片）: $HITS"

  # ── 第 2 段：全包并行 build + lib artifact；smoke/typecheck 只对命中包切片 ──
  # 设计说明（#85 评审 F1/F3 修订）：repo-gate 的全局门禁（contract/pack:check/
  # verify:npmlayout/aggregate:check）断言**全部**插件包的 lib 产物，因此 build 与
  # artifact 上传必须无条件覆盖全集；切片只作用于测试与类型检查，避免单包 PR
  # 场景下未命中包缺产物而必红。
  build-test:
    name: Build / Test / Typecheck (${{ matrix.package }})
    needs: changes
    if: always() && needs.changes.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        package:
          - dsh-notifier
          - dsh-idle-archive
          - dsh-web-file-preview
          - dsh-mcp-manager
          - dsh-provider-usage
          - dsh-lan-proxy
          - dsh-plugins-all
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        # 版本以根 package.json 的 packageManager 字段为单一事实源（勿同时指定 version）

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package（无条件：repo-gate 全局门禁依赖全量 lib 产物）
        run: pnpm --filter ./packages/${{ matrix.package }} build

      - name: Smoke tests（仅命中包；聚合包无 test 脚本由 --if-present 跳过）
        if: contains(fromJSON(needs.changes.outputs.hitPackages), matrix.package)
        run: pnpm --filter ./packages/${{ matrix.package }} --if-present test

      - name: Typecheck（仅命中包；聚合包无 typecheck 脚本由 --if-present 跳过）
        if: contains(fromJSON(needs.changes.outputs.hitPackages), matrix.package)
        run: pnpm --filter ./packages/${{ matrix.package }} --if-present typecheck

      - name: Upload package outputs artifact（供 repo-gate 全局门禁复用，F9）
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-${{ matrix.package }}
          # 构建产物全集（.gitignore 同款四类）；多路径最短公共祖先 = 包根，
          # zip 内容即 lib/ shared/ types/ LICENSE 本身
          path: |
            packages/${{ matrix.package }}/lib
            packages/${{ matrix.package }}/shared
            packages/${{ matrix.package }}/types
            packages/${{ matrix.package }}/LICENSE
          retention-days: 1
          if-no-files-found: error

  # ── 第 3 段：增量变异门禁（#178 v2 切片 + #187 触发面收敛至 pull_request）──
  # - 仅对命中包实例化（动态 matrix ← changes.mutationPackages；空清单时整体 skipped）
  # - 仅限 pull_request 触发（#187）：main push 场景 before 基线不可用时 paths-filter
  #   走 fail-closed 全量 fallback，变异会退化全量且与 observe.yml 夜间全量完全重复；
  #   主干变异覆盖归夜间、发版归 release.yml tag 管线——全量只在这两处真实执行。
  #   非 PR 事件下整体 skipped，由 repo-gate 判定脚本按事件语义显式放行
  # - 基线来源（#204）：夜间 observe 把六包 incremental 基线提交进
  #   scripts/gate/baseline/（仓库内版本化文件），本 job 直接读文件复制到
  #   coverage/mutation/ —— git 跨 ref 天然可见，替代失效的 actions/cache
  #   跨 ref 通道（#204 实证：actions/cache 按 ref 隔离，PR 永远 miss main 缓存）。
  #   首夜/基线缺失时天然降级为全量变异，门禁语义不变仅变慢
  # - 双指标判分（scripts/gate/mutation-gate.mjs）：测试覆盖率（self-written 函数，
  #   恒硬）+ 变异测试率（covered ≥ threshold，受 mutation.strict 开关约束）
  # - 成败并入 repo-gate 聚合闸，不新增分支保护 required check 名
  # 已知约束：GitHub Actions 的 matrix 不允许引用 env context，但可引用 needs outputs
  mutation-gate:
    name: Mutation gate (${{ matrix.package }})
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.mutationPackages) }}
    runs-on: ubuntu-latest
    # 45 分钟悬崖余量：缓存 miss 首夜 = 天然降级全量变异（lan-proxy 全量实测 7m36s，
    # 再叠加 install + 全量 build + cov 全仓 smoke），30 分钟存在被误杀风险
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        # 版本以根 package.json 的 packageManager 字段为单一事实源（勿同时指定 version）

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 必须全量构建（run #32790425132 教训）：后续 pnpm cov = c8 包裹全仓 smoke，
      # 任一包 lib/index.js 缺失即 ERR_MODULE_NOT_FOUND；且 selfWritten.functions.pct
      # 为全仓口径，单包 cov 会让覆盖率分母与夜间口径漂移
      - name: Build all packages（变异对象与覆盖率口径均依赖全集 lib 产物）
        run: pnpm build

      - name: Restore repo incremental baseline（#204：读仓库内基线文件，替代失效的 actions/cache）
        # #204 方案 A：夜间 observe 把六包 incremental 基线提交进 scripts/gate/baseline/，
        # PR checkout（merge commit 含 base/main 内容）直接读文件——git 无 ref 隔离，
        # 不依赖 actions/cache 的平台缓存跨 ref 可见性（#204 实证 PR 永远 miss）。
        # 矩阵包名 dsh-<pkg> → 基线文件名 incremental-<pkg>.json。
        id: baseline
        run: |
          set -e
          PKG="${MATRIX_PKG#dsh-}"
          SRC="scripts/gate/baseline/incremental-${PKG}.json"
          if [ -f "$SRC" ]; then
            mkdir -p coverage/mutation
            cp "$SRC" "coverage/mutation/incremental-${PKG}.json"
            echo "incremental 基线命中：$SRC（仓库内文件）"
          else
            echo '::notice::incremental 基线文件缺失 —— 本次降级为全量变异（首夜无基线属预期，非缺陷）'
          fi
        env:
          MATRIX_PKG: ${{ matrix.package }}

      - name: Incremental mutation（incremental 生效跳过未变 mutant）
        run: npx stryker run stryker.conf.d/${{ matrix.package }}.json

      - name: Coverage collection（self-written 口径数据源：c8 包裹全仓 smoke）
        run: pnpm cov

      - name: Self-written coverage report（落盘 coverage/self-coverage.json）
        run: node scripts/gate/self-cov.mjs

      - name: Mutation gate verdict（双指标判分：覆盖率恒硬 + 变异率受 strict 开关）
        run: node scripts/gate/mutation-gate.mjs ${{ matrix.package }}

  # ── 第 4 段：聚合闸（job 名保持分支保护 required check 名不变，无缝切换）──
  repo-gate:
    name: Build / Contract / Smoke / Pack
    needs: [changes, build-test, mutation-gate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0   # 阈值单调性校验需读 origin/main 的 config（F3）

      - name: Fail-closed gate assertion（F2：任何上游非 success 即红）
        # #187：判定逻辑收敛到 scripts/gate/repo-gate-assert.mjs（事件 × 切片清单
        # × job 结果三维判定表，可被单元测试全组合锁死），env 注入避免内联 bash 漂移。
        # 必须排在 Checkout 之后（run #32800733630 教训：脚本版需要工作区文件，
        # 旧内联 bash 无文件依赖掩盖了这一时序约束）；仅依赖 Node 内置模块，
        # 无需等 pnpm/setup-node，紧随 checkout 尽早判红
        env:
          GATE_EVENT: ${{ github.event_name }}
          GATE_CHANGES: ${{ needs.changes.result }}
          GATE_BUILD_TEST: ${{ needs.build-test.result }}
          GATE_MUTATION: ${{ needs.mutation-gate.result }}
          GATE_MUTATION_PKGS: ${{ needs.changes.outputs.mutationPackages }}
        run: node scripts/gate/repo-gate-assert.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        # 版本以根 package.json 的 packageManager 字段为单一事实源（勿同时指定 version）

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download package outputs artifacts（F9：复用 matrix 全集产物，避免重复构建）
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: pkg-*
          path: artifacts-tmp

      - name: Restore package outputs into package trees
        run: |
          set -e
          # 多路径上传的 zip 根 = 包根：artifact 内容即 lib/ shared/ types/ LICENSE 本身
          for dir in artifacts-tmp/pkg-*; do
            pkg="${dir#artifacts-tmp/pkg-}"
            mkdir -p "packages/$pkg"
            cp -r "$dir/." "packages/$pkg/"
          done
          # 断言七个包产物齐备（缺任何一个即红——全局门禁的前提）
          for pkg in dsh-notifier dsh-idle-archive dsh-web-file-preview dsh-mcp-manager dsh-provider-usage dsh-lan-proxy dsh-plugins-all; do
            test -f "packages/$pkg/lib/index.js" || { echo "::error::$pkg/lib/index.js 缺失"; exit 1; }
          done
          echo '七包构建产物就位'

      - name: Client contract（客户端契约）
        run: pnpm contract

      - name: Threshold monotonicity（F3：阈值只许升不许降，PR 场景生效）
        if: github.event_name == 'pull_request'
        run: node scripts/gate/threshold-monotonic.mjs origin/main

      - name: Pack check（防发布断链）
        run: pnpm pack:check

      - name: Npm layout（解包后可加载）
        run: pnpm verify:npmlayout

      - name: Aggregate check（聚合 patch 不漂移）
        run: pnpm aggregate:check

      - name: Scripts self-test（维护脚本自测，含 workflow 结构静态断言）
        run: pnpm test:scripts

      - name: Docs check（README/链接/占位符）
        run: pnpm docs:check
