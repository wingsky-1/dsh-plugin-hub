name: CI

on:
  pull_request:
    # #722 门禁分层：labeled/unlabeled 必须显式列入——否则给 PR 打 gate:full 标签
    # 不会触发重跑，全量门禁实际不可达（默认 types 只有 opened/synchronize/reopened）。
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── 第 1 段：路径预筛（声明式 filter；失败一律 fallback 全量 = fail-closed）──
  changes:
    name: Detect changed packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # 命中"需跑 smoke/typecheck 切片"的包清单（json 数组，可为 []）
      hitPackages: ${{ steps.pkgs.outputs.hitPackages }}
      # 增量变异切片清单（#178）：hitPackages 剔除聚合包 dsh-plugins-all（无变异配置）
      mutationPackages: ${{ steps.pkgs.outputs.mutationPackages }}
      # 变异 matrix 组合清单（#220 B 方案）：[{package, seg}] —— 拆分包按
      # stryker.conf.d/<pkg>-<后缀>.json（段名 = 包名之后的全部后缀；本仓已无数字段名）展开为多实例
      # 并行，未拆分包 seg="0" 走包级配置（#342 二期功能命名改造）
      mutationCombos: ${{ steps.pkgs.outputs.mutationCombos }}
      # 切片是否含变异对象包（#217：显式布尔字符串 'true'/'false'）。GHA 表达式
      # 无取长度与管道能力，在 if 里对清单做取长判空或裸数组文本比较均脆弱；
      # 下游 if 一律用 needs.changes.outputs.hasMutations == 'true' 精确比较
      hasMutations: ${{ steps.pkgs.outputs.hasMutations }}
      buildPackages: ${{ steps.pkgs.outputs.buildPackages }}
      # 全量门禁开关（#722 门禁分层）：PR 默认走增量——只跑命中包的构建/测试/产物闸；
      # 打 gate:full 标签再补覆盖率 + 全仓产物闸。策略只在这里计算一处，
      # 下游 job 的 if 与判定脚本共用它，避免「标签语义」散落在多处表达式里。
      # #742 阶段 1.1 起本开关**不再覆盖变异**：PR 上一律按命中切片强制跑变异，
      # mutation-gate / mutation-verdict 的 if 已与它解耦——别把 fullGate 条件加回去。
      fullGate: ${{ steps.fullgate.outputs.fullGate }}
      # 全量包清单（单一事实源，从 plugins-manifest.json active + 聚合包派生）：
      # 供 repo-gate 产物齐备断言等下游消费，空清单 fail-closed
      allPackages: ${{ steps.pkgs.outputs.allPackages }}
    steps:
      - name: Resolve full-gate switch（gate:full 标签 → 全量门禁）
        id: fullgate
        # 非 PR 事件一律 false：主干覆盖与变异归 observe.yml 夜间全量、发版归
        # release.yml tag 管线（#187 触发面收敛不变量），手动点火用 observe.yml
        # 自带的 workflow_dispatch，不在 ci.yml 另开入口。
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -e
          FULL=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if printf '%s' "$LABELS" | grep -q '"gate:full"'; then FULL=true; fi
          fi
          echo "fullGate=$FULL" >> "$GITHUB_OUTPUT"
          echo "::notice::fullGate=$FULL（false = 增量门禁：命中包构建/测试/产物闸 + 廉价全仓静态闸；true = 追加覆盖率 + 全仓产物闸。变异自 #742 阶段 1 起两种形态下都按命中切片强制跑）"

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # F4：push 事件 diff 基准是 github.event.before（SHA），需完整历史保证可达；
          # PR 事件以 origin/main 为三点比基准同样依赖本地对象完整性
          fetch-depth: 0

      - name: Resolve diff base
        id: base
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && echo "${{ github.event.before }}" | grep -qv '^0*$'; then
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            # 全零 SHA（force push / 新分支首推）：base 置空 → 下方按全量处理
            echo "base=" >> "$GITHUB_OUTPUT"
            echo '::notice::push 事件 before 不可用 —— 按全量处理（fail-closed）'
          fi

      - name: Paths filter
        id: filter
        if: steps.base.outputs.base != ''
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          base: ${{ steps.base.outputs.base }}
          filters: |
            global:
              - 'shared/**'
              - 'agents/**'
              - '.github/**'
              # docs/** 与 AGENTS.md 刻意不在 global 面（#220）：纯文档 PR 无需
              # 变异切片与 smoke/typecheck（release-notes 校验仅存在于 tag 触发的
              # release.yml）。注意 #693 起 verify-docs（属 scripts/gate/**）**会**消费
              # AGENTS.md / .dsh/skills / docs 的相对链接与 pnpm 命令引用——但消费方
              # 本体仍在 global 面内（#742 阶段 2.1 把整树 'scripts/**' 收窄为白名单时
              # 已确认 scripts/gate/** 在白名单里），故「改文档不触发、改脚本才触发」
              # 的语义仍然成立，无需把这两个路径加回 global。
              # 改动本约定须同步 workflow-assert 断言。
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              # 根级测试与覆盖率配置：阈值/分母的唯一事实源是
              # scripts/data/coverage.config.json（vitest.config.ts 只 import 它），
              # 测试分层 glob 在 scripts/data/mutation-topology.json——两者都在下方
              # scripts/data 白名单里；vitest.config.ts 必须显式列出：它在根级、不属任何包面。
              - 'vitest.config.ts'
              # #742 阶段 2.3 的归属盘点补入：根 LICENSE 由 scripts/build 的 bundle-host
              # 复制进**每个包**的产物根（pack:check 逐包断言其存在），是全体包的构建输入，
              # 原先不在任何面内 → 改它不触发任何切片。归 global 面。
              - 'LICENSE'
              # ── #742 阶段 2.1：整树 'scripts/**' 收窄为显式白名单 ──
              # 为什么不再整树入面：scripts/** 混装了「门禁/构建/CI 切片本体」（改一行对
              # 所有包生效）与「单一消费者资产」（改一行只影响一个包），整树入面把后者也
              # 放大成 7 包全量构建 + 全量变异矩阵——实测近 14 个已合并 PR 有 14 个命中
              # global 面，等于默认路径全程走最坏形态。
              # 为什么可以放心逐条列举：归属完整性由 scripts/data/ci-face-registry.json
              # 加 scripts/test/ci-face-coverage.test.ts 判红守着——scripts/ 下新增任何
              # 一级子树/根级文件/data 文件而未登记即红，不会静默漏跑。
              - 'scripts/build/**'
              - 'scripts/ci/**'
              - 'scripts/gate/**'
              - 'scripts/lib/**'
              # 全部 6 个带测试的包共用这一份 runner（其余 scripts/test/** 只服务
              # 常驻的 test:scripts 静态闸，见注册表的豁免条目）
              - 'scripts/test/run-vitest.mjs'
              # 8 份全仓口径数据：改任一份都改变所有包的构建/测试/变异判据
              - 'scripts/data/coverage.config.json'
              - 'scripts/data/dir-imports-baseline.json'
              - 'scripts/data/gate-exemptions.json'
              - 'scripts/data/gate-scope-registry.json'
              - 'scripts/data/gauntlet.config.json'
              - 'scripts/data/mutation-segment-ledger.json'
              - 'scripts/data/mutation-topology.json'
              - 'scripts/data/plugins-manifest.json'
            dsh-notifier:
              - 'packages/dsh-notifier/**'
              # #322：stryker 段配置变更须命中本包面（段配置是 mutation 单一事实源，
              # 不映射则配置类 PR 的 mutation 矩阵全 skip、无法自证）。#742 阶段 2.4
              # 起统一为 `<pkg>*.json` 单一形态：包级 <pkg>.json 与段级 <pkg>-<段名>.json
              # 都被它覆盖，再没有「新增段配置漏映射」的第二种写法。
              - 'stryker.conf.d/dsh-notifier*.json'
              # #742 阶段 2.2：段配置之外还有两类包级资产——包级 stryker 测试面配置
              # （vitest.stryker.d/，此前完全不在任何 filters 内）与包级数据资产
              # （scripts/data/dsh-<pkg>-*.json）
              - 'vitest.stryker.d/dsh-notifier.config.ts'
              - 'scripts/data/dsh-notifier-*.json'
              # root test/smoke-lib.ts 被 4 个包的测试 import（名单与其一致性由
              # ci-face-coverage 断言按真实 import 图核对，防第 5 个包静默漏面）
              - 'test/smoke-lib.ts'
            # 本包测试不 import root test/smoke-lib.ts，故不登记该行——
            # ci-face-coverage 按真实 import 图双向核对，多登记一行同样判红。
            dsh-worktree-sidebar:
              - 'packages/dsh-worktree-sidebar/**'
              - 'stryker.conf.d/dsh-worktree-sidebar*.json'
              - 'vitest.stryker.d/dsh-worktree-sidebar.config.ts'
              # #819：包级数据资产（导出面基线与分类登记）与 dsh-notifier 的
              # scripts/data/dsh-notifier-*.json 同型，用同一 glob 形态收进本包面
              - 'scripts/data/dsh-worktree-sidebar-*.json'
            dsh-mcp-manager:
              - 'packages/dsh-mcp-manager/**'
              - 'stryker.conf.d/dsh-mcp-manager*.json'
              - 'vitest.stryker.d/dsh-mcp-manager.config.ts'
              - 'test/smoke-lib.ts'
            dsh-provider-usage:
              - 'packages/dsh-provider-usage/**'
              - 'stryker.conf.d/dsh-provider-usage*.json'
              - 'vitest.stryker.d/dsh-provider-usage.config.ts'
              - 'test/smoke-lib.ts'
            dsh-lan-proxy:
              - 'packages/dsh-lan-proxy/**'
              - 'stryker.conf.d/dsh-lan-proxy*.json'
              - 'vitest.stryker.d/dsh-lan-proxy.config.ts'
              # #742 阶段 2.2 命名归位：原名 lan-proxy-ui-exempt.json 既不带 dsh- 前缀
              # 也不带包名，只能靠人工记忆映射，改名后与本面其余资产同形
              - 'scripts/data/dsh-lan-proxy-*.json'
              - 'test/smoke-lib.ts'
            dsh-verify-isolated:
              - 'packages/dsh-verify-isolated/**'
            dsh-plugins-all:
              - 'packages/dsh-plugins-all/**'

      - name: Detect changed test files（#742 阶段 1.7：static mutant 盲区）
        id: testdiff
        # 为什么另起一步用 git diff，而不是取 paths-filter 的命中文件清单：filters 的事实源
        # 是「包面」，而「哪些文件属于测试面」是 diff 本身的性质、不是面。用 git diff 还能本地
        # 完整复现与单测（同一个 BASE...HEAD 三点口径）。
        # 判据两条来源：packages/<pkg>/test/** 的路径规则，加归属注册表里 invalidatesBaseline
        # 的条目（共享测试库 test/smoke-lib.ts、stryker 段配置、包级 stryker 测试面配置）——
        # 它们同样会改变「哪些测试在杀 mutant」。
        # 基准缺失（push 的 force-push 形态）时跳过：非 PR 事件下变异矩阵本就不实例化，
        # ci-matrix 收到空清单会按 fail-closed 处理（全部失基线，不静默当成「没改测试」）。
        if: steps.base.outputs.base != ''
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: node scripts/ci/changed-test-packages.mjs

      - name: Compute hit packages
        id: pkgs
        env:
          GLOBAL_HIT: ${{ steps.filter.outputs.global }}
          FILTER_OUTCOME: ${{ steps.filter.outcome }}
          BASE_SET: ${{ steps.base.outputs.base }}
          FILTER_OUTPUTS: ${{ toJson(steps.filter.outputs) }}
          TEST_CHANGED_PACKAGES: ${{ steps.testdiff.outputs.testChangedPackages }}
        run: node scripts/ci/ci-matrix.mjs

  # ── 红线路径门禁（#843 M1 / R-1）──
  # 仓规把 `.github/**` 定为红线面；其余红线面由 `scripts/data/threshold-registry.json` 的
  # `guards[].sources` 派生（#851：谁被声明为事实源谁就在面内；改动须维护者在原 issue 内 approved），
  # 但平台层零强制力：`enforce_admins=true` + 只有一位 admin + GitHub 不允许自批自己的 PR，
  # 使「CODEOWNERS + require_code_owner_reviews」会**永久冻结**每一处红线 PR。可行替代是把
  # 条件做成仓内可判定的 status check：PR 触及红线路径且没有 approved 标签就 fail，再由维护者
  # 把它注册成 required check（注册是本 job 生效的前提，属维护者动作）。判据本体是纯函数
  # （scripts/gate/red-line-approval.mjs，带自测），本 job 只负责取输入与转发退出码。
  # fail-closed：changed files 或 labels 取不到一律 exit 2，绝不因「没什么可看」而放行。
  red-line-approval:
    name: Build / Red-line approval
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # #843 P-2 观测面：把本 job 判据步骤的**退出码分类**带出 job。
    # 为什么需要它：repo-gate 的判定表只看得到 `needs.*.result`，而 exit 1（未批准的改动）
    # 与 exit 2（输入不可读 = 门禁故障）在 result 上都是 failure——本轮事故正是把后者读成了
    # 「判决已生效」。job 内部步骤的退出码传不出去，故由判据脚本落状态文件、由紧随其后的
    # 一步读成 job output，再经 GATE_FAILURE_CLASS 显式注入判定表。
    outputs:
      failureClass: ${{ steps.gateclass.outputs.failureClass }}
    # 本 job 是「不带 pull-requests 读权限的 job 一律取不到 changed files」这一隐式规则的唯一
    # 例外：它必须读 PR 的文件与标签，故按 job 显式补读权限（工作流级只声明 `contents: read`，
    # 其余 job 维持原样）。labels 走 issues 端点属 REST 惯例，token 的 pull-requests 读权限已覆盖
    #（现网实测 `gh api repos/<owner>/<repo>/issues/<n>/labels` 通过）。
    permissions:
      contents: read
      pull-requests: read
    # `permissions:` 只**授权**、不**注入**：Actions 里 `gh` 认的是 GH_TOKEN/GITHUB_TOKEN
    # 环境变量，缺它时 gh 会以「未认证」失败——这正是 PR #851 那次真实 CI 的失败原因
    # （取数步 failure、判据步 skipped）。用 job 级 env 让取数步与判据步同源取用，取值写法与
    # 本仓既有先例一致（health-report.yml 的三处、observe.yml 的归档步）。
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Resolve changed files & labels（gh api + 有界重试；仍失败即非零退出）
        # 只做「取数 + 落原始 JSON」：字段抽取、解析失败与判定全部由下一步的判据脚本承担，
        # 免得同一套口径在 workflow 与脚本里各写一份（两份必然漂移）。--paginate 必须带：
        # 只取首页会让红线改动静默漏判（现网实测：54 文件的 PR 在 per_page=30 下正是这个形态）。
        # 有界重试（3 次 / 间隔 5s）只为吸收 GitHub API 的瞬时 5xx 与限流：本 job 无差别阻断
        # 所有 PR，一次网络抖动就把整条 PR 判红的代价远大于 10 秒等待；但次数必须封顶——
        # **宁可重试也不能 fail-open**：耗尽仍在循环内 echo ::error:: 并以非零退出，缺凭据时
        # 同样按「三次都失败」处理（这一步永不静默放行）。
        run: |
          set -e
          fetch() {
            local url="$1" out="$2" attempt=1
            while true; do
              if gh api $url > "$out"; then return 0; fi
              if [ "$attempt" -ge 3 ]; then
                echo "::error::取数失败（已重试 3 次）：$url —— fail-closed"
                return 2
              fi
              echo "::warning::取数失败（第 $attempt 次），5s 后重试：$url"
              attempt=$((attempt + 1))
              sleep 5
            done
          }
          fetch "--paginate repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" "$RUNNER_TEMP/pr-files.json"
          fetch "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels" "$RUNNER_TEMP/pr-labels.json"

      - name: Red-line approval（红线路径改动须带 approved 标签）
        # 判据步骤保持闭合单命令：输入校验（非 JSON / 缺字段 / 空变更集）与逐条判红都在
        # 脚本内，退出码直接由本步转发（1 = 判红、2 = 输入不可解析，两码都让本 job 红）。
        # --status-file 是**诊断面**输入（不参与判定）：它把这次到底是 1 还是 2 带出 job，
        # 供下一步产出 GATE_FAILURE_CLASS（#843 P-2）。
        run: node scripts/gate/red-line-approval.mjs --files-json "$RUNNER_TEMP/pr-files.json" --labels-json "$RUNNER_TEMP/pr-labels.json" --status-file "$RUNNER_TEMP/redline-status.json"

      - name: Gate failure class（状态文件 → job output；读不到一律 crashed）
        # 三态口径与 scripts/gate/observe-check.mjs 一致：0=scored / 1=failed / 其它=crashed。
        # 只有「判据步骤 exit 1」才证明这是判据按设计判红；状态文件缺失（脚本还没跑到写盘就
        # 被杀、步骤被跳过）与 exit 2 都按 crashed——**缺省即 fail-closed**，不把未知说成判红。
        # 排在判据步骤**之后**：它影响不到已经在前面跑完的判据，故不需要逐条登记（gate-wiring
        # 的环境面只登记判据步骤之前的前序 run 步骤）。
        id: gateclass
        if: always()
        run: |
          set -e
          STATUS="$RUNNER_TEMP/redline-status.json"
          CLASS=crashed
          if [ -f "$STATUS" ] && [ "$(jq -r '.exitCode // empty' "$STATUS" 2>/dev/null)" = "1" ]; then
            CLASS=judged
          fi
          echo "failureClass=$CLASS" >> "$GITHUB_OUTPUT"
          echo "红线门禁失败类别：$CLASS（状态文件：$(cat "$STATUS" 2>/dev/null || echo '缺失')）"

  # ── 第 2 段：命中包并行 build + lib artifact + smoke/typecheck（#722 全切片）──
  # 矩阵来源 = changes.buildPackages（命中包；空切片时为哨兵项）。为什么不是固定全集：
  # 固定矩阵会让单包 PR 也拉起 7 个 check 实例（6 个全程 skip，纯耗 runner 分钟）；
  # 为什么不是裸动态矩阵：GHA 对**零实例**动态矩阵实测回报 failure（实证 run
  # 32802575298），会连坐 repo-gate 判定表的 build-test == success 判据，故空切片
  # 用哨兵项占位（哨兵不匹配任何包，所有步骤的 contains(hitPackages, ...) 自然为假）。
  # 全仓产物闸（contract/pack:check/verify:npmlayout）在 gate:full PR 与夜间 observe
  # 落地，不再依赖本 job 的全集产物。
  build-test:
    name: Build / Test / Typecheck (${{ matrix.package }})
    needs: changes
    if: always() && needs.changes.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.buildPackages) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        # 版本以根 package.json 的 packageManager 字段为单一事实源（勿同时指定 version）

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # 哨兵实例（空切片）不装依赖：条件与下方各步骤同源，避免在 YAML 里重复哨兵字面量
        if: contains(fromJSON(needs.changes.outputs.hitPackages), matrix.package)
        run: pnpm install --frozen-lockfile
      # Build package：名称选择器 + ... 后缀按 workspace 拓扑先构建依赖（目录选择器
      # + ... 在 pnpm 11 不展开依赖，评审实测须用 @scope/name... 形态）。
      # #722 门禁分层：只构建**命中包**——repo-gate 的产物闸同步改为命中包切片，
      # 全仓产物闸（含全部包 lib/index.js 齐备断言）只在 gate:full 标签 / 夜间跑。
      - name: Build package（仅命中包；未命中包本 job 只做 checkout+setup）
        if: contains(fromJSON(needs.changes.outputs.hitPackages), matrix.package)
        run: pnpm --filter "@wingsky-1/${{ matrix.package }}"... build

      - name: Smoke tests（仅命中包；聚合包无 test 脚本由 --if-present 跳过）
        if: contains(fromJSON(needs.changes.outputs.hitPackages), matrix.package)
        run: pnpm --filter ./packages/${{ matrix.package }} --if-present test

      - name: Typecheck（仅命中包；聚合包无 typecheck 脚本由 --if-present 跳过）
        if: contains(fromJSON(needs.changes.outputs.hitPackages), matrix.package)
        run: pnpm --filter ./packages/${{ matrix.package }} --if-present typecheck

      - name: Upload package outputs artifact（供 repo-gate 产物闸复用，F9；#722 仅命中包）
        if: contains(fromJSON(needs.changes.outputs.hitPackages), matrix.package)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-${{ matrix.package }}
          # 构建产物全集（.gitignore 同款四类）；多路径最短公共祖先 = 包根，
          # zip 内容即 lib/ shared/ types/ LICENSE 本身
          path: |
            packages/${{ matrix.package }}/lib
            packages/${{ matrix.package }}/shared
            packages/${{ matrix.package }}/types
            packages/${{ matrix.package }}/LICENSE
          retention-days: 1
          if-no-files-found: error

  # ── 第 3 段之一：全局单次覆盖采集（#217 变异/覆盖解耦；#722 阶段三切 vitest）──
  # cov 从变异矩阵剥离为全局单进程采集：此前矩阵 6 实例并行各自跑全仓 smoke，
  # lan-proxy 固定端口 EADDRINUSE 与 provider-usage K12 时序漂移是 flake 根因；
  # 单次采集根治端口竞争。
  #
  # 拓扑（复核裁决采纳并行选项 b）：本 job 与 mutation-gate 矩阵平行
  # （wall-clock = max(install+cov, install+build+stryker)，严格优于串行）。
  # 覆盖率与变异的连坐关系（#742 阶段 1.2 收窄）：verdict 不再以本 job success 为 if 前提，
  # 故本 job 失败/skip 不会吞掉变异判分；覆盖率维度改由 repo-gate 判定表按 fullGate 裁决
  # （跑了 gate:full 的 PR 仍要求 success）。整体仍红——不存在「cov 挂了而门禁绿」的半通状态。
  #
  # #722 阶段三：采集换为 vitest coverage（istanbul provider），阈值判分随之移入
  # vitest.config.ts 的 coverage.thresholds（未达标即非零退出，不再有独立判分脚本）；
  # 分母只含 packages/*/src + shared，零 vendor、零 lib 产物。
  coverage:
    name: Coverage collection (global single-run)
    needs: changes
    # #722 门禁分层 + #742 阶段 1.5：覆盖率是「全仓分母」口径（单包 diff 对全仓分母的
    # 余量实测仅 1.0~1.8pp，与「单次合入质量」的归因原则不符），PR 默认不跑；只有打
    # gate:full 标签时才补跑（维护者裁决 4 维持该口径）。注意 #742 阶段 1 起变异已改为
    # PR 强制，本 job 与全仓产物闸是该标签在 PR 侧仅有的效果面，故这个 fullGate 条件必须保留。
    # 另含 hasMutations：覆盖率是对象面包级口径，纯文档 / 无变异配置包的 PR 即使打了标签也
    # 不实例化本 job（空切片合法缺席，判定表按 skipped 收）。
    if: github.event_name == 'pull_request' && needs.changes.outputs.fullGate == 'true' && needs.changes.outputs.hasMutations == 'true'
    runs-on: ubuntu-latest
    # 10 分钟：新链路只剩 install + 采集（本机 8 核实测 47s），原 20 分钟是为
    # 「全量 build + c8 包裹全仓 smoke + self-cov」三段设的。
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        # 版本以根 package.json 的 packageManager 字段为单一事实源（勿同时指定 version）

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 刻意不构建：unit/integration 直连 src（#722 阶段一），覆盖率分母只含
      # packages/*/src + shared，不消费 lib 产物。实测无 lib 产物时本链路 exit 0
      # （原始「必须全量构建」注释属 c8 产物口径遗留）。

      # Mutate 面守卫已随 #276 方案 A 退役：src 级 mutate 用文件 glob 声明
      # （stryker.conf.d/<pkg>[-<n>].json 的 mutate = 源文件名清单），无产物
      # 行号、永不漂移，原 sync-mutate-segments / mutate-scope-guard 整套机制
      # 随之删除（见 #276 阶段 3 退役清点）。

      - name: Coverage collection（vitest coverage，unit + integration 直连 src）
        run: pnpm cov

      - name: Upload coverage artifact（留档与夜间归档；阈值判分已由 pnpm cov 的 thresholds 完成）
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage/coverage-summary.json
          retention-days: 1
          if-no-files-found: error

  # ── 第 3 段之二：PR 变异矩阵（#178 v2 切片 + #187 事件收敛 + #217 解耦 + #742 阶段 1）──
  # - 仅对变异切片实例化（动态 matrix ← changes.mutationCombos）；hasMutations
  #   为 'false' 时 if 直接为假、矩阵不实例化（job result = skipped，零实例
  #   动态矩阵实测报 failure 的怪癖形态由此消除）
  # - 仅限 pull_request 触发（#187）：主干变异覆盖归 observe.yml 夜间全量、发版
  #   归 release.yml tag 管线；非 PR 事件下整体 skipped，由 repo-gate 判定脚本
  #   按事件语义显式放行
  # - #742 阶段 1.1：PR 上一律按命中切片**强制**跑，不再等 gate:full 标签。原形态把
  #   变异从「单次合入的质量判据」降级成「偶尔补跑」——默认 PR 的落地路径根本不验证
  #   变异，与 #742 的强制执行目标相反。代价（PR 反馈时间）按维护者裁决 1.6-A「接受」
  #   显式承担，上界口径见下方「成本上界」。
  # - #217 解耦：本 job 只做基线 restore + stryker run + 报告上传，不再各自跑
  #   pnpm cov / 判分——变异率判分统一收敛到 mutation-verdict；
  #   与 coverage job 平行无依赖（复核裁决选项 b），cov 失败不影响本矩阵跑完
  # - 基线来源（#572）：读孤立分支 refs/heads/baseline/mutation（git 协议
  #   天然跨 ref 可见，零 API 鉴权要求）；首夜/基线缺失时天然降级为全量变异，门禁语义不变仅变慢
  # - #742 阶段 1.7：命中包的 test/** 有变更时**主动失效该段基线**（回退全量）。Stryker
  #   的 static mutant 没有覆盖信息、测试变更对它们不可见（官方 Limitations），继续复用会
  #   让「新增用例意图杀掉存活 mutant」拿到假绿；失效代价 = 该段一次全量，可控（维护者裁决 3）。
  # - 成本上界（#742 阶段 1.6，裁决选 A「接受」）。口径必须分清「实测墙钟」与「超时上限」：
  #   ① 基线命中良好（增量复用）：逐段实测墙钟 3~104 s（#718 S0.2 台账，
  #      dsh-provider-usage-pipeline 段 10.1 s），是绝大多数 PR 的形态；
  #   ② 基线失效/首夜（全量冷跑）：台账 32 段（当时口径；#826 后为 35 段）逐段墙钟合计 14803 s（串行）；本 job 的 combo
  #      是字典序（见下），@8 模型 makespan ≈ 41.6 min（夜间 LPT @8 = 31.2 min，LPT 是模型值）；
  #   ③ 逐段**超时上限**区间 30~42 min（台账派生值，见 timeout-minutes），不是实测墙钟；
  #      极端上界 = 各段都跑满超时（Σ 派生超时 990 min）÷ 8 个并发槽 ≈ 2.1 小时，
  #      仅当全部实例卡死才会出现。
  #   注意 PR 矩阵的 combo 顺序是包名+段名字典序（ci-matrix 的确定性排序），不按耗时降序——
  #   耗时降序（LPT）只在夜间 mutation-plan 的 buildShardMatrix 里。长期超阈值再评估 1.6-B
  #   （按 diff 行采样）——它的行号脆弱依赖会静默漏 mutant，不作默认。
  # 已知约束：GitHub Actions 的 matrix 不允许引用 env context，但可引用 needs outputs
  mutation-gate:
    name: Mutation gate (${{ matrix.combo.package }} · ${{ matrix.combo.seg }})
    needs: changes
    # 与 coverage job 平行（无 needs 依赖）；if 精确锁定事件面与显式布尔切片，
    # 空 slice 时 if 直接为假、矩阵不实例化（job result = skipped）。
    # #742 阶段 1.1：去掉了 fullGate 条件——PR 上按切片强制跑，标签只留给覆盖率与
    # 全仓产物闸（#722 的分层语义收窄到那两项）。
    if: github.event_name == 'pull_request' && needs.changes.outputs.hasMutations == 'true'
    strategy:
      fail-fast: false
      # 与夜间班（observe.yml）同值限流，取 8（#718 P3，维护者 approved）。取 8 的依据是
      # **账户并发余量**，不是「8 档已饱和」——8 档在两种调度形态下都尚未到零收益：
      # - 本 job 的 combo 顺序是 package+seg 字典序（ci-matrix 的确定性排序），LPT 只在夜间
      #   mutation-plan。run 34764977606（12 段、合计 145.65 min、5 槽）实测窗口 43.05 min，
      #   与同序模型 43.00 min 吻合；同口径模型 @8 = 29.83 min、@10 = 26.80 min。
      # - 夜间全量（当时 32 段 LPT，台账合计 14803 s）模型 @8 = 31.24 min、@10 = 25.22 min。
      #   两者都是**模型值**：同段集的 LPT 模型给 30.63 min，而全量/失效形态实测窗口到过
      #   43.0 min（#718 approved 记录）——实际受 runner 排队与调度形态影响。
      # - 增量形态实测（本项 PR run 34796310130 / 96637f96，当时 32 段、8 档）：mutation 窗口
      #   3.87 min、本轮全 run 并发峰值 15、mutation-verdict pass。
      # - 账户并发上界 20 是 #718 S0.3 的**历史实测口径**（PR #753 的 100 个 run，峰值分布
      #   20×15 / 19×4 / 18×1）。scripts/maintenance/scan-actions-concurrency.mjs 未过滤
      #   cancelled run，直接复跑会因被取消 run 的排队 job 时间戳得到伪影（复核实测 max=35，
      #   同一 run 滤掉 cancelled 后为 11）——故沿用历史口径，扫描器另记 follow-up。
      # - 本仓峰值 = build-test（**至多 7** = 命中包数；实测有 1、1+哨兵、7）+ max-parallel：
      #   8 档 → 至多 15，gate:full 带 coverage → 16；10 档 → 17~18，只剩 3 个余量。
      # docs/mutation-speedup-methodology.md §4.3 的 timeout 机制核对不适用（本项是 job 级
      # 并发，每 job 独立 runner VM，不改 Stryker 段内 concurrency）；score 与基线口径的核对
      # 见上一条 8 档实测（run 34796310130，mutation-verdict pass）。
      max-parallel: 8
      # #220 B 方案：combo = {package, seg}；改造后 seg=功能段名（数字段名亦兼容），
      # 多段包逐段并行实例化，未拆分包单实例（seg="0" 走包级配置 <pkg>.json）。
      # #742 阶段 1：combo 另带 timeoutMinutes（逐段超时）与 invalidateBaseline
      # （test/** 变更失基线），均由 scripts/ci/ci-matrix.mjs 从事实源派生。
      matrix:
        combo: ${{ fromJSON(needs.changes.outputs.mutationCombos) }}
    runs-on: ubuntu-latest
    # #742 阶段 1：超时随段派生（与夜间 observe.yml 的 mutation-plan 同一份台账、同一套
    # 公式），不再是全局固定值。固定 30 分钟在两个方向上都错：对 4 个长段（当时口径派生 32/36/40/42 min）
    # 太小——run 34628767342（PR #730，gate:full，32 实例）的 dsh-notifier · config 跑到 1819s
    # 被 canceled、连带判分 job failure、整个 run cancelled；对 28 个短段（实测 20.6~944.2 s）又白等。
    # 口径提醒：那次 1819s 属于**旧文件面**（该段在 #733 重写前 2365 mutant，现 941 mutant /
    # 全量实测 117.5 s），它的作用是证明「单一固定值不可能服务所有段」，**不**等于该段现在需要
    # 30 分钟以上。派生值本身的证据是台账：35 段中 27 段有 scope=full 实测，且每段派生值都不低于
    # 该段实测墙钟（mutation-ledger --check 判据）；其余 8 段（#826 新增的 lan-proxy 6 段 +
    # dsh-notifier client + dsh-worktree-sidebar）尚无实测，走保守默认 30 min
    # （mutation-plan.mjs 的 DEFAULT_TIMEOUT_MINUTES），首夜全量班后由 ledger --record 补上。
    timeout-minutes: ${{ matrix.combo.timeoutMinutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        # 版本以根 package.json 的 packageManager 字段为单一事实源（勿同时指定 version）

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 必须全量构建（run #32790425132 教训）：mutate 区间的行号锚定 esbuild
      # 产物分段注释，产物结构依赖 workspace 内联链（shared/ 与依赖包副本）的
      # 全集一致性；单包构建曾因跨包 lib 缺失直接 ERR_MODULE_NOT_FOUND。
      # 注意：cov 移入全局 coverage job 后，本步骤与覆盖率口径无关
      - name: Build all packages（变异对象 lib 分段依赖全集一致的构建链）
        run: pnpm build

      - name: Resolve combo paths（#220 + #342 二期：seg="0" 包级配置；seg=功能段名/数字段名）
        env:
          MATRIX_PKG: ${{ matrix.combo.package }}
          SEG: ${{ matrix.combo.seg }}
        run: |
          set -e
          PKG="${MATRIX_PKG#dsh-}"
          if [ "$SEG" = "0" ]; then
            echo "CONF=stryker.conf.d/${MATRIX_PKG}.json" >> "$GITHUB_ENV"
            echo "REPORT=${MATRIX_PKG}" >> "$GITHUB_ENV"
            echo "BASENAME=incremental-${PKG}" >> "$GITHUB_ENV"
          else
            echo "CONF=stryker.conf.d/${MATRIX_PKG}-${SEG}.json" >> "$GITHUB_ENV"
            echo "REPORT=${MATRIX_PKG}-${SEG}" >> "$GITHUB_ENV"
            echo "BASENAME=incremental-${PKG}-${SEG}" >> "$GITHUB_ENV"
          fi

      - name: Restore incremental baseline from orphan branch（#572：从孤立分支恢复基线）
        # #572：从孤立分支 refs/heads/baseline/mutation 浅拉取纯文本增量基线，
        # 替代旧方案（#204 方案 A：读 main 分支 scripts/gate/baseline/ 版本化文件），
        # 彻底剥离 main 分支代码树巨型 JSON 与自动 PR 噪音。
        # 基线文件名随 combo 段号：incremental-<pkg>.json / incremental-<pkg>-<seg>.json。
        # 首夜/孤立分支基线缺失时天然降级为全量变异（notice 标注属预期，非缺陷）。
        # #742 阶段 1.7：invalidateBaseline 为真时先删掉本段基线，复用「基线缺失 → 全量」
        # 这条既有路径，不另立一套入口。判据来自 ci-matrix（paths-filter 的 <pkg>_files
        # 清单里出现 test/ 前缀），本步骤不重新推路径规则。
        id: baseline
        env:
          INVALIDATE: ${{ matrix.combo.invalidateBaseline }}
        run: |
          set -e
          node scripts/gate/orphan-baseline.mjs restore
          SRC="coverage/mutation/${BASENAME}.json"
          if [ "$INVALIDATE" = "true" ]; then
            rm -f "$SRC"
            echo '::notice::命中包的 test/** 有变更 —— 主动失效本段增量基线，本次全量变异（#742 阶段 1.7：static mutant 对测试变更不可见）'
          fi
          if [ -f "$SRC" ]; then
            echo "incremental 基线命中：$SRC（孤立分支）"
          else
            echo '::notice::incremental 基线文件缺失 —— 本次降级为全量变异（首夜/新包无基线属预期，非缺陷）'
          fi

      - name: Incremental mutation（incremental 生效跳过未变 mutant）
        run: npx stryker run "${CONF}"

      - name: Upload stryker report artifact（报告交 mutation-verdict 统一判分）
        # if: always()：实例非零退出（如内建阈值不足/崩溃）时已产出的报告照常
        # 下发聚合判分；未产出报告时 if-no-files-found: error 让实例自身红
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-report-${{ matrix.combo.package }}-${{ matrix.combo.seg }}
          path: coverage/mutation/${{ env.REPORT }}.json
          retention-days: 1
          if-no-files-found: error

      - name: Upload incremental baseline artifact（供合并后秒级 overlay 复用 #572）
        # 变异测试通过时上传产出的增量基线文件，供 PR 合入 main 后由 baseline-overlay.yml 秒级复用。
        # 保留期从 1 天放宽到 7 天（#718 S2.1）：overlay 只在**合入那一刻**去取这份产物，
        # 1 天的窗口意味着「PR 隔天再合」或「CI 跑完隔夜才合」时产物已过期，该 PR 命中段的新基线
        # 就静默进不了归档（overlay 侧的静默 no-op 已同步改为 fail-loud，但放宽窗口才是治本）。
        # 公开仓库的 Actions 存储不计费；单次 CI 的变异产物合计约 10~20 MB。
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-incremental-${{ matrix.combo.package }}-${{ matrix.combo.seg }}
          path: coverage/mutation/${{ env.BASENAME }}.json
          retention-days: 7
          if-no-files-found: ignore

  # ── 第 3 段之三：聚合判分收尾（artifact 汇合 + 逐包变异率判分，#217）──
  # - 各包 stryker 报告（mutation-gate 矩阵）在此汇合后逐包跑
  #   scripts/gate/mutation-gate.mjs 判分；
  # - #742 阶段 1.2：**不再**把 needs.coverage.result == 'success' 写进本 job 的 if。
  #   原写法让覆盖率失败直接吞掉整份变异判分，PR 上既看不到变异结论、也分不清是变异不达标
  #   还是覆盖率不达标；覆盖率维度仍由 repo-gate 判定表按 fullGate 裁决（跑了 gate:full 的
  #   路径仍要求 coverage success），只是不再让 verdict 缺席。
  # - if 用 always() 组合：矩阵 failure（实例级 stryker 非零退出）时仍运行
  #   聚合判分——已产出报告的包照常计账、缺报告的包由脚本 exit 2 fail-closed；
  #   矩阵 skipped（空切片）时连带 skipped，交 repo-gate 判定表按维度裁决；
  # - 判分链为纯 Node 内置模块（gauntlet config + mutation-report-lib），
  #   无需 pnpm install。
  mutation-verdict:
    name: Mutation gate verdict (aggregate)
    needs: [changes, coverage, mutation-gate]
    if: always() && needs.changes.outputs.hasMutations == 'true' && needs.mutation-gate.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          # 本 job 判分链为纯 Node 内置模块、不 pnpm install（见 job 头注释），必须
          # 显式关闭 setup-node v5 默认的 package-manager-cache：其探测到仓库根
          # pnpm-lock.yaml 会调用 PATH 中的 pnpm 计算缓存 key，而本 job 是全
          # workflow 唯一不前置 pnpm/action-setup 的 job，runner 镜像又不自带
          # pnpm → Setup Node.js 直接红（实证 run 32879414842 / 32876671584，
          # "Unable to locate executable file: pnpm"，repo-gate F2 随之连坐红）
          package-manager-cache: false

      - name: Download mutation report artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mutation-report-*
          path: coverage/mutation

      - name: Restore report layout（多 artifact 下载各建子目录，平铺回 coverage/mutation/）
        # #220 B 方案：缺失检查按 combo 粒度 —— 拆分包每段报告都必须下发
        # （段实例 if-no-files-found: error 已兜底，此处双保险 fail-closed）
        env:
          COMBOS: ${{ needs.changes.outputs.mutationCombos }}
        run: |
          set -e
          DIRS="$(ls -d coverage/mutation/mutation-report-* 2>/dev/null || true)"
          [ -n "$DIRS" ] || { echo '::error::变异报告 artifact 未下发（pattern 匹配 0 个）—— fail-closed'; exit 1; }
          for dir in $DIRS; do
            cp "$dir"/*.json coverage/mutation/
          done
          MISSING=0
          mapfile -t ROWS < <(printf '%s' "$COMBOS" | jq -r '.[] | "\(.package) \(.seg)"')
          for row in "${ROWS[@]}"; do
            pkg="${row% *}"; seg="${row#* }"
            if [ "$seg" = "0" ]; then f="coverage/mutation/${pkg}.json"; else f="coverage/mutation/${pkg}-${seg}.json"; fi
            [ -f "$f" ] || { echo "::error::${f} 报告 artifact 未下发 —— fail-closed"; MISSING=1; }
          done
          [ "$MISSING" -eq 0 ] || exit 1
          echo 'artifact 层级还原完成：coverage/mutation/<pkg>[-<seg>].json'

      - name: Mutation gate verdict（逐包变异率判分，受 mutation.strict 开关约束）
        # 记账模式：任一包判分失败继续跑完其余包，结尾统一判红（与夜间逐包容错纪律一致）
        env:
          SLICE: ${{ needs.changes.outputs.mutationPackages }}
        run: |
          set -e
          FAILED=0
          for pkg in $(printf '%s' "$SLICE" | jq -r '.[]'); do
            echo "::group::mutation verdict $pkg"
            if node scripts/gate/mutation-gate.mjs "$pkg"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              FAILED=1
            fi
          done
          [ "$FAILED" -eq 0 ] || { echo '::error::存在未通过变异率判分的切片包 —— fail-closed'; exit 1; }

  # ── 第 4 段：聚合闸（job 名保持分支保护 required check 名不变，无缝切换）──
  # needs 连坐语义（#217）：coverage / mutation-gate / mutation-verdict 任一失败
  # 都必须让本闸红——判定表按「事件 × fullGate × 切片(hasMutations) × coverage
  # × 变异矩阵 × verdict」六维裁决；coverage 失败 → verdict 连坐 skipped → 判定表
  # 以 GATE_COVERAGE 维度优先点名「coverage 失败连坐」，而非误报「mutation 绕过」。
  #
  # #722 门禁分层：本 job 的步骤按**用途**分两组（组 B 的产物闸排在部分组 A 步骤之前）——
  #   组 A（廉价全仓闸，恒跑）：判定脚本、threshold-monotonic、aggregate:check、stryker:check、
  #     test:scripts、forbid-*、verify-dir-imports、export-surface-snapshot、verify-shared-fanin、
  #     verify-scripts-index、verify-coverage-scope、verify-vendored-binaries、docs:check、lint、
  #     format:check。不依赖 lib 产物（test:scripts 的前置包清单见 script-test-prereqs.mjs）。
  #   组 B（产物闸，按 fullGate 切口径）：contract / pack:check / verify:npmlayout——默认 PR 只验
  #     命中包，gate:full 与夜间验全仓。事实源是步骤本身；端点双向比对见 gate-wiring.test.ts。
  repo-gate:
    name: Build / Contract / Smoke / Pack
    needs: [changes, red-line-approval, build-test, coverage, mutation-gate, mutation-verdict]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # 阈值单调性校验需读 origin/main 的 config（F3）

      - name: Fail-closed gate assertion（F2：任何上游非 success 即红）
        # #187：判定逻辑收敛到 scripts/gate/repo-gate-assert.mjs（可被单元测试
        # 全组合锁死），env 注入避免内联 bash 漂移。#217 扩展为五维判定：
        # 事件 × 切片(hasMutations) × coverage × 变异矩阵 × verdict。
        # 必须排在 Checkout 之后（run #32800733630 教训：脚本版需要工作区文件，
        # 旧内联 bash 无文件依赖掩盖了这一时序约束）；仅依赖 Node 内置模块，
        # 无需等 pnpm/setup-node，紧随 checkout 尽早判红
        env:
          GATE_EVENT: ${{ github.event_name }}
          GATE_CHANGES: ${{ needs.changes.result }}
          GATE_BUILD_TEST: ${{ needs.build-test.result }}
          GATE_COVERAGE: ${{ needs.coverage.result }}
          GATE_MUTATION: ${{ needs.mutation-gate.result }}
          GATE_VERDICT: ${{ needs.mutation-verdict.result }}
          GATE_REDLINE: ${{ needs.red-line-approval.result }}
          GATE_HAS_MUTATIONS: ${{ needs.changes.outputs.hasMutations }}
          GATE_MUTATION_PKGS: ${{ needs.changes.outputs.mutationPackages }}
          GATE_FULL_REQUESTED: ${{ needs.changes.outputs.fullGate }}
          # #843 P-2：上游判据 job 报 failure 时，本次红是「判据判红」还是「门禁故障」。
          # 取值来自红线 job 的状态文件；它 skipped（非 PR）或未产出 output 时退化为 judged
          # ——那时没有任何证据指向门禁故障。**缺省（env 整行被删）才是 crashed**，即
          # fail-closed 落在这条接线的消失上，而不是落在正常的主干触发上。
          GATE_FAILURE_CLASS: ${{ needs.red-line-approval.outputs.failureClass || 'judged' }}
        run: node scripts/gate/repo-gate-assert.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        # 版本以根 package.json 的 packageManager 字段为单一事实源（勿同时指定 version）

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 以下四条原先藏在 contract-check.ts 内部以 spawnSync 执行——判据在跑，但 workflow 里看不到，
      # 「每条判据至少一个可见执行点」对它们永远为假（接线盲区）。迁成直接步骤（同 #733 3.1.2 把
      # module-state 迁出 contract 的方向），位置紧跟依赖安装、排在产物闸与 lint / test:scripts 之前：
      # 只依赖 node_modules（export-surface-snapshot 自跑 tsc），且 GHA 判红即中止，排得越靠后一次
      # 运行能拿到的判决越少（排在 Install 之前则 tsc 找不到）。
      - name: Verify dir imports（目录门面：跨模块引用只走 interface.ts；4 包硬判）
        run: node scripts/gate/verify-dir-imports.mjs --package dsh-mcp-manager --package dsh-notifier --package dsh-lan-proxy --package dsh-worktree-sidebar
      - name: Verify dir imports（provider-usage，--soft：直引明细只报告）
        run: node scripts/gate/verify-dir-imports.mjs --package dsh-provider-usage --soft
      - name: Export surface snapshot（dsh-notifier 导出面与基线零 diff）
        run: node scripts/gate/export-surface-snapshot.mjs --package dsh-notifier
      # #826 起 lan-proxy 也冻结导出面基线：该 PR 的核心声明是「目录重排零行为变更」，
      # 此前只能靠人工一次性比对，接入后成为可重复判据（覆盖主入口 . 与客户端入口 ./client）。
      # 必须是独立 step——脚本只读第一个 --package（export-surface-snapshot.mjs 的 ARGV 解析），
      # 拼在同一行会让第二个包静默不检查，而接线断言两侧同写仍全绿（假接线）。
      - name: Export surface snapshot（dsh-lan-proxy 导出面与基线零 diff）
        run: node scripts/gate/export-surface-snapshot.mjs --package dsh-lan-proxy
      - name: Verify shared fan-in（shared 模块跨包扇入；#792）
        run: node scripts/gate/verify-shared-fanin.mjs

      - name: Download package outputs artifacts（F9：复用 matrix 命中包产物，避免重复构建）
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: pkg-*
          # 暂存目录落在 runner 临时区，**不放进工作树**：本 job 后续要跑组 A 的全仓扫描闸
          # （format:check 的 `prettier --check .`、docs:check、lint），工作树里多出的产物目录
          # 会被它们当成仓库内容——实测它让 format:check 判出 205 个"格式违规"（#777）。
          # 面只应由仓库内容定义，不去给扫描器加"这不是源码"的例外条目。
          path: ${{ runner.temp }}/artifacts-tmp

      - name: Restore package outputs into package trees
        env:
          FULL_GATE: ${{ needs.changes.outputs.fullGate }}
          ALL_PACKAGES: ${{ needs.changes.outputs.allPackages }}
          HIT_PACKAGES: ${{ needs.changes.outputs.hitPackages }}
        run: |
          set -e
          # 多路径上传的 zip 根 = 包根：artifact 内容即 lib/ shared/ types/ LICENSE 本身
          STAGING="${RUNNER_TEMP}/artifacts-tmp"
          for dir in "$STAGING"/pkg-*; do
            [ -d "$dir" ] || continue
            pkg="${dir#"$STAGING"/pkg-}"
            mkdir -p "packages/$pkg"
            cp -r "$dir/." "packages/$pkg/"
          done
          # 先验证下载链路；全仓构建不能掩盖命中包 artifact 丢失。
          SCOPE_DESC="命中包切片（增量）"
          WANT="$(printf '%s' "$HIT_PACKAGES" | jq -r '.[]')"
          for pkg in $WANT; do
            test -f "packages/$pkg/lib/index.js" || { echo "::error::$pkg/lib/index.js 缺失（命中包 artifact）"; exit 1; }
          done
          echo "构建产物就位（口径：$SCOPE_DESC）：$WANT"

      - name: Build all packages（gate:full：全仓产物闸的前提）
        if: needs.changes.outputs.fullGate == 'true'
        env:
          ALL_PACKAGES: ${{ needs.changes.outputs.allPackages }}
        run: |
          set -e
          if [ "$(printf '%s' "$ALL_PACKAGES" | jq 'length')" -eq 0 ]; then
            echo '::error::allPackages 为空（fail-closed，禁止零断言通过）'
            exit 1
          fi
          pnpm build
          WANT="$(printf '%s' "$ALL_PACKAGES" | jq -r '.[]')"
          for pkg in $WANT; do
            test -f "packages/$pkg/lib/index.js" || { echo "::error::$pkg/lib/index.js 缺失（全仓构建后）"; exit 1; }
          done

      - name: Build script-test prerequisites（test:scripts 的编译面依赖）
        # scripts/test 里有用例用 tsc 真实编译契约测试文件，需要对应包的**声明产物**
        # （lib/index.d.ts）。清单的单一事实源是 scripts/test/script-test-prereqs.mjs，
        # 该用例自身断言清单覆盖其 SUITES，故「新增编译面用例忘更新清单」会在
        # test:scripts 内判红，而不是在这里静默少建一个包导致假红。
        run: |
          set -e
          FILTERS=$(node -e "import(require('node:url').pathToFileURL('scripts/test/script-test-prereqs.mjs').href).then(m=>console.log(m.PREREQ_PACKAGES.map(p=>'--filter @wingsky-1/'+p+'...').join(' ')))")
          echo "prereq filters: $FILTERS"
          pnpm $FILTERS build

      - name: Client contract（客户端契约；#722 默认只验命中包）
        env:
          FULL_GATE: ${{ needs.changes.outputs.fullGate }}
          HIT_PACKAGES: ${{ needs.changes.outputs.hitPackages }}
        run: |
          set -e
          if [ "$FULL_GATE" = "true" ]; then
            pnpm contract
          else
            node scripts/gate/contract-check.ts --packages "$(printf '%s' "$HIT_PACKAGES" | jq -r 'join(",")')"
          fi

      - name: Threshold monotonicity（F3：阈值只许升不许降，PR 场景生效）
        if: github.event_name == 'pull_request'
        run: node scripts/gate/threshold-monotonic.mjs origin/main

      - name: Pack check（防发布断链；#722 默认只验命中包）
        env:
          FULL_GATE: ${{ needs.changes.outputs.fullGate }}
          HIT_PACKAGES: ${{ needs.changes.outputs.hitPackages }}
        run: |
          set -e
          if [ "$FULL_GATE" = "true" ]; then
            pnpm pack:check
          else
            node scripts/gate/pack-check.ts --packages "$(printf '%s' "$HIT_PACKAGES" | jq -r 'join(",")')"
          fi

      - name: Npm layout（解包后可加载；#722 默认只验命中包）
        env:
          FULL_GATE: ${{ needs.changes.outputs.fullGate }}
          HIT_PACKAGES: ${{ needs.changes.outputs.hitPackages }}
        run: |
          set -e
          if [ "$FULL_GATE" = "true" ]; then
            pnpm verify:npmlayout
          else
            node scripts/gate/verify-npm-layout.ts --packages "$(printf '%s' "$HIT_PACKAGES" | jq -r 'join(",")')"
          fi

      - name: Aggregate check（聚合 patch 不漂移）
        run: pnpm aggregate:check

      # #722：变异配置 ↔ 拓扑清单一致性必须在**增量路径**也跑——变异段默认只在
      # gate:full / 夜间执行，若把这条留在变异 job 里，默认 PR 就再也拦不住
      # 「改了 conf 却没同步拓扑」的漂移。纯文件比对、秒级，无产物依赖。
      - name: Stryker config check（变异配置与拓扑 SSOT 一致）
        run: pnpm stryker:check

      - name: Scripts self-test（维护脚本自测，含 workflow 结构静态断言）
        run: pnpm test:scripts

      - name: Lint（ESLint 复杂度门禁；阈值唯一事实源 gauntlet.config.json 的 complexity 段）
        run: pnpm lint

      # #733 计划项 3.5：形态（Prettier）此前**没有任何 CI 执行点**——只有 pre-commit
      # 钩子，而钩子可被 --no-verify 绕过、且只作用于 staged 文件，形态因此是可以长期
      # 腐坏而无人报红的判据。面由 .prettierignore 显式圈定（只代码面），所以
      # `format:check` 即「代码面全量」，与 lint 同为零产物依赖的秒级全仓闸。
      - name: Format check（Prettier 形态；面见 .prettierignore）
        run: pnpm format:check

      - name: Forbid legacy src tests（#423：变异测试单份维护，*.src.test.ts 全仓禁现）
        run: node scripts/gate/forbid-src-tests.mjs

      - name: Forbid homedir in src（#517 B5：src 禁直连 HOME 来源 API，AST 扫描 fail-closed）
        run: node scripts/gate/forbid-homedir-src.mjs

      # #733 计划项 3.1.2：本闸原先藏在 contract-check.ts 的 spawnSync 里，与两个兄弟闸的
      # 执行点形态不一致（后果之一是 contract 段会先打印「客户端契约：全部通过」再 FAIL）。
      # 统一成同款直接步骤；本地侧同步进 local-gate 的 cheapGlobal。
      - name: Forbid module state in src（#733 N2a：src 禁模块级可变状态，AST 扫描 fail-closed）
        run: node scripts/gate/forbid-module-state-src.mjs

      # #843 P-2：门禁故障码（exit 2）必须经 lib/gate-exit.mjs 的唯一出口，否则「门禁自己
      # 坏了」在日志上又变回不可检索。纯 AST 扫描，无产物依赖，与兄弟 forbid-* 闸同段。
      - name: Forbid raw exit 2（scripts/gate + scripts/release 禁裸 exit 2）
        run: node scripts/gate/forbid-raw-exit2.mjs

      - name: Docs check（README/链接/占位符）
        run: pnpm docs:check
      - name: Scripts index（#733 3.3 E2：索引项存在 + 被调用的脚本必须登记）
        run: node scripts/gate/verify-scripts-index.mjs
      - name: Coverage scope（#733 3.4：覆盖率面单一事实源 + 面完整性 + 条目腐烂）
        run: node scripts/gate/verify-coverage-scope.mjs
      - name: Vendored binaries（批 2b：发布物面内裸二进制须登记 + 哈希一致 + 许可随包）
        run: node scripts/gate/verify-vendored-binaries.mjs
