name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # 受影响包矩阵的全集（与 packages/ 目录一一对应；新增包须同步更新 changes.filter
  # 与本清单——workflow-assert 自测会断言两者一致）
  ALL_PACKAGES: '["dsh-notifier","dsh-idle-archive","dsh-web-file-preview","dsh-mcp-manager","dsh-provider-usage","dsh-lan-proxy","dsh-plugins-all"]'
  # docs-only 等"无受影响包"场景注入 matrix 的占位元素：其实例全步骤跳过、恒为
  # success，禁止零实例 matrix 造成的假绿（#85 v3 F2）
  EMPTY_MATRIX_PLACEHOLDER: '__none__'

jobs:
  # ── 第 1 段：路径预筛（声明式 filter；失败一律 fallback 全量 = fail-closed）──
  changes:
    name: Detect changed packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.pkgs.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # F4：push 事件 diff 基准是 github.event.before（SHA），需完整历史保证可达；
          # PR 事件以 origin/main 为三点比基准同样依赖本地对象完整性
          fetch-depth: 0

      - name: Resolve diff base
        id: base
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && echo "${{ github.event.before }}" | grep -qv '^0*$'; then
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            # 全零 SHA（force push / 新分支首推）：base 置空 → 下方按全量处理
            echo "base=" >> "$GITHUB_OUTPUT"
            echo '::notice::push 事件 before 不可用 —— 按全量处理（fail-closed）'
          fi

      - name: Paths filter
        id: filter
        if: steps.base.outputs.base != ''
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          base: ${{ steps.base.outputs.base }}
          filters: |
            global:
              - 'shared/**'
              - 'scripts/**'
              - 'agents/**'
              - '.github/**'
              - 'docs/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - 'AGENTS.md'
            dsh-notifier:
              - 'packages/dsh-notifier/**'
            dsh-idle-archive:
              - 'packages/dsh-idle-archive/**'
            dsh-web-file-preview:
              - 'packages/dsh-web-file-preview/**'
            dsh-mcp-manager:
              - 'packages/dsh-mcp-manager/**'
            dsh-provider-usage:
              - 'packages/dsh-provider-usage/**'
            dsh-lan-proxy:
              - 'packages/dsh-lan-proxy/**'
            dsh-plugins-all:
              - 'packages/dsh-plugins-all/**'

      - name: Compute package matrix
        id: pkgs
        env:
          ALL: ${{ env.ALL_PACKAGES }}
          PLACEHOLDER: ${{ env.EMPTY_MATRIX_PLACEHOLDER }}
          GLOBAL_HIT: ${{ steps.filter.outputs.global }}
          FILTER_OUTCOME: ${{ steps.filter.outcome }}
          BASE_SET: ${{ steps.base.outputs.base }}
        run: |
          set -e
          # fail-closed 双闸：diff 基准不可用 或 filter 步骤失败 → 一律全量
          if [ -z "$BASE_SET" ] || [ "$FILTER_OUTCOME" = "failure" ]; then
            echo '::notice::fallback 全量（fail-closed）'
            echo "packages=$ALL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GLOBAL_HIT" = "true" ]; then
            echo '::notice::全局路径命中 → 全量'
            echo "packages=$ALL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HITS='['
          FIRST=1
          for pkg in $(echo "$ALL" | jq -r '.[]'); do
            case "$pkg" in
              dsh-notifier)          V='${{ steps.filter.outputs.dsh-notifier }}' ;;
              dsh-idle-archive)      V='${{ steps.filter.outputs.dsh-idle-archive }}' ;;
              dsh-web-file-preview)  V='${{ steps.filter.outputs.dsh-web-file-preview }}' ;;
              dsh-mcp-manager)       V='${{ steps.filter.outputs.dsh-mcp-manager }}' ;;
              dsh-provider-usage)    V='${{ steps.filter.outputs.dsh-provider-usage }}' ;;
              dsh-lan-proxy)         V='${{ steps.filter.outputs.dsh-lan-proxy }}' ;;
              dsh-plugins-all)       V='${{ steps.filter.outputs.dsh-plugins-all }}' ;;
              *)                     V='false' ;;
            esac
            if [ "$V" = "true" ]; then
              if [ $FIRST -eq 1 ]; then FIRST=0; else HITS="$HITS,"; fi
              HITS="$HITS\"$pkg\""
            fi
          done
          HITS="$HITS]"
          COUNT=$(echo "$HITS" | jq 'length')
          if [ "$COUNT" -eq 0 ]; then
            echo '::notice::无受影响包（docs-only 等）→ 注入占位元素防空矩阵假绿'
            echo "packages=[\"$PLACEHOLDER\"]" >> "$GITHUB_OUTPUT"
          else
            echo "packages=$HITS" >> "$GITHUB_OUTPUT"
            echo "命中包: $HITS"
          fi

  # ── 第 2 段：受影响包并行 build / smoke / typecheck + lib 产物 artifact ──
  build-test:
    name: Build / Test / Typecheck (${{ matrix.package }})
    needs: changes
    if: always() && needs.changes.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        if: matrix.package != '__none__'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        if: matrix.package != '__none__'
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        # 版本以根 package.json 的 packageManager 字段为单一事实源（勿同时指定 version）

      - name: Setup Node.js
        if: matrix.package != '__none__'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: matrix.package != '__none__'
        run: pnpm install --frozen-lockfile

      - name: Build package
        if: matrix.package != '__none__'
        run: pnpm --filter ./packages/${{ matrix.package }} build

      - name: Smoke tests（package）
        if: matrix.package != '__none__'
        run: pnpm --filter ./packages/${{ matrix.package }} test

      - name: Typecheck（package）
        if: matrix.package != '__none__'
        run: pnpm --filter ./packages/${{ matrix.package }} typecheck

      - name: Upload lib artifact（供 repo-gate 全局门禁复用，F9）
        if: matrix.package != '__none__'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lib-${{ matrix.package }}
          path: packages/${{ matrix.package }}/lib
          retention-days: 1
          if-no-files-found: error

  # ── 第 3 段：聚合闸（job 名保持分支保护 required check 名不变，无缝切换）──
  repo-gate:
    name: Build / Contract / Smoke / Pack
    needs: [changes, build-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fail-closed gate assertion（F2：任何上游非 success 即红）
        run: |
          set -e
          echo "changes=${{ needs.changes.result }}  build-test=${{ needs.build-test.result }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::changes 作业未成功（${{ needs.changes.result }}）—— fail-closed"
            exit 1
          fi
          if [ "${{ needs.build-test.result }}" != "success" ]; then
            echo "::error::build-test 存在失败/skipped 实例（${{ needs.build-test.result }}）—— fail-closed"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0   # 阈值单调性校验需读 origin/main 的 config（F3）

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        # 版本以根 package.json 的 packageManager 字段为单一事实源（勿同时指定 version）

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Materialize all build outputs（docs-only 占位场景：本地补全量产物）
        if: contains(fromJSON(needs.changes.outputs.packages), '__none__')
        run: pnpm build

      - name: Download package lib artifacts（F9：复用 matrix 产物避免重复构建）
        if: "!contains(fromJSON(needs.changes.outputs.packages), '__none__')"
        uses: actions/download-artifact@d3f86a106a0bac45b974ac688d36e6010e0d9730 # v4
        with:
          pattern: lib-*
          path: artifacts-tmp

      - name: Restore lib into package trees
        if: "!contains(fromJSON(needs.changes.outputs.packages), '__none__')"
        run: |
          set -e
          for dir in artifacts-tmp/lib-*; do
            pkg="${dir#artifacts-tmp/lib-}"
            mkdir -p "packages/$pkg"
            cp -r "$dir/." "packages/$pkg/"
          done
          ls packages/*/lib/index.js >/dev/null && echo 'lib 产物就位'

      - name: Client contract（客户端契约）
        run: pnpm contract

      - name: Threshold monotonicity（F3：阈值只许升不许降，PR 场景生效）
        if: github.event_name == 'pull_request'
        run: node scripts/gate/threshold-monotonic.mjs origin/main

      - name: Pack check（防发布断链）
        run: pnpm pack:check

      - name: Npm layout（解包后可加载）
        run: pnpm verify:npmlayout

      - name: Aggregate check（聚合 patch 不漂移）
        run: pnpm aggregate:check

      - name: Scripts self-test（维护脚本自测，含 workflow 结构静态断言）
        run: pnpm test:scripts

      - name: Docs check（README/链接/占位符）
        run: pnpm docs:check
