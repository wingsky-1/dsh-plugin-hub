name: Observe (incremental)

# #433 调度重设计 + #572 孤立分支基线：每日四班次增量班（北京 12/16/20/24 = UTC 04/08/12/16）。
# - 基于孤立分支 refs/heads/baseline/mutation 拉取最新基线跑增量变异（快）；
# - 变异产物由 orphan-baseline.mjs push 强推至孤立分支 baseline/mutation；
# - 职责收敛：本班次不跑 cov / self-cov --check / crap / observe-check 报告，
#   只做「恢复基线 → 增量变异 → 推送孤立基线」。
# - #572 方案：基线走孤立分支，彻底剥离 main 分支代码树巨型 JSON 与自动 PR 噪音。

on:
  schedule:
    # 每日四班次增量变异与基线刷新（#433 调度重设计）：北京 12:00/16:00/20:00/24:00
    # = UTC 04:00/08:00/12:00/16:00，均避开整点 Actions 高峰；全量班见 observe.yml
    - cron: '0 4,8,12,16 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  # #572：基线同步统一互斥锁，排队顺序落盘，消除并发覆盖踩踏
  group: mutation-baseline-sync
  cancel-in-progress: false

jobs:
  incremental:
    name: Incremental mutation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        # #572：增量班需读孤立分支 baseline/mutation 上的增量基线（git 浅拉取）
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        # 版本以根 package.json 的 packageManager 字段为单一事实源（勿同时指定 version）

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all
        # 必须全量构建（run #32790425132 教训）：mutate 区间的行号锚定 esbuild
        # 产物分段注释，产物结构依赖 workspace 内联链（shared/ 与依赖包副本）的
        # 全集一致性；单包构建曾因跨包 lib 缺失直接 ERR_MODULE_NOT_FOUND。
        run: pnpm build

      - name: Restore incremental baseline from orphan branch（#572：从孤立分支恢复基线）
        # #572：增量班从孤立分支 refs/heads/baseline/mutation 拉取最新基线，
        # 恢复到 coverage/mutation/ 供 Stryker 增量模式跳过未变 mutant。
        # 孤立分支暂无基线时脚本输出 notice 并安全降级为全量变异（首夜属预期，非缺陷）。
        run: node scripts/gate/orphan-baseline.mjs restore

      - name: Resolve mutation suites（#433 增量班：全量清单，增量模式跳过未变 mutant）
        id: suite-plan
        run: |
          set -e
          # 全量清单（glob conf 目录为单一事实源）——增量模式 stryker 读已恢复的
          # 基线跳过未变 mutant（快）；计划空时 has_suites=false 防空跑
          ls stryker.conf.d/dsh-*.json > /tmp/suites.txt
          echo "has_suites=true" >> "$GITHUB_OUTPUT"

      - name: Mutation suites（串行执行计划内变异配置；单配置失败记账继续跑完，结尾统一判红）
        # id 供 collect 步骤区分「整套 skip（无产物无从收集）」与「部分失败
        # （记账班次已产出的基线照常收集）」（#217）
        id: mutation-suites
        if: steps.suite-plan.outputs.has_suites == 'true'
        # #178 逐包容错：strict 判红路径下 incremental 基线已先落盘（StrykerJS 源码核实），
        # 记账继续可让后续包照常产出报告与基线，避免单包连锁丢弃整班次数据。
        # #220 B 方案：循环清单由 suite-plan 步骤产出（全量 glob），本步骤不关心名单来源
        run: |
          FAILED=0
          FAILED_CONFS=''
          while read -r conf; do
            name="$(basename "$conf" .json)"
            echo "::group::stryker $name"
            if npx stryker run "$conf"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::变异套件失败：$name（记账后继续执行其余配置）"
              FAILED=1
              FAILED_CONFS="$FAILED_CONFS $name"
            fi
          done < /tmp/suites.txt
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::以下变异套件失败，统一判红:$FAILED_CONFS"
            exit 1
          fi

      - name: Push baseline to orphan branch（#572：提交纯文本树到孤立分支）
        # #572：替代旧方案（#204 方案 A：向 main 自动建 PR 提交数十万行 JSON 导致 git 膨胀）。
        # 将最新增量基线以单 commit 纯文本树推送到孤立分支 refs/heads/baseline/mutation，
        # 享受 Git Blob 原生内容去重红利，彻底净化 main 分支代码树与提交历史。
        if: always() && steps.mutation-suites.outcome != 'skipped' && steps.suite-plan.outputs.has_suites == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OBSERVE_PAT: ${{ secrets.OBSERVE_PAT }}
        run: node scripts/gate/orphan-baseline.mjs push

      - name: Upload artifacts（mutation 报告留档）
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: observe-incremental-reports
          path: |
            coverage/mutation/
          retention-days: 14
          if-no-files-found: error   # 报告缺失本身即异常（fail-closed，评审 F4 旁证）
